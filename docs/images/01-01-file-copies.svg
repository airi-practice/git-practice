<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>コピーで増えるファイル</title>
<desc>報告書を書き直すたびにコピーして名前を変えると、報告書.docx、報告書_修正.docx、報告書_最終.docx、報告書_最終_本当に最終.docxとファイルが増える。どれが最新か分からない、前の内容に戻せない、変更点を思い出せないという困りごとが起きる。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">同じ報告書が、コピーでどんどん増えていく</text><text x="30" y="76" font-size="18" fill="#334155" text-anchor="start" font-weight="700">報告書を入れたフォルダの中身</text><rect x="30" y="92" width="350" height="44" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><rect x="44" y="102" width="20" height="24" rx="3" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="76" y="121" font-size="15" fill="#334155" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">報告書.docx</text><rect x="30" y="146" width="350" height="44" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><rect x="44" y="156" width="20" height="24" rx="3" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="76" y="175" font-size="15" fill="#334155" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">報告書_修正.docx</text><rect x="30" y="200" width="350" height="44" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><rect x="44" y="210" width="20" height="24" rx="3" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="76" y="229" font-size="15" fill="#334155" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">報告書_最終.docx</text><rect x="30" y="254" width="350" height="44" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><rect x="44" y="264" width="20" height="24" rx="3" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="76" y="283" font-size="15" fill="#334155" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">報告書_最終_本当に最終.docx</text><rect x="420" y="92" width="350" height="206" rx="12" fill="url(#gRed)" stroke="#c62828" stroke-width="2" filter="url(#sh)"/><text x="440" y="124" font-size="18" fill="#8e1b1b" text-anchor="start" font-weight="700">こんなときに困る</text><text x="440" y="158" font-size="15" fill="#8e1b1b" text-anchor="start">・どれが一番新しいか、分からない</text><text x="440" y="190" font-size="15" fill="#8e1b1b" text-anchor="start">・前の内容に戻したいのに、</text><text x="440" y="222" font-size="15" fill="#8e1b1b" text-anchor="start">&#160;&#160;もう上書きしてしまった</text><text x="440" y="254" font-size="15" fill="#8e1b1b" text-anchor="start">・どこを変えたのか、思い出せない</text><g transform="translate(70 352) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="130" y="316" width="290" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="130,346.0 116,354.0 130,362.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="129" y="347.0" width="3" height="14" fill="#ffffff"/><text x="275.0" y="337.0" font-size="16" fill="#5c3d00" text-anchor="middle">ファイルが増えるほど、</text><text x="275.0" y="359.0" font-size="16" fill="#5c3d00" text-anchor="middle">名前だけで中身を</text><text x="275.0" y="381.0" font-size="16" fill="#5c3d00" text-anchor="middle">覚えておくのは大変だよ</text>
</svg>
