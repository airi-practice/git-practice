<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>ゲームのセーブとロード</title>
<desc>ゲームを進めながらセーブ1、セーブ2、セーブ3と途中でセーブする。そのあと失敗しても、ロードすればセーブ3の時点に戻ってやり直せる。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="300" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">ゲームを進めながら、途中でセーブする</text><rect x="40" y="80" width="150" height="56" rx="12" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="115" y="115" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">セーブ1</text><rect x="250" y="80" width="150" height="56" rx="12" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="325" y="115" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">セーブ2</text><rect x="460" y="80" width="150" height="56" rx="12" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="535" y="115" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">セーブ3</text><line x1="193" y1="108" x2="247" y2="108" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="220" y="94" font-size="13" fill="#334155" text-anchor="middle">進める</text><line x1="403" y1="108" x2="457" y2="108" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="430" y="94" font-size="13" fill="#334155" text-anchor="middle">進める</text><line x1="613" y1="108" x2="667" y2="108" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="640" y="94" font-size="13" fill="#334155" text-anchor="middle">進める</text><rect x="670" y="80" width="90" height="56" rx="12" fill="url(#gRed)" stroke="#c62828" stroke-width="2" filter="url(#sh)"/><text x="715" y="115" font-size="18" fill="#8e1b1b" text-anchor="middle" font-weight="700">失敗!</text><path d="M715 142 Q640 215 548 146" fill="none" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="640" y="214" font-size="15" fill="#334155" text-anchor="middle">ロードすると、セーブ3の</text><text x="640" y="238" font-size="15" fill="#334155" text-anchor="middle">時点に戻ってやり直せる</text><g transform="translate(60 232) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="122" y="192" width="250" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="122,222.0 108,230.0 122,238.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="121" y="223.0" width="3" height="14" fill="#ffffff"/><text x="247.0" y="213.0" font-size="16" fill="#5c3d00" text-anchor="middle">セーブしておけば、</text><text x="247.0" y="235.0" font-size="16" fill="#5c3d00" text-anchor="middle">失敗しても</text><text x="247.0" y="257.0" font-size="16" fill="#5c3d00" text-anchor="middle">そこから再開できるよ</text>
</svg>
