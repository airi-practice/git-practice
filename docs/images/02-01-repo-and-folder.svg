<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>作業フォルダとリポジトリ</title>
<desc>作業フォルダは、memo.txtのようなファイルを開いて書き換える場所。リポジトリは、記録をしまっておく場所で、図は記録が3回分たまった例。ゲームにたとえると、作業フォルダは今遊んでいる画面で、リポジトリはセーブデータをしまっておく場所に当たる。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="460" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">ファイルを触る場所と、記録をしまう場所</text><rect x="30" y="64" width="340" height="170" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="200" y="96" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">作業フォルダ</text><text x="200" y="120" font-size="13" fill="#334155" text-anchor="middle">ふだんファイルを開いて書き換える場所</text><rect x="80" y="138" width="240" height="70" rx="8" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="200" y="166" font-size="15" fill="#334155" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">memo.txt</text><text x="200" y="190" font-size="13" fill="#334155" text-anchor="middle">今の内容</text><line x1="375" y1="150" x2="425" y2="150" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="400" y="134" font-size="13" fill="#334155" text-anchor="middle">記録</text><rect x="430" y="64" width="340" height="170" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="600" y="96" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">リポジトリ</text><text x="600" y="120" font-size="13" fill="#334155" text-anchor="middle">記録をしまっておく場所</text><rect x="466" y="138" width="80" height="50" rx="8" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="506" y="170" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">記録1</text><rect x="556" y="138" width="80" height="50" rx="8" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="596" y="170" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">記録2</text><rect x="646" y="138" width="80" height="50" rx="8" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="686" y="170" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">記録3</text><text x="600" y="214" font-size="13" fill="#334155" text-anchor="middle">例: 記録が3回分たまったときの様子</text><rect x="30" y="256" width="740" height="84" rx="12" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="50" y="286" font-size="18" fill="#8a5a00" text-anchor="start" font-weight="700">ゲームにたとえると</text><text x="50" y="316" font-size="15" fill="#8a5a00" text-anchor="start">作業フォルダは、今遊んでいる画面。リポジトリは、セーブデータをしまっておく場所だよ。</text><g transform="translate(70 392) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="130" y="349.0" width="280" height="98" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="130,390.0 116,398.0 130,406.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="129" y="391.0" width="3" height="14" fill="#ffffff"/><text x="270.0" y="381.0" font-size="16" fill="#5c3d00" text-anchor="middle">ファイルを書き換える場所と、</text><text x="270.0" y="403.0" font-size="16" fill="#5c3d00" text-anchor="middle">記録をしまう場所は、</text><text x="270.0" y="425.0" font-size="16" fill="#5c3d00" text-anchor="middle">役割が別なんだよ</text>
</svg>
