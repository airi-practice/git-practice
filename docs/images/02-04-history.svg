<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>コミットを重ねると記録が積み上がる</title>
<desc>1回目のコミットでは、はじめてのメモの1行だけのmemo.txtを記録1として残す。2行目を書き足して2回目のコミットをすると、記録2が増える。記録1の内容は、記録2を作ったあともリポジトリに残っている。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">コミットを重ねると、記録が積み上がる</text><rect x="30" y="64" width="330" height="180" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="50" y="96" font-size="18" fill="#334155" text-anchor="start" font-weight="700">記録1</text><text x="50" y="120" font-size="13" fill="#334155" text-anchor="start">メッセージ: memo.txt を作成</text><rect x="50" y="134" width="290" height="90" rx="8" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="64" y="156" font-size="13" fill="#334155" text-anchor="start">memo.txt の中身</text><text x="64" y="184" font-size="15" fill="#1e293b" text-anchor="start">はじめてのメモ</text><rect x="440" y="64" width="330" height="180" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="460" y="96" font-size="18" fill="#334155" text-anchor="start" font-weight="700">記録2</text><text x="460" y="120" font-size="13" fill="#334155" text-anchor="start">メッセージ: 2行目を追加</text><rect x="460" y="134" width="290" height="90" rx="8" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="474" y="156" font-size="13" fill="#334155" text-anchor="start">memo.txt の中身</text><text x="474" y="184" font-size="15" fill="#1e293b" text-anchor="start">はじめてのメモ</text><text x="474" y="210" font-size="15" fill="#1e293b" text-anchor="start">2行目を書き足した</text><line x1="365" y1="154" x2="435" y2="154" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="400" y="138" font-size="13" fill="#334155" text-anchor="middle">2回目</text><rect x="30" y="266" width="740" height="70" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="50" y="296" font-size="15" fill="#334155" text-anchor="start">記録1の内容は、記録2を作ったあとも、リポジトリに残っている。</text><text x="50" y="320" font-size="15" fill="#334155" text-anchor="start">作業フォルダの memo.txt は、いちばん新しい記録2の内容になっている。</text><g transform="translate(70 382) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="130" y="350.0" width="250" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="130,380.0 116,388.0 130,396.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="129" y="381.0" width="3" height="14" fill="#ffffff"/><text x="255.0" y="382.0" font-size="16" fill="#5c3d00" text-anchor="middle">上書きしても、</text><text x="255.0" y="404.0" font-size="16" fill="#5c3d00" text-anchor="middle">前の記録は消えないんだ</text>
</svg>
