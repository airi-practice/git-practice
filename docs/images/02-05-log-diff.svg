<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>履歴と差分</title>
<desc>履歴(ログ)には、記録が新しい順に並ぶ。記録を選ぶと、その記録で何が変わったかが差分として表示される。2行目を追加の記録では、2行目を書き足した行が追加された行として色付きで示される。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="390" fill="#ffffff"/>
<rect x="30" y="56" width="340" height="210" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="50" y="88" font-size="18" fill="#334155" text-anchor="start" font-weight="700">履歴(ログ)</text><text x="50" y="112" font-size="13" fill="#334155" text-anchor="start">記録が、新しい順に並ぶ</text><rect x="50" y="128" width="300" height="44" rx="6" fill="#e2e8f0" stroke="#555555" stroke-width="2"/><text x="64" y="156" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700">2行目を追加</text><text x="336" y="156" font-size="13" fill="#334155" text-anchor="end">新しい</text><rect x="50" y="182" width="300" height="44" rx="6" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="64" y="210" font-size="15" fill="#1e293b" text-anchor="start">memo.txt を作成</text><text x="336" y="210" font-size="13" fill="#334155" text-anchor="end">古い</text><line x1="375" y1="150" x2="425" y2="150" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="430" y="56" width="340" height="210" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="450" y="88" font-size="18" fill="#334155" text-anchor="start" font-weight="700">差分(記録の前後の違い)</text><text x="450" y="112" font-size="13" fill="#334155" text-anchor="start">選んだ記録で、何が変わったか</text><rect x="450" y="128" width="300" height="98" rx="6" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="464" y="156" font-size="15" fill="#1e293b" text-anchor="start" font-family="Consolas,'Courier New',monospace">&#160;&#160;はじめてのメモ</text><rect x="451" y="168" width="298" height="30" fill="#e8f5e9"/><text x="464" y="189" font-size="15" fill="#1b4d1f" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">+ 2行目を書き足した</text><text x="450" y="248" font-size="13" fill="#334155" text-anchor="start">追加された行は、色が付いて示される</text><g transform="translate(70 322) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="130" y="279.0" width="280" height="98" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="130,320.0 116,328.0 130,336.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="129" y="321.0" width="3" height="14" fill="#ffffff"/><text x="270.0" y="311.0" font-size="16" fill="#5c3d00" text-anchor="middle">メッセージを付けておくと、</text><text x="270.0" y="333.0" font-size="16" fill="#5c3d00" text-anchor="middle">履歴を見るだけで</text><text x="270.0" y="355.0" font-size="16" fill="#5c3d00" text-anchor="middle">何をしたか分かるよ</text>
</svg>
