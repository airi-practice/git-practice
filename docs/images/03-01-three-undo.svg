<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>取り消しの3つの方法</title>
<desc>まだコミットしていない変更をなかったことにしたいときは、変更を捨てる(メニュー名はRevert...)。コミットした変更を取り消したいときは、打ち消す(メニュー名はRevert change by this commit)。上の2つは別々の操作である。過去の時点まで戻してあとの記録を消したいときは、過去の時点に戻す(Reset)が、あとの記録が消えるので危険である。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="400" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">取り消したい場面で、使う方法が変わる</text><rect x="30" y="62" width="360" height="68" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="50" y="92" font-size="15" fill="#334155" text-anchor="start">まだコミットしていない変更を、</text><text x="50" y="116" font-size="15" fill="#334155" text-anchor="start">なかったことにしたい</text><line x1="396" y1="96" x2="454" y2="96" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="460" y="62" width="310" height="68" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="615" y="92" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">変更を捨てる</text><text x="615" y="116" font-size="13" fill="#334155" text-anchor="middle">Revert...(最後に記録した状態に戻る)</text><rect x="30" y="146" width="360" height="68" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="50" y="176" font-size="15" fill="#334155" text-anchor="start">コミットした変更を、</text><text x="50" y="200" font-size="15" fill="#334155" text-anchor="start">取り消したい</text><line x1="396" y1="180" x2="454" y2="180" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="460" y="146" width="310" height="68" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="615" y="176" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">打ち消す</text><text x="615" y="200" font-size="13" fill="#334155" text-anchor="middle">Revert change by this commit</text><rect x="30" y="230" width="360" height="68" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="50" y="260" font-size="15" fill="#334155" text-anchor="start">過去の時点まで戻して、</text><text x="50" y="284" font-size="15" fill="#334155" text-anchor="start">あとの記録を消したい</text><line x1="396" y1="264" x2="454" y2="264" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="460" y="230" width="310" height="68" rx="10" fill="url(#gRed)" stroke="#c62828" stroke-width="2" filter="url(#sh)"/><text x="615" y="260" font-size="18" fill="#8e1b1b" text-anchor="middle" font-weight="700">過去の時点に戻す</text><text x="615" y="284" font-size="13" fill="#8e1b1b" text-anchor="middle">Reset(あとの記録が消えるので危険)</text><text x="470" y="326" font-size="13" fill="#334155" text-anchor="start">上と真ん中は、どちらもメニュー名に</text><text x="470" y="346" font-size="13" fill="#334155" text-anchor="start">Revert が入るが、別々の操作だよ</text><g transform="translate(60 342) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="122" y="308" width="330" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="122,338.0 108,346.0 122,354.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="121" y="339.0" width="3" height="14" fill="#ffffff"/><text x="287.0" y="329.0" font-size="16" fill="#5c3d00" text-anchor="middle">まずは一番上と真ん中の</text><text x="287.0" y="351.0" font-size="16" fill="#5c3d00" text-anchor="middle">方法で足りるか考えるよ</text><text x="287.0" y="373.0" font-size="16" fill="#5c3d00" text-anchor="middle">一番下は最後の手段なんだ</text>
</svg>
