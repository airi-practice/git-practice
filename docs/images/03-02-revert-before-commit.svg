<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>コミット前の変更を捨てる</title>
<desc>最後に記録した状態から、memo.txtを書き換えた。まだコミットしていない状態で変更を捨てる(Revert...)と、最後に記録した状態になり、書き換えた内容はなくなる。書き換えた内容は記録されていないので、二度と取り出せない。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="390" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">変更を捨てると、最後に記録した状態になる</text><rect x="30" y="70" width="210" height="96" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="135" y="104" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">最後に記録した状態</text><text x="135" y="134" font-size="13" fill="#334155" text-anchor="middle">memo.txt の内容は</text><text x="135" y="152" font-size="13" fill="#334155" text-anchor="middle">ここで記録したもの</text><line x1="244" y1="118" x2="296" y2="118" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="300" y="70" width="210" height="96" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="405" y="104" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">memo.txt を書き換えた</text><text x="405" y="134" font-size="13" fill="#334155" text-anchor="middle">まだコミットしていない</text><text x="405" y="152" font-size="13" fill="#334155" text-anchor="middle">変更がある状態</text><line x1="514" y1="118" x2="566" y2="118" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="540" y="106" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Revert...</text><rect x="570" y="70" width="200" height="96" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="670" y="104" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">最後に記録した状態</text><text x="670" y="134" font-size="13" fill="#334155" text-anchor="middle">書き換えた内容が</text><text x="670" y="152" font-size="13" fill="#334155" text-anchor="middle">なくなる</text><rect x="30" y="196" width="740" height="64" rx="10" fill="url(#gRed)" stroke="#c62828" stroke-width="2" filter="url(#sh)"/><text x="50" y="224" font-size="15" fill="#8e1b1b" text-anchor="start" font-weight="700">注意: まだコミットしていない変更は、どこにも記録されていない</text><text x="50" y="248" font-size="15" fill="#8e1b1b" text-anchor="start">捨てると、書き換えた内容は二度と取り出せないよ</text><g transform="translate(-1.4 75.5) scale(0.558)"><ellipse cx="110" cy="550" rx="48" ry="6" fill="#1E293B" opacity="0.15"/><g transform="translate(0 0)"><path d="M142 534 C190 540 200 490 180 468" fill="none" stroke="#E08A3C" stroke-width="15" stroke-linecap="round"/><circle cx="180" cy="468" r="8" fill="#FFF1DC"/><ellipse cx="110" cy="518" rx="36" ry="32" fill="#F2A04A"/><ellipse cx="110" cy="524" rx="20" ry="22" fill="#FFF1DC"/><ellipse cx="92" cy="545" rx="13" ry="7" fill="#FFF1DC"/><ellipse cx="128" cy="545" rx="13" ry="7" fill="#FFF1DC"/><path d="M82 512 L76 534" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="76" cy="534" r="9.5" fill="#FFF1DC"/><path d="M138 504 L170 470" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="170" cy="470" r="9.5" fill="#FFF1DC"/><g transform="rotate(-5 110 490)"><path d="M60 432 L58 392 L98 410 z M160 432 L162 392 L122 410 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="10" stroke-linejoin="round"/><path d="M68 420 L67 402 L86 410 z M152 420 L153 402 L134 410 z" fill="#F9A8B8" stroke="#F9A8B8" stroke-width="4" stroke-linejoin="round"/><path d="M50 466 l-11 3 l10 7 z M170 466 l11 3 l-10 7 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="3" stroke-linejoin="round"/><ellipse cx="110" cy="452" rx="62" ry="52" fill="#F2A04A"/><ellipse cx="110" cy="468" rx="30" ry="22" fill="#FFF1DC"/><path d="M110 402 v13 M95 405 l3 11 M125 405 l-3 11" fill="none" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/><ellipse cx="68" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><ellipse cx="152" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><path d="M62 472 l4 6 M69 471 l4 6 M147 471 l4 6 M154 472 l4 6" stroke="#F0708A" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="82" cy="452" rx="12" ry="15" fill="#1E293B"/><ellipse cx="138" cy="452" rx="12" ry="15" fill="#1E293B"/><circle cx="86" cy="446" r="5" fill="#fff"/><circle cx="142" cy="446" r="5" fill="#fff"/><circle cx="78" cy="459" r="2.4" fill="#fff"/><circle cx="134" cy="459" r="2.4" fill="#fff"/><path d="M105 466 h10 l-5 5 z" fill="#F9768B" stroke="#F9768B" stroke-width="2" stroke-linejoin="round"/><path d="M110 471 q-6 8 -12 1 M110 471 q6 8 12 1" fill="none" stroke="#7C4A1E" stroke-width="2.2" stroke-linecap="round"/><g stroke="#7C4A1E" stroke-width="1.8" stroke-linecap="round" opacity="0.55"><path d="M60 464 l-12 -3 M60 470 l-12 3 M160 464 l12 -3 M160 470 l12 3"/></g></g><path d="M80 497 q30 16 60 0" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="507" r="6" fill="#FBBF24" stroke="#D99A06" stroke-width="1.5"/><path d="M110 510 v3" stroke="#D99A06" stroke-width="2" stroke-linecap="round"/></g></g><rect x="122" y="284" width="330" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="122,314.0 108,322.0 122,330.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="121" y="315.0" width="3" height="14" fill="#ffffff"/><text x="287.0" y="316.0" font-size="16" fill="#5c3d00" text-anchor="middle">ゲームで、セーブしていない</text><text x="287.0" y="338.0" font-size="16" fill="#5c3d00" text-anchor="middle">進み具合が消えるのと同じだよ</text>
</svg>
