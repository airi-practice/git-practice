<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>コミット前の変更を捨てる</title>
<desc>最後に記録した状態から、memo.txtを書き換えた。まだコミットしていない状態で変更を捨てる(Revert...)と、最後に記録した状態に戻り、書き換えた内容はなくなる。書き換えた内容は記録されていないので、二度と取り出せない。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="390" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">変更を捨てると、最後に記録した状態に戻る</text><rect x="30" y="70" width="210" height="96" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="135" y="104" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">最後に記録した状態</text><text x="135" y="134" font-size="13" fill="#334155" text-anchor="middle">memo.txt の内容は</text><text x="135" y="152" font-size="13" fill="#334155" text-anchor="middle">ここで記録したもの</text><line x1="244" y1="118" x2="296" y2="118" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="300" y="70" width="210" height="96" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="405" y="104" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">memo.txt を書き換えた</text><text x="405" y="134" font-size="13" fill="#334155" text-anchor="middle">まだコミットしていない</text><text x="405" y="152" font-size="13" fill="#334155" text-anchor="middle">変更がある状態</text><line x1="514" y1="118" x2="566" y2="118" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="540" y="106" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Revert...</text><rect x="570" y="70" width="200" height="96" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="670" y="104" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">最後に記録した状態</text><text x="670" y="134" font-size="13" fill="#334155" text-anchor="middle">書き換えた内容が</text><text x="670" y="152" font-size="13" fill="#334155" text-anchor="middle">なくなる</text><rect x="30" y="196" width="740" height="64" rx="10" fill="url(#gRed)" stroke="#c62828" stroke-width="2" filter="url(#sh)"/><text x="50" y="224" font-size="15" fill="#8e1b1b" text-anchor="start" font-weight="700">注意: まだコミットしていない変更は、どこにも記録されていない</text><text x="50" y="248" font-size="15" fill="#8e1b1b" text-anchor="start">捨てると、書き換えた内容は二度と取り出せないよ</text><g transform="translate(60 322) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="122" y="284" width="330" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="122,314.0 108,322.0 122,330.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="121" y="315.0" width="3" height="14" fill="#ffffff"/><text x="287.0" y="316.0" font-size="16" fill="#5c3d00" text-anchor="middle">ゲームで、セーブしていない</text><text x="287.0" y="338.0" font-size="16" fill="#5c3d00" text-anchor="middle">進み具合が消えるのと同じだよ</text>
</svg>
