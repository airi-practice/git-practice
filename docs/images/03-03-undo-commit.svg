<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" width="800" height="385" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>コミットした変更を打ち消す</title>
<desc>記録1、記録2(失敗した変更)と並んでいる履歴に、記録2を打ち消す記録3が新しく増える。記録2は消えずに残り、memo.txtの内容は記録1と同じになる。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="385" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">記録は消さずに、打ち消しの記録を足す(記録の数は例)</text><rect x="30" y="70" width="200" height="70" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="130" y="112" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">記録1</text><text x="130" y="168" font-size="13" fill="#334155" text-anchor="middle">memo.txt は元の内容</text><line x1="234" y1="105" x2="286" y2="105" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="290" y="70" width="200" height="70" rx="12" fill="url(#gRed)" stroke="#c62828" stroke-width="2" filter="url(#sh)"/><text x="390" y="112" font-size="18" fill="#8e1b1b" text-anchor="middle" font-weight="700">記録2(失敗した変更)</text><text x="390" y="168" font-size="13" fill="#334155" text-anchor="middle">memo.txt が1行増えた</text><line x1="494" y1="105" x2="546" y2="105" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="550" y="70" width="220" height="70" rx="12" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="660" y="112" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">記録3(打ち消し)</text><text x="660" y="168" font-size="13" fill="#334155" text-anchor="middle">memo.txt が記録1と同じ内容に</text><text x="660" y="62" font-size="13" fill="#8a5a00" text-anchor="middle" font-weight="700">新しく増える</text><text x="390" y="62" font-size="13" fill="#8e1b1b" text-anchor="middle" font-weight="700">そのまま残る</text><rect x="30" y="200" width="740" height="56" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="50" y="234" font-size="15" fill="#334155" text-anchor="start">通常、履歴は前に進むだけで書き換わらない。だから、打ち消したことも履歴に残る</text><g transform="translate(60 318) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="122" y="286" width="330" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="122,316.0 108,324.0 122,332.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="121" y="317.0" width="3" height="14" fill="#ffffff"/><text x="287.0" y="318.0" font-size="16" fill="#5c3d00" text-anchor="middle">失敗した記録は残したまま、</text><text x="287.0" y="340.0" font-size="16" fill="#5c3d00" text-anchor="middle">内容だけを元に戻すんだ</text>
</svg>
