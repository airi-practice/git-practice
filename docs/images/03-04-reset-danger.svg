<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>過去の時点に戻す(Reset)の注意</title>
<desc>記録1、記録2、記録3が並ぶ履歴で、記録1の時点までResetすると、履歴には記録1だけが残り、記録2と記録3は履歴から見えなくなる。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="400" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#8e1b1b" text-anchor="start" font-weight="700">過去の時点に戻すと、あとの記録が履歴から見えなくなる</text><text x="30" y="76" font-size="18" fill="#334155" text-anchor="start" font-weight="700">戻す前の履歴(記録の数は例)</text><rect x="30" y="88" width="220" height="52" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="140" y="120" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">記録1</text><rect x="290" y="88" width="220" height="52" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="400" y="120" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">記録2</text><rect x="550" y="88" width="220" height="52" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="660" y="120" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">記録3</text><line x1="254" y1="114" x2="286" y2="114" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><line x1="514" y1="114" x2="546" y2="114" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><line x1="140" y1="150" x2="140" y2="196" stroke="#c62828" stroke-width="3" marker-end="url(#ar)"/><text x="156" y="180" font-size="15" fill="#8e1b1b" text-anchor="start" font-weight="700">記録1の時点まで戻す(Reset)</text><text x="30" y="226" font-size="18" fill="#334155" text-anchor="start" font-weight="700">戻したあとの履歴</text><rect x="30" y="238" width="220" height="52" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="140" y="270" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">記録1</text><rect x="290" y="238" width="220" height="52" rx="12" fill="#ffffff" stroke="#c62828" stroke-width="2" stroke-dasharray="7 5"/><text x="400" y="270" font-size="18" fill="#8e1b1b" text-anchor="middle" font-weight="700">記録2(見えない)</text><rect x="550" y="238" width="220" height="52" rx="12" fill="#ffffff" stroke="#c62828" stroke-width="2" stroke-dasharray="7 5"/><text x="660" y="270" font-size="18" fill="#8e1b1b" text-anchor="middle" font-weight="700">記録3(見えない)</text><g transform="translate(60 342) scale(0.85)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="122" y="310" width="330" height="56" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="122,330.0 108,338.0 122,346.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="121" y="331.0" width="3" height="14" fill="#ffffff"/><text x="287.0" y="343.0" font-size="16" fill="#5c3d00" text-anchor="middle">あとの記録まで見えなくなるから、慎重にね</text>
</svg>
