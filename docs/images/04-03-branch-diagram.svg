<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>記録の流れが枝分かれする様子</title>
<desc>mainブランチには記録1から記録3までが並んでいる。記録3から枝分かれして、add-lineブランチに記録4と記録5が積まれる。mainブランチの記録は変わらない。図の記録の数は例である。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<linearGradient id="gGrn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f5e9"/><stop offset="1" stop-color="#c8e6c9"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="440" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">ブランチは、記録の流れの枝分かれ</text><text x="30" y="76" font-size="13" fill="#334155" text-anchor="start">※図は例。記録の数は、自分の履歴と違ってもいい</text><rect x="380" y="56" width="80" height="28" rx="8" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="420" y="76" font-size="15" fill="#334155" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">main</text><rect x="50" y="100" width="100" height="44" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="100" y="129" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">記録1</text><rect x="210" y="100" width="100" height="44" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="260" y="129" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">記録2</text><rect x="370" y="100" width="100" height="44" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="420" y="129" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">記録3</text><line x1="152" y1="122" x2="208" y2="122" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><line x1="312" y1="122" x2="368" y2="122" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><path d="M440 150 Q440 252 516 252" fill="none" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="240" y="232" font-size="15" fill="#334155" text-anchor="start">ここから枝分かれ</text><rect x="520" y="230" width="100" height="44" rx="10" fill="url(#gGrn)" stroke="#2e7d32" stroke-width="2" filter="url(#sh)"/><text x="570" y="259" font-size="15" fill="#1b4d1f" text-anchor="middle" font-weight="700">記録4</text><line x1="622" y1="252" x2="678" y2="252" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="680" y="230" width="100" height="44" rx="10" fill="url(#gGrn)" stroke="#2e7d32" stroke-width="2" filter="url(#sh)"/><text x="730" y="259" font-size="15" fill="#1b4d1f" text-anchor="middle" font-weight="700">記録5</text><rect x="670" y="186" width="120" height="28" rx="8" fill="url(#gGrn)" stroke="#2e7d32" stroke-width="2" filter="url(#sh)"/><text x="730" y="206" font-size="15" fill="#1b4d1f" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">add-line</text><rect x="30" y="300" width="20" height="20" rx="4" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="60" y="316" font-size="15" fill="#334155" text-anchor="start">前からある記録</text><rect x="230" y="300" width="20" height="20" rx="4" fill="url(#gGrn)" stroke="#2e7d32" stroke-width="2" filter="url(#sh)"/><text x="260" y="316" font-size="15" fill="#1b4d1f" text-anchor="start">ブランチで新しく積んだ記録</text><g transform="translate(70 372) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="130" y="342" width="330" height="70" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="130,369.0 116,377.0 130,385.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="129" y="370.0" width="3" height="14" fill="#ffffff"/><text x="295.0" y="371.0" font-size="16" fill="#5c3d00" text-anchor="middle">枝ごとに、記録を</text><text x="295.0" y="393.0" font-size="16" fill="#5c3d00" text-anchor="middle">別々に積み重ねられるよ</text>
</svg>
