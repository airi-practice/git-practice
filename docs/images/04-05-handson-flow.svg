<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>ブランチを作って切り替える手順</title>
<desc>手順は5つ。1.ブランチを作る。2.memo.txtを編集してコミットする。3.ログで枝の位置を確かめる。4.mainに切り替えて、追加した行が消えているのを確かめる。5.add-lineに切り替えて、追加した行が戻っているのを確かめる。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<linearGradient id="gGrn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f5e9"/><stop offset="1" stop-color="#c8e6c9"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="380" fill="#ffffff"/>
<rect x="70" y="20" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="47" r="16" fill="#555555"/><text x="40" y="53" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="88" y="45" font-size="18" fill="#334155" text-anchor="start" font-weight="700">ブランチを作る</text><text x="88" y="64" font-size="13" fill="#334155" text-anchor="start">右クリック → TortoiseGit → Create Branch...</text><line x1="40" y1="64" x2="40" y2="96" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="86" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="113" r="16" fill="#555555"/><text x="40" y="119" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="88" y="111" font-size="18" fill="#334155" text-anchor="start" font-weight="700">memo.txt を編集してコミットする</text><text x="88" y="130" font-size="13" fill="#334155" text-anchor="start">1行追加して保存し、Git Commit... で記録する</text><line x1="40" y1="130" x2="40" y2="162" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="152" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="179" r="16" fill="#555555"/><text x="40" y="185" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="88" y="177" font-size="18" fill="#334155" text-anchor="start" font-weight="700">ログで枝の位置を確かめる</text><text x="88" y="196" font-size="13" fill="#334155" text-anchor="start">右クリック → TortoiseGit → Show log</text><line x1="40" y1="196" x2="40" y2="228" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="218" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="245" r="16" fill="#555555"/><text x="40" y="251" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="88" y="243" font-size="18" fill="#334155" text-anchor="start" font-weight="700">main に切り替える</text><text x="88" y="262" font-size="13" fill="#334155" text-anchor="start">Switch/Checkout... で選び、追加した行が消えているのを確かめる</text><line x1="40" y1="262" x2="40" y2="294" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="284" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="311" r="16" fill="#555555"/><text x="40" y="317" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="88" y="309" font-size="18" fill="#334155" text-anchor="start" font-weight="700">add-line に切り替える</text><text x="88" y="328" font-size="13" fill="#334155" text-anchor="start">Switch/Checkout... で選び、追加した行が戻っているのを確かめる</text><rect x="630" y="160" width="160" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="702,236 718,236 710,252" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="703" y="234" width="14" height="3" fill="#ffffff"/><text x="710" y="183" font-size="16" fill="#5c3d00" text-anchor="middle">手順どおりに</text><text x="710" y="205" font-size="16" fill="#5c3d00" text-anchor="middle">進めれば</text><text x="710" y="227" font-size="16" fill="#5c3d00" text-anchor="middle">大丈夫だよ</text><g transform="translate(710 302) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g>
</svg>
