<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>ブランチを作って切り替える手順</title>
<desc>手順は5つ。1.ブランチを作る。2.memo.txtを編集してコミットする。3.ログで枝の位置を確かめる。4.mainに切り替えて、追加した行が消えているのを確かめる。5.add-lineに切り替えて、追加した行が戻っているのを確かめる。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<linearGradient id="gGrn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f5e9"/><stop offset="1" stop-color="#c8e6c9"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="380" fill="#ffffff"/>
<rect x="70" y="20" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="47" r="16" fill="#555555"/><text x="40" y="53" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="88" y="45" font-size="18" fill="#334155" text-anchor="start" font-weight="700">ブランチを作る</text><text x="88" y="64" font-size="13" fill="#334155" text-anchor="start">右クリック → TortoiseGit → Create Branch...</text><line x1="40" y1="64" x2="40" y2="96" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="86" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="113" r="16" fill="#555555"/><text x="40" y="119" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="88" y="111" font-size="18" fill="#334155" text-anchor="start" font-weight="700">memo.txt を編集してコミットする</text><text x="88" y="130" font-size="13" fill="#334155" text-anchor="start">1行追加して保存し、Git Commit... で記録する</text><line x1="40" y1="130" x2="40" y2="162" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="152" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="179" r="16" fill="#555555"/><text x="40" y="185" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="88" y="177" font-size="18" fill="#334155" text-anchor="start" font-weight="700">ログで枝の位置を確かめる</text><text x="88" y="196" font-size="13" fill="#334155" text-anchor="start">右クリック → TortoiseGit → Show log</text><line x1="40" y1="196" x2="40" y2="228" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="218" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="245" r="16" fill="#555555"/><text x="40" y="251" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="88" y="243" font-size="18" fill="#334155" text-anchor="start" font-weight="700">main に切り替える</text><text x="88" y="262" font-size="13" fill="#334155" text-anchor="start">Switch/Checkout... で選び、追加した行が消えているのを確かめる</text><line x1="40" y1="262" x2="40" y2="294" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="284" width="540" height="54" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="40" cy="311" r="16" fill="#555555"/><text x="40" y="317" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="88" y="309" font-size="18" fill="#334155" text-anchor="start" font-weight="700">add-line に切り替える</text><text x="88" y="328" font-size="13" fill="#334155" text-anchor="start">Switch/Checkout... で選び、追加した行が戻っているのを確かめる</text><rect x="630" y="160" width="160" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="702,236 718,236 710,252" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="703" y="234" width="14" height="3" fill="#ffffff"/><text x="710" y="183" font-size="16" fill="#5c3d00" text-anchor="middle">手順どおりに</text><text x="710" y="205" font-size="16" fill="#5c3d00" text-anchor="middle">進めれば</text><text x="710" y="227" font-size="16" fill="#5c3d00" text-anchor="middle">大丈夫だよ</text><g transform="translate(648.6 55.5) scale(0.558)"><ellipse cx="110" cy="550" rx="48" ry="6" fill="#1E293B" opacity="0.15"/><g transform="translate(0 0)"><path d="M142 534 C190 540 200 490 180 468" fill="none" stroke="#E08A3C" stroke-width="15" stroke-linecap="round"/><circle cx="180" cy="468" r="8" fill="#FFF1DC"/><ellipse cx="110" cy="518" rx="36" ry="32" fill="#F2A04A"/><ellipse cx="110" cy="524" rx="20" ry="22" fill="#FFF1DC"/><ellipse cx="92" cy="545" rx="13" ry="7" fill="#FFF1DC"/><ellipse cx="128" cy="545" rx="13" ry="7" fill="#FFF1DC"/><path d="M82 512 L76 534" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="76" cy="534" r="9.5" fill="#FFF1DC"/><path d="M138 504 L170 470" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="170" cy="470" r="9.5" fill="#FFF1DC"/><g transform="rotate(-5 110 490)"><path d="M60 432 L58 392 L98 410 z M160 432 L162 392 L122 410 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="10" stroke-linejoin="round"/><path d="M68 420 L67 402 L86 410 z M152 420 L153 402 L134 410 z" fill="#F9A8B8" stroke="#F9A8B8" stroke-width="4" stroke-linejoin="round"/><path d="M50 466 l-11 3 l10 7 z M170 466 l11 3 l-10 7 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="3" stroke-linejoin="round"/><ellipse cx="110" cy="452" rx="62" ry="52" fill="#F2A04A"/><ellipse cx="110" cy="468" rx="30" ry="22" fill="#FFF1DC"/><path d="M110 402 v13 M95 405 l3 11 M125 405 l-3 11" fill="none" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/><ellipse cx="68" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><ellipse cx="152" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><path d="M62 472 l4 6 M69 471 l4 6 M147 471 l4 6 M154 472 l4 6" stroke="#F0708A" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="82" cy="452" rx="12" ry="15" fill="#1E293B"/><ellipse cx="138" cy="452" rx="12" ry="15" fill="#1E293B"/><circle cx="86" cy="446" r="5" fill="#fff"/><circle cx="142" cy="446" r="5" fill="#fff"/><circle cx="78" cy="459" r="2.4" fill="#fff"/><circle cx="134" cy="459" r="2.4" fill="#fff"/><path d="M105 466 h10 l-5 5 z" fill="#F9768B" stroke="#F9768B" stroke-width="2" stroke-linejoin="round"/><path d="M110 471 q-6 8 -12 1 M110 471 q6 8 12 1" fill="none" stroke="#7C4A1E" stroke-width="2.2" stroke-linecap="round"/><g stroke="#7C4A1E" stroke-width="1.8" stroke-linecap="round" opacity="0.55"><path d="M60 464 l-12 -3 M60 470 l-12 3 M160 464 l12 -3 M160 470 l12 3"/></g></g><path d="M80 497 q30 16 60 0" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="507" r="6" fill="#FBBF24" stroke="#D99A06" stroke-width="1.5"/><path d="M110 510 v3" stroke="#D99A06" stroke-width="2" stroke-linecap="round"/></g></g>
</svg>
