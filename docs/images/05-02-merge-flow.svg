<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>マージで変更が1つにまとまる</title>
<desc>mainから分かれたfeature-aで変更を進める。mainでも別の変更が進む。feature-aの変更をmainにマージすると、2つの変更がmainに取り込まれ、マージの記録が1つ増える。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">マージは、いま切り替えているブランチに変更を取り込む</text><text x="30" y="118" font-size="18" fill="#334155" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">main</text><line x1="100" y1="110" x2="700" y2="110" stroke="#555555" stroke-width="3"/><path d="M260 110 C310 110 350 200 400 200" fill="none" stroke="#555555" stroke-width="3"/><path d="M400 200 C550 200 600 110 700 110" fill="none" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><circle cx="100" cy="110" r="14" fill="#f8fafc" stroke="#555555" stroke-width="3"/><circle cx="260" cy="110" r="14" fill="#f8fafc" stroke="#555555" stroke-width="3"/><circle cx="520" cy="110" r="14" fill="#f8fafc" stroke="#555555" stroke-width="3"/><circle cx="400" cy="200" r="14" fill="#f8fafc" stroke="#555555" stroke-width="3"/><circle cx="700" cy="110" r="17" fill="#ffecb3" stroke="#f9a825" stroke-width="4"/><text x="520" y="150" font-size="13" fill="#334155" text-anchor="middle">mainの変更</text><text x="400" y="240" font-size="13" fill="#334155" text-anchor="middle">feature-a の変更</text><text x="30" y="208" font-size="18" fill="#334155" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">feature-a</text><text x="700" y="80" font-size="15" fill="#8a5a00" text-anchor="middle" font-weight="700">マージの記録</text><rect x="30" y="262" width="740" height="44" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="400" y="291" font-size="15" fill="#8a5a00" text-anchor="middle">2つの変更が1つにまとまり、マージしたという記録が1つ増える</text><g transform="translate(2.0 127.2) scale(0.527)"><ellipse cx="110" cy="550" rx="48" ry="6" fill="#1E293B" opacity="0.15"/><g transform="translate(0 0)"><path d="M142 534 C190 540 200 490 180 468" fill="none" stroke="#E08A3C" stroke-width="15" stroke-linecap="round"/><circle cx="180" cy="468" r="8" fill="#FFF1DC"/><ellipse cx="110" cy="518" rx="36" ry="32" fill="#F2A04A"/><ellipse cx="110" cy="524" rx="20" ry="22" fill="#FFF1DC"/><ellipse cx="92" cy="545" rx="13" ry="7" fill="#FFF1DC"/><ellipse cx="128" cy="545" rx="13" ry="7" fill="#FFF1DC"/><path d="M82 512 L76 534" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="76" cy="534" r="9.5" fill="#FFF1DC"/><path d="M138 504 L170 470" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="170" cy="470" r="9.5" fill="#FFF1DC"/><g transform="rotate(-5 110 490)"><path d="M60 432 L58 392 L98 410 z M160 432 L162 392 L122 410 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="10" stroke-linejoin="round"/><path d="M68 420 L67 402 L86 410 z M152 420 L153 402 L134 410 z" fill="#F9A8B8" stroke="#F9A8B8" stroke-width="4" stroke-linejoin="round"/><path d="M50 466 l-11 3 l10 7 z M170 466 l11 3 l-10 7 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="3" stroke-linejoin="round"/><ellipse cx="110" cy="452" rx="62" ry="52" fill="#F2A04A"/><ellipse cx="110" cy="468" rx="30" ry="22" fill="#FFF1DC"/><path d="M110 402 v13 M95 405 l3 11 M125 405 l-3 11" fill="none" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/><ellipse cx="68" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><ellipse cx="152" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><path d="M62 472 l4 6 M69 471 l4 6 M147 471 l4 6 M154 472 l4 6" stroke="#F0708A" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="82" cy="452" rx="12" ry="15" fill="#1E293B"/><ellipse cx="138" cy="452" rx="12" ry="15" fill="#1E293B"/><circle cx="86" cy="446" r="5" fill="#fff"/><circle cx="142" cy="446" r="5" fill="#fff"/><circle cx="78" cy="459" r="2.4" fill="#fff"/><circle cx="134" cy="459" r="2.4" fill="#fff"/><path d="M105 466 h10 l-5 5 z" fill="#F9768B" stroke="#F9768B" stroke-width="2" stroke-linejoin="round"/><path d="M110 471 q-6 8 -12 1 M110 471 q6 8 12 1" fill="none" stroke="#7C4A1E" stroke-width="2.2" stroke-linecap="round"/><g stroke="#7C4A1E" stroke-width="1.8" stroke-linecap="round" opacity="0.55"><path d="M60 464 l-12 -3 M60 470 l-12 3 M160 464 l12 -3 M160 470 l12 3"/></g></g><path d="M80 497 q30 16 60 0" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="507" r="6" fill="#FBBF24" stroke="#D99A06" stroke-width="1.5"/><path d="M110 510 v3" stroke="#D99A06" stroke-width="2" stroke-linecap="round"/></g></g><rect x="120" y="320" width="400" height="72" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="120,348.0 106,356.0 120,364.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="119" y="349.0" width="3" height="14" fill="#ffffff"/><text x="320.0" y="350.0" font-size="16" fill="#5c3d00" text-anchor="middle">マージは「いま切り替えている</text><text x="320.0" y="372.0" font-size="16" fill="#5c3d00" text-anchor="middle">ブランチ」に取り込むんだ</text>
</svg>
