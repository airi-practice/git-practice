<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>マージで変更が1つにまとまる</title>
<desc>mainから分かれたfeature-aで変更を進める。mainでも別の変更が進む。feature-aの変更をmainにマージすると、2つの変更がmainに取り込まれ、マージの記録が1つ増える。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">マージは、いま切り替えているブランチに変更を取り込む</text><text x="30" y="118" font-size="18" fill="#334155" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">main</text><line x1="100" y1="110" x2="700" y2="110" stroke="#555555" stroke-width="3"/><path d="M260 110 C310 110 350 200 400 200" fill="none" stroke="#555555" stroke-width="3"/><path d="M400 200 C550 200 600 110 700 110" fill="none" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><circle cx="100" cy="110" r="14" fill="#f8fafc" stroke="#555555" stroke-width="3"/><circle cx="260" cy="110" r="14" fill="#f8fafc" stroke="#555555" stroke-width="3"/><circle cx="520" cy="110" r="14" fill="#f8fafc" stroke="#555555" stroke-width="3"/><circle cx="400" cy="200" r="14" fill="#f8fafc" stroke="#555555" stroke-width="3"/><circle cx="700" cy="110" r="17" fill="#ffecb3" stroke="#f9a825" stroke-width="4"/><text x="520" y="150" font-size="13" fill="#334155" text-anchor="middle">mainの変更</text><text x="400" y="240" font-size="13" fill="#334155" text-anchor="middle">feature-a の変更</text><text x="30" y="208" font-size="18" fill="#334155" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">feature-a</text><text x="700" y="80" font-size="15" fill="#8a5a00" text-anchor="middle" font-weight="700">マージの記録</text><rect x="30" y="262" width="740" height="44" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="400" y="291" font-size="15" fill="#8a5a00" text-anchor="middle">2つの変更が1つにまとまり、マージしたという記録が1つ増える</text><g transform="translate(60 360) scale(0.85)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="120" y="320" width="400" height="72" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="120,348.0 106,356.0 120,364.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="119" y="349.0" width="3" height="14" fill="#ffffff"/><text x="320.0" y="350.0" font-size="16" fill="#5c3d00" text-anchor="middle">マージは「いま切り替えている</text><text x="320.0" y="372.0" font-size="16" fill="#5c3d00" text-anchor="middle">ブランチ」に取り込むんだ</text>
</svg>
