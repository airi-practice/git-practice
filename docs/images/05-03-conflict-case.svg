<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>競合が起きる場面</title>
<desc>元のファイルの2行目はみかん。mainでは2行目をレモンに、feature-bでは同じ2行目をポンカンに変更した。この2つをマージすると、2行目をどちらにするかGitが決められず、競合になる。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="390" fill="#ffffff"/>
<rect x="250" y="24" width="300" height="56" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="400" y="60" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">元の2行目: みかん</text><line x1="310" y1="84" x2="200" y2="132" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><line x1="490" y1="84" x2="600" y2="132" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="30" y="136" width="340" height="70" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="200" y="162" font-size="18" fill="#334155" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">main</text><text x="200" y="188" font-size="15" fill="#334155" text-anchor="middle">2行目を「レモン」に変更</text><rect x="430" y="136" width="340" height="70" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="600" y="162" font-size="18" fill="#334155" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">feature-b</text><text x="600" y="188" font-size="15" fill="#334155" text-anchor="middle">2行目を「ポンカン」に変更</text><line x1="200" y1="210" x2="340" y2="256" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><line x1="600" y1="210" x2="460" y2="256" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="200" y="260" width="400" height="76" rx="12" fill="url(#gRed)" stroke="#c62828" stroke-width="2" filter="url(#sh)"/><text x="400" y="292" font-size="22" fill="#8e1b1b" text-anchor="middle" font-weight="700">競合</text><text x="400" y="320" font-size="15" fill="#8e1b1b" text-anchor="middle">2行目をどちらにするか、Gitは決められない</text><g transform="translate(725 322) scale(0.85)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
