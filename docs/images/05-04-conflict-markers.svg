<text x="30" y="36" font-size="22" fill="#334155" text-anchor="start" font-weight="700">競合したとき、memo.txt に現れる印</text><rect x="30" y="52" width="330" height="328" rx="12" fill="#ffffff" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="50" y="80" font-size="15" fill="#334155" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">memo.txt</text><text x="58" y="117" font-size="15" fill="#1e293b" text-anchor="start" font-family="Consolas,'Courier New',monospace">青りんご</text><rect x="46" y="130" width="298" height="30" rx="4" fill="#e2e8f0"/><text x="58" y="151" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text><rect x="46" y="164" width="298" height="30" rx="4" fill="#f3e5f5"/><text x="58" y="185" font-size="15" fill="#1e293b" text-anchor="start" font-family="Consolas,'Courier New',monospace">レモン</text><rect x="46" y="198" width="298" height="30" rx="4" fill="#e2e8f0"/><text x="58" y="219" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">=======</text><rect x="46" y="232" width="298" height="30" rx="4" fill="#e0f2f1"/><text x="58" y="253" font-size="15" fill="#1e293b" text-anchor="start" font-family="Consolas,'Courier New',monospace">ポンカン</text><rect x="46" y="266" width="298" height="30" rx="4" fill="#e2e8f0"/><text x="58" y="287" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700" font-family="Consolas,'Courier New',monospace">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature-b</text><text x="58" y="321" font-size="15" fill="#1e293b" text-anchor="start" font-family="Consolas,'Courier New',monospace">ぶどう</text><text x="58" y="355" font-size="15" fill="#1e293b" text-anchor="start" font-family="Consolas,'Courier New',monospace">いちご</text><line x1="348" y1="145" x2="400" y2="145" stroke="#555555" stroke-width="2"/><line x1="348" y1="179" x2="400" y2="179" stroke="#555555" stroke-width="2"/><line x1="348" y1="213" x2="400" y2="213" stroke="#555555" stroke-width="2"/><line x1="348" y1="247" x2="400" y2="247" stroke="#555555" stroke-width="2"/><line x1="348" y1="281" x2="400" y2="281" stroke="#555555" stroke-width="2"/><text x="410" y="144" font-size="15" fill="#334155" text-anchor="start">ここから競合の範囲。HEAD は</text><text x="410" y="164" font-size="15" fill="#334155" text-anchor="start">いま切り替えているブランチ(main)のこと</text><text x="410" y="193" font-size="15" fill="#4a148c" text-anchor="start" font-weight="700">mainの内容</text><text x="410" y="227" font-size="15" fill="#334155" text-anchor="start">ここが区切り</text><text x="410" y="261" font-size="15" fill="#004d40" text-anchor="start" font-weight="700">マージしてきた feature-b の内容</text><text x="410" y="295" font-size="15" fill="#334155" text-anchor="start">ここまでが競合の範囲</text><g transform="translate(60 424) scale(0.85)">
