<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>競合の印の読み方</title>
<desc>競合したとき、memo.txt には、HEADと書かれた行から区切りの行までがmainの内容、区切りの行からfeature-bと書かれた行までがfeature-bの内容として並ぶ。ここから残す内容を決める。</desc>
