</g><rect x="120" y="392" width="380" height="60" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="120,414.0 106,422.0 120,430.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="119" y="415.0" width="3" height="14" fill="#ffffff"/><text x="310.0" y="416.0" font-size="16" fill="#5c3d00" text-anchor="middle">印の間が、競合している場所だよ</text><text x="310.0" y="438.0" font-size="16" fill="#5c3d00" text-anchor="middle">ここから残す内容を決めるんだ</text>
