<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>TortoiseGitMergeで競合を解消する流れ</title>
<desc>TortoiseGitMergeには、マージしてきたfeature-b側のTheirs、いま切り替えているmain側のMine、結果のMergedの3つの欄が出る。Theirsの2行目はポンカン、Mineの2行目はレモン。Mergedの欄でレモンを選び、保存して閉じ、解決済みにする。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="470" fill="#ffffff"/>
<text x="30" y="36" font-size="22" fill="#334155" text-anchor="start" font-weight="700">競合の解消: 3つの欄を見て、残す内容を選ぶ</text><rect x="30" y="60" width="190" height="84" rx="12" fill="#e0f2f1" stroke="#00796b" stroke-width="2" filter="url(#sh)"/><text x="125" y="88" font-size="18" fill="#004d40" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">Theirs</text><text x="125" y="112" font-size="15" fill="#004d40" text-anchor="middle">feature-b 側の内容</text><text x="125" y="134" font-size="15" fill="#004d40" text-anchor="middle">2行目: ポンカン</text><rect x="260" y="60" width="190" height="84" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" filter="url(#sh)"/><text x="355" y="88" font-size="18" fill="#4a148c" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">Mine</text><text x="355" y="112" font-size="15" fill="#4a148c" text-anchor="middle">main 側の内容</text><text x="355" y="134" font-size="15" fill="#4a148c" text-anchor="middle">2行目: レモン</text><line x1="125" y1="148" x2="190" y2="196" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><line x1="355" y1="148" x2="290" y2="196" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="145" y="200" width="190" height="84" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="240" y="228" font-size="18" fill="#334155" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">Merged</text><text x="240" y="252" font-size="15" fill="#334155" text-anchor="middle">結果の欄</text><text x="240" y="274" font-size="15" fill="#334155" text-anchor="middle">2行目: レモンにする</text><text x="30" y="316" font-size="13" fill="#334155" text-anchor="start">Theirs は、マージしてきた側</text><text x="30" y="336" font-size="13" fill="#334155" text-anchor="start">Mine は、いま切り替えているブランチの側</text><rect x="480" y="60" width="290" height="290" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="500" y="92" font-size="18" fill="#334155" text-anchor="start" font-weight="700">操作の流れ</text><circle cx="514" cy="127" r="14" fill="#555555"/><text x="514" y="132" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="540" y="132" font-size="15" fill="#334155" text-anchor="start">Edit conflicts を選ぶ</text><circle cx="514" cy="173" r="14" fill="#555555"/><text x="514" y="178" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="540" y="178" font-size="15" fill="#334155" text-anchor="start">3つの欄を見くらべる</text><circle cx="514" cy="219" r="14" fill="#555555"/><text x="514" y="224" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="540" y="224" font-size="15" fill="#334155" text-anchor="start">結果の欄で「レモン」を選ぶ</text><circle cx="514" cy="265" r="14" fill="#555555"/><text x="514" y="270" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="540" y="270" font-size="15" fill="#334155" text-anchor="start">保存して画面を閉じる</text><circle cx="514" cy="311" r="14" fill="#555555"/><text x="514" y="316" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="540" y="316" font-size="15" fill="#334155" text-anchor="start">「解決済みにしますか」→ はい</text><g transform="translate(60 408) scale(0.85)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="120" y="376" width="380" height="60" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="120,398.0 106,406.0 120,414.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="119" y="399.0" width="3" height="14" fill="#ffffff"/><text x="310.0" y="400.0" font-size="16" fill="#5c3d00" text-anchor="middle">結果の欄で、残す内容を選ぶんだ</text><text x="310.0" y="422.0" font-size="16" fill="#5c3d00" text-anchor="middle">選んだら保存して閉じるよ</text>
</svg>
