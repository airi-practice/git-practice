<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>共有の本棚と、それぞれの机</title>
<desc>共有の本棚には、これまでのノートが全部しまってある。あなたと友人は、それぞれの机にノートの写しを持って作業する。書き込んだ分は本棚に反映し、本棚の最新は自分の机に写す。写しを作るのは最初の1回だけで、すでに手元に作業フォルダがあれば、本棚に送るだけでよい。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="440" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">共有の本棚と、それぞれの机</text><rect x="20" y="90" width="180" height="140" rx="12" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="110" y="130" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">あなたの机</text><text x="110" y="164" font-size="15" fill="#8a5a00" text-anchor="middle">ノートの写し</text><rect x="300" y="80" width="200" height="160" rx="12" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="400" y="118" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">みんなの共有本棚</text><text x="400" y="156" font-size="15" fill="#8a5a00" text-anchor="middle">これまでのノートが</text><text x="400" y="180" font-size="15" fill="#8a5a00" text-anchor="middle">全部しまってある</text><rect x="600" y="90" width="180" height="140" rx="12" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="690" y="130" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">友人の机</text><text x="690" y="164" font-size="15" fill="#8a5a00" text-anchor="middle">ノートの写し</text><line x1="205" y1="130" x2="295" y2="130" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="250" y="120" font-size="15" fill="#334155" text-anchor="middle">本棚に反映</text><line x1="295" y1="180" x2="205" y2="180" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="250" y="204" font-size="15" fill="#334155" text-anchor="middle">最新を写す</text><line x1="595" y1="130" x2="505" y2="130" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="550" y="120" font-size="15" fill="#334155" text-anchor="middle">本棚に反映</text><line x1="505" y1="180" x2="595" y2="180" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="550" y="204" font-size="15" fill="#334155" text-anchor="middle">最新を写す</text><rect x="20" y="262" width="760" height="44" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="400" y="290" font-size="15" fill="#334155" text-anchor="middle">写しを作る(クローン)のは最初の1回だけ。すでに手元に作業フォルダがあれば、送るだけでよい</text><g transform="translate(60 365) scale(0.9)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="122" y="328" width="360" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="122,358.0 108,366.0 122,374.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="121" y="359.0" width="3" height="14" fill="#ffffff"/><text x="302.0" y="360.0" font-size="16" fill="#5c3d00" text-anchor="middle">みんなが同じ本棚を中心にして、</text><text x="302.0" y="382.0" font-size="16" fill="#5c3d00" text-anchor="middle">自分の机の写しで作業するんだ</text>
</svg>
