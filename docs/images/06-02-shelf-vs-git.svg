<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>共有の本棚とGitの対応</title>
<desc>共有の本棚のノートはリモートリポジトリ、机の上の写しは手元のリポジトリに当たる。本棚にも過去のノートが全部あるように、リモートにもこれまでの記録が全部ある。写しを作ることがクローン、書いた分を本棚に反映することがプッシュ、本棚の最新を取り込んで自分の分と合わせることがプルである。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="800" height="560" fill="#ffffff"/>
<rect x="30" y="20" width="330" height="40" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="195" y="47" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">たとえ: 共有の本棚</text><rect x="440" y="20" width="330" height="40" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="605" y="47" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">元の概念: Git</text><rect x="30" y="80" width="330" height="50" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="195" y="112" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">本棚のノート</text><line x1="368" y1="105" x2="432" y2="105" stroke="#555555" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="440" y="80" width="330" height="50" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="605" y="111" font-size="15" fill="#334155" text-anchor="middle">リモートリポジトリ(共有の置き場所)</text><rect x="30" y="144" width="330" height="50" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="195" y="176" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">机の上のノートの写し</text><line x1="368" y1="169" x2="432" y2="169" stroke="#555555" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="440" y="144" width="330" height="50" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="605" y="175" font-size="15" fill="#334155" text-anchor="middle">手元のリポジトリ(自分のパソコン側)</text><rect x="30" y="208" width="330" height="50" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="195" y="240" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">本棚にも過去のノートが全部ある</text><line x1="368" y1="233" x2="432" y2="233" stroke="#555555" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="440" y="208" width="330" height="50" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="605" y="239" font-size="15" fill="#334155" text-anchor="middle">リモートにも、これまでの記録が全部ある</text><rect x="30" y="272" width="330" height="50" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="195" y="304" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">本棚から写しを作る</text><line x1="368" y1="297" x2="432" y2="297" stroke="#555555" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="440" y="272" width="330" height="50" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="605" y="303" font-size="15" fill="#334155" text-anchor="middle">クローン(複製を作る)</text><rect x="30" y="336" width="330" height="50" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="195" y="368" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">机で書いた分を本棚に反映する</text><line x1="368" y1="361" x2="432" y2="361" stroke="#555555" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="440" y="336" width="330" height="50" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="605" y="367" font-size="15" fill="#334155" text-anchor="middle">プッシュ(手元の記録を送る)</text><rect x="30" y="400" width="330" height="50" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="195" y="432" font-size="18" fill="#8a5a00" text-anchor="middle" font-weight="700">本棚の最新を机の写しに取り込む</text><line x1="368" y1="425" x2="432" y2="425" stroke="#555555" stroke-width="3" marker-end="url(#ar)" marker-start="url(#ar)"/><rect x="440" y="400" width="330" height="50" rx="10" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="605" y="431" font-size="15" fill="#334155" text-anchor="middle">プル(取り込んで、マージする)</text><g transform="translate(60 505) scale(0.85)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="120" y="470" width="340" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="120,500.0 106,508.0 120,516.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="119" y="501.0" width="3" height="14" fill="#ffffff"/><text x="290.0" y="502.0" font-size="16" fill="#5c3d00" text-anchor="middle">本棚のたとえを、Gitの言葉に</text><text x="290.0" y="524.0" font-size="16" fill="#5c3d00" text-anchor="middle">置き換えるとこうなるよ</text>
</svg>
