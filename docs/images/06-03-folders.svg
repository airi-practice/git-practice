<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>共有の置き場所と2つの作業フォルダ</title>
<desc>共有の置き場所sample-sharedを中心に、あなたの作業フォルダsample-projectと、もう一人の担当者役のsample-project-friendがある。作業フォルダの中には、それぞれ手元のリポジトリ(.git)がある。sample-sharedは作業フォルダを持たないリモートリポジトリである。手元のリポジトリとsample-sharedの間で、プッシュで記録を送り、プルで共有の最新を取り込む。クローンは友人役が1回だけ、共有の置き場所から複製を作る操作である。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="900" height="440" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">共有の置き場所を中心に、記録をやり取りする</text><rect x="20" y="80" width="250" height="170" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="145.0" y="106" font-size="15" fill="#334155" text-anchor="middle">あなたの作業フォルダ</text><text x="145.0" y="134" font-size="18" fill="#334155" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">sample-project</text><rect x="40" y="150" width="210" height="80" rx="10" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="145.0" y="182" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">リポジトリ(.git)</text><text x="145.0" y="208" font-size="13" fill="#334155" text-anchor="middle">手元の記録の置き場所</text><rect x="360" y="80" width="180" height="170" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="450.0" y="106" font-size="15" fill="#334155" text-anchor="middle">共有の置き場所</text><text x="450.0" y="134" font-size="18" fill="#334155" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">sample-shared</text><rect x="375" y="150" width="150" height="80" rx="10" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="450.0" y="182" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">リモートリポジトリ</text><text x="450.0" y="208" font-size="13" fill="#334155" text-anchor="middle">作業フォルダはなし</text><rect x="630" y="80" width="250" height="170" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><text x="755.0" y="106" font-size="15" fill="#334155" text-anchor="middle">もう一人の担当者役</text><text x="755.0" y="134" font-size="18" fill="#334155" text-anchor="middle" font-weight="700" font-family="Consolas,'Courier New',monospace">sample-project-friend</text><rect x="650" y="150" width="210" height="80" rx="10" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="755.0" y="182" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">リポジトリ(.git)</text><text x="755.0" y="208" font-size="13" fill="#334155" text-anchor="middle">手元の記録の置き場所</text><line x1="255" y1="170" x2="370" y2="170" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="312" y="160" font-size="15" fill="#334155" text-anchor="middle">プッシュ</text><line x1="370" y1="210" x2="255" y2="210" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="312" y="232" font-size="15" fill="#334155" text-anchor="middle">プル</text><line x1="645" y1="170" x2="530" y2="170" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="588" y="160" font-size="15" fill="#334155" text-anchor="middle">プッシュ</text><line x1="530" y1="210" x2="645" y2="210" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><text x="588" y="232" font-size="15" fill="#334155" text-anchor="middle">プル</text><rect x="30" y="272" width="840" height="50" rx="10" fill="url(#gYel)" stroke="#f9a825" stroke-width="2" filter="url(#sh)"/><text x="450" y="303" font-size="15" fill="#8a5a00" text-anchor="middle">クローン: 共有の置き場所から手元に複製を作る(今回は友人役の1回だけ)</text><g transform="translate(60 380) scale(0.85)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="120" y="346" width="400" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="120,376.0 106,384.0 120,392.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="119" y="377.0" width="3" height="14" fill="#ffffff"/><text x="320.0" y="378.0" font-size="16" fill="#5c3d00" text-anchor="middle">今回は1台のパソコンの中に、</text><text x="320.0" y="400.0" font-size="16" fill="#5c3d00" text-anchor="middle">3つのフォルダを作って体験するよ</text>
</svg>
