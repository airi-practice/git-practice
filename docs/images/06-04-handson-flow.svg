<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" role="img">
<title>共有を体験する5つの手順</title>
<desc>共有を体験する流れは5つある。1は共有の置き場所sample-sharedを作る。2はあなたのsample-projectから共有へプッシュする。3は共有から友人役のsample-project-friendへクローンする。4は友人役が先頭に1行追加してプッシュする。5はあなたがプルして友人の行を受け取る。</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.16"/></filter>
<linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
<linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffebee"/><stop offset="1" stop-color="#ffd0d6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker>
</defs>
<rect width="940" height="350" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#334155" text-anchor="start" font-weight="700">この章の体験の流れ</text><rect x="20" y="80" width="160" height="130" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="42" cy="102" r="14" fill="#555555"/><text x="42" y="108" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="100" y="142" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">共有の置き場所</text><text x="100" y="164" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">を作る</text><text x="100" y="196" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'Courier New',monospace">sample-shared</text><line x1="182" y1="145" x2="203" y2="145" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="205" y="80" width="160" height="130" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="227" cy="102" r="14" fill="#555555"/><text x="227" y="108" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="285" y="148" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">プッシュ</text><text x="285" y="172" font-size="13" fill="#334155" text-anchor="middle">あなた → 共有</text><text x="285" y="196" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'Courier New',monospace">sample-project</text><line x1="367" y1="145" x2="388" y2="145" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="390" y="80" width="160" height="130" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="412" cy="102" r="14" fill="#555555"/><text x="412" y="108" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="470" y="148" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">クローン</text><text x="470" y="172" font-size="13" fill="#334155" text-anchor="middle">共有 → 友人役</text><text x="470" y="196" font-size="13" fill="#334155" text-anchor="middle" font-family="Consolas,'Courier New',monospace">sample-project-friend</text><line x1="552" y1="145" x2="573" y2="145" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="575" y="80" width="160" height="130" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="597" cy="102" r="14" fill="#555555"/><text x="597" y="108" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="655" y="148" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">友人役がプッシュ</text><text x="655" y="172" font-size="13" fill="#334155" text-anchor="middle">友人役 → 共有</text><text x="655" y="196" font-size="13" fill="#334155" text-anchor="middle">先頭に1行追加</text><line x1="737" y1="145" x2="758" y2="145" stroke="#555555" stroke-width="3" marker-end="url(#ar)"/><rect x="760" y="80" width="160" height="130" rx="12" fill="url(#gGray)" stroke="#555555" stroke-width="2" filter="url(#sh)"/><circle cx="782" cy="102" r="14" fill="#555555"/><text x="782" y="108" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="840" y="148" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">プル</text><text x="840" y="172" font-size="13" fill="#334155" text-anchor="middle">共有 → あなた</text><text x="840" y="196" font-size="13" fill="#334155" text-anchor="middle">友人の行が届く</text><g transform="translate(60 290) scale(0.85)">
<path d="M16 58 Q48 62 44 30" fill="none" stroke="#f0a04b" stroke-width="9" stroke-linecap="round"/>
<path d="M44.5 38 Q45 34 44 30" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="44" rx="21" ry="22" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="-9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<ellipse cx="9" cy="64" rx="8" ry="5" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<polygon points="-27,-12 -25,-40 -7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="27,-12 25,-40 7,-27" fill="#f0a04b" stroke="#b8651b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="-24,-17 -23,-33 -12,-25" fill="#f8a5b8"/>
<polygon points="24,-17 23,-33 12,-25" fill="#f8a5b8"/>
<circle cx="0" cy="0" r="30" fill="#f0a04b" stroke="#b8651b" stroke-width="2"/>
<path d="M-6 -29 L-6 -19 M0 -30 L0 -18 M6 -29 L6 -19" stroke="#b8651b" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="-11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="-9" cy="-5" r="2.2" fill="#fff"/>
<ellipse cx="11" cy="-2" rx="6" ry="8" fill="#1e293b"/><circle cx="13" cy="-5" r="2.2" fill="#fff"/>
<circle cx="-20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/><circle cx="20" cy="10" r="5" fill="#f8a5b8" opacity="0.9"/>
<polygon points="-2.5,6 2.5,6 0,9.5" fill="#e0748f"/>
<path d="M-5 13 Q0 17 0 9.5 Q0 17 5 13" fill="none" stroke="#7a3d0d" stroke-width="1.5" stroke-linecap="round"/>
<path d="M-18 27 Q0 37 18 27" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="34" r="4.5" fill="#f9a825" stroke="#8a5a00" stroke-width="1"/>
</g><rect x="120" y="256" width="380" height="76" rx="14" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><polygon points="120,286.0 106,294.0 120,302.0" fill="#ffffff" stroke="#f9a825" stroke-width="2"/><rect x="119" y="287.0" width="3" height="14" fill="#ffffff"/><text x="310.0" y="288.0" font-size="16" fill="#5c3d00" text-anchor="middle">この5つの順番で進めるよ。</text><text x="310.0" y="310.0" font-size="16" fill="#5c3d00" text-anchor="middle">あとで、順番に1つずつやろう</text>
</svg>
