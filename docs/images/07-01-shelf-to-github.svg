59" r="2.4" fill="#fff"/><circle cx="134" cy="459" r="2.4" fill="#fff"/><path d="M105 466 h10 l-5 5 z" fill="#F9768B" stroke="#F9768B" stroke-width="2" stroke-linejoin="round"/><path d="M110 471 q-6 8 -12 1 M110 471 q6 8 12 1" fill="none" stroke="#7C4A1E" stroke-width="2.2" stroke-linecap="round"/><g stroke="#7C4A1E" stroke-width="1.8" stroke-linecap="round" opacity="0.55"><path d="M60 464 l-12 -3 M60 470 l-12 3 M160 464 l12 -3 M160 470 l12 3"/></g></g><path d="M80 497 q30 16 60 0" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="507" r="6" fill="#FBBF24" stroke="#D99A06" stroke-width="1.5"/><path d="M110 510 v3" stroke="#D99A06" stroke-width="2" stroke-linecap="round"/></g></g>
  <g filter="url(#shadow)"><rect x="176" y="294" width="684" height="92" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/></g>
  <path d="M178 324 L128 340 L178 354 z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <rect x="175" y="327" width="6" height="25" fill="#ffffff"/>
  <text x="518" y="320" font-size="16" fill="#1e293b" text-anchor="middle">06章の共有の置き場所が、パソコンの中から</text>
  <text x="518" y="346" font-size="16" fill="#1e293b" text-anchor="middle">インターネット上に移っただけなんだ。</text>
  <text x="518" y="372" font-size="16" fill="#1e293b" text-anchor="middle">考え方は06章と同じだよ。</text>
</svg>
