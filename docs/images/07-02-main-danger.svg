<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif">
  <title>作りかけの変更を main に直接送ると、みんなが見る完成版が書き換わる。自分のブランチに送れば、main は変わらない図</title>
  <desc>左は、作りかけの変更を main に直接送る場合で、みんなが見る完成版の main が書き換わり、作りかけの内容がみんなに見えてしまう。右は、自分専用のブランチ ks/banana に送る場合で、main は変わらない。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="headBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e7ad6"/><stop offset="1" stop-color="#1257a8"/></linearGradient>
    <linearGradient id="headGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43a047"/><stop offset="1" stop-color="#2a7330"/></linearGradient>
    <linearGradient id="headOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef6c00"/><stop offset="1" stop-color="#b83c00"/></linearGradient>
    <linearGradient id="headGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b8794"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
    <linearGradient id="headYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#f9a825"/></linearGradient>
    <linearGradient id="headRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e53935"/><stop offset="1" stop-color="#a61c1c"/></linearGradient>
    <linearGradient id="headP1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e24aa"/><stop offset="1" stop-color="#5a1480"/></linearGradient>
    <linearGradient id="headP2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12998a"/><stop offset="1" stop-color="#00625a"/></linearGradient>
    <linearGradient id="headP3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2185b"/><stop offset="1" stop-color="#8e0f42"/></linearGradient>
    <linearGradient id="headP4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#607d8b"/><stop offset="1" stop-color="#37474f"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6dbf73"/><stop offset="1" stop-color="#3f9a47"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arB" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="arG" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="arO" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
    <marker id="arK" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
    <marker id="arR" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="arY" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9a825"/></marker>
  </defs>
  <rect width="900" height="490" fill="url(#bg)"/>

  <text x="450" y="38" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">作りかけの変更を、どこに送るか</text>

  <g filter="url(#shadow)"><rect x="30" y="62" width="410" height="290" rx="16" fill="#ffffff" stroke="#c62828" stroke-width="2"/></g>
  <path d="M30 108 v-30 a16 16 0 0 1 16 -16 h378 a16 16 0 0 1 16 16 v30 z" fill="url(#headRed)"/>
  <text x="235" y="93" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">main に直接送ると</text>
  <rect x="150" y="120" width="170" height="40" rx="10" fill="#f1f5f9" stroke="#555555" stroke-width="1.5"/>
  <text x="235" y="146" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">作りかけの変更</text>
  <line x1="235" y1="166" x2="235" y2="202" stroke="#c62828" stroke-width="6" stroke-linecap="round" marker-end="url(#arR)"/>
  <rect x="56" y="208" width="358" height="62" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="235" y="234" font-size="15" font-weight="bold" fill="#8e1b1b" text-anchor="middle">main(みんなが見る完成版)</text>
  <text x="235" y="258" font-size="15" fill="#8e1b1b" text-anchor="middle">書き換わってしまう</text>
  <text x="235" y="302" font-size="15" font-weight="bold" fill="#8e1b1b" text-anchor="middle">作りかけの内容が、みんなに</text>
  <text x="235" y="326" font-size="15" font-weight="bold" fill="#8e1b1b" text-anchor="middle">そのまま見えてしまう</text>

  <g filter="url(#shadow)"><rect x="460" y="62" width="410" height="290" rx="16" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/></g>
  <path d="M460 108 v-30 a16 16 0 0 1 16 -16 h378 a16 16 0 0 1 16 16 v30 z" fill="url(#headGreen)"/>
  <text x="665" y="93" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">自分のブランチに送ると</text>
  <rect x="580" y="120" width="170" height="40" rx="10" fill="#f1f5f9" stroke="#555555" stroke-width="1.5"/>
  <text x="665" y="146" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">作りかけの変更</text>
  <line x1="665" y1="166" x2="665" y2="198" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" marker-end="url(#arG)"/>
  <rect x="486" y="204" width="358" height="44" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="665" y="232" font-size="15" font-weight="bold" fill="#1b4d1f" text-anchor="middle">ks/banana(あなた専用のブランチ)</text>
  <rect x="486" y="262" width="358" height="62" rx="10" fill="#f1f5f9" stroke="#555555" stroke-width="1.5"/>
  <text x="665" y="288" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">main(みんなが見る完成版)</text>
  <text x="665" y="312" font-size="15" fill="#334155" text-anchor="middle">変わらない</text>

  <g transform="translate(11.2 150) scale(0.6)"><ellipse cx="110" cy="550" rx="48" ry="6" fill="#1E293B" opacity="0.15"/><g transform="translate(0 0)"><path d="M142 534 C190 536 196 502 176 490" fill="none" stroke="#E08A3C" stroke-width="15" stroke-linecap="round"/><circle cx="176" cy="490" r="8" fill="#FFF1DC"/><ellipse cx="110" cy="518" rx="36" ry="32" fill="#F2A04A"/><ellipse cx="110" cy="524" rx="20" ry="22" fill="#FFF1DC"/><ellipse cx="92" cy="545" rx="13" ry="7" fill="#FFF1DC"/><ellipse cx="128" cy="545" rx="13" ry="7" fill="#FFF1DC"/><path d="M82 512 L76 534" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="76" cy="534" r="9.5" fill="#FFF1DC"/><g transform="rotate(-9 110 490)"><path d="M60 432 L58 392 L98 410 z M160 432 L162 392 L122 410 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="10" stroke-linejoin="round"/><path d="M68 420 L67 402 L86 410 z M152 420 L153 402 L134 410 z" fill="#F9A8B8" stroke="#F9A8B8" stroke-width="4" stroke-linejoin="round"/><path d="M50 466 l-11 3 l10 7 z M170 466 l11 3 l-10 7 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="3" stroke-linejoin="round"/><ellipse cx="110" cy="452" rx="62" ry="52" fill="#F2A04A"/><ellipse cx="110" cy="468" rx="30" ry="22" fill="#FFF1DC"/><path d="M110 402 v13 M95 405 l3 11 M125 405 l-3 11" fill="none" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/><ellipse cx="68" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><ellipse cx="152" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><path d="M62 472 l4 6 M69 471 l4 6 M147 471 l4 6 M154 472 l4 6" stroke="#F0708A" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="82" cy="452" rx="12" ry="15" fill="#1E293B"/><ellipse cx="138" cy="452" rx="12" ry="15" fill="#1E293B"/><circle cx="88" cy="443" r="5.5" fill="#fff"/><circle cx="144" cy="443" r="5.5" fill="#fff"/><circle cx="80" cy="457" r="2.4" fill="#fff"/><circle cx="136" cy="457" r="2.4" fill="#fff"/><path d="M105 466 h10 l-5 5 z" fill="#F9768B" stroke="#F9768B" stroke-width="2" stroke-linejoin="round"/><path d="M110 471 q-6 8 -12 1 M110 471 q6 8 12 1" fill="none" stroke="#7C4A1E" stroke-width="2.2" stroke-linecap="round"/><g stroke="#7C4A1E" stroke-width="1.8" stroke-linecap="round" opacity="0.55"><path d="M60 464 l-12 -3 M60 470 l-12 3 M160 464 l12 -3 M160 470 l12 3"/></g></g><path d="M80 497 q30 16 60 0" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="507" r="6" fill="#FBBF24" stroke="#D99A06" stroke-width="1.5"/><path d="M110 510 v3" stroke="#D99A06" stroke-width="2" stroke-linecap="round"/><path d="M138 510 L132 484" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="132" cy="484" r="9.5" fill="#FFF1DC"/></g></g>
  <g filter="url(#shadow)"><rect x="176" y="374" width="684" height="92" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/></g>
  <path d="M178 404 L128 420 L178 434 z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <rect x="175" y="407" width="6" height="25" fill="#ffffff"/>
  <text x="518" y="400" font-size="16" fill="#1e293b" text-anchor="middle">main は、みんなが見る完成版なんだ。</text>
  <text x="518" y="426" font-size="16" fill="#1e293b" text-anchor="middle">作業は自分のブランチでやって、</text>
  <text x="518" y="452" font-size="16" fill="#1e293b" text-anchor="middle">main には直接送らないようにしよう。</text>
</svg>
