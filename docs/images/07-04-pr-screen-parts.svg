<svg xmlns="http://www.w3.org/2000/svg" width="900" height="602" viewBox="0 0 900 602" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif">
  <title>GitHub の PR の画面で見られる、タイトルと説明、取り込み先と取り込む内容の向き、変更内容の3つを示す模擬図</title>
  <desc>左は Conversation タブで、1 PR のタイトルと説明、2 ks/banana のブランチを main に取り込みたいという向きが見える。右は Files changed タブで、3 memo.txt の変更内容が見え、消えた行は赤、増えた行は緑で示される。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="headBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e7ad6"/><stop offset="1" stop-color="#1257a8"/></linearGradient>
    <linearGradient id="headGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43a047"/><stop offset="1" stop-color="#2a7330"/></linearGradient>
    <linearGradient id="headOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef6c00"/><stop offset="1" stop-color="#b83c00"/></linearGradient>
    <linearGradient id="headGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b8794"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
    <linearGradient id="headYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#f9a825"/></linearGradient>
    <linearGradient id="headRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e53935"/><stop offset="1" stop-color="#a61c1c"/></linearGradient>
    <linearGradient id="headP1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e24aa"/><stop offset="1" stop-color="#5a1480"/></linearGradient>
    <linearGradient id="headP2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12998a"/><stop offset="1" stop-color="#00625a"/></linearGradient>
    <linearGradient id="headP3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2185b"/><stop offset="1" stop-color="#8e0f42"/></linearGradient>
    <linearGradient id="headP4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#607d8b"/><stop offset="1" stop-color="#37474f"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6dbf73"/><stop offset="1" stop-color="#3f9a47"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arB" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="arG" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="arO" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
    <marker id="arK" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
    <marker id="arR" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="arY" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9a825"/></marker>
  </defs>
  <rect width="900" height="602" fill="url(#bg)"/>

  <text x="450" y="38" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">PR の画面で見られるもの</text>
  <text x="240" y="78" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Conversation(会話)タブ</text>
  <g filter="url(#shadow)"><rect x="30" y="90" width="420" height="270" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/></g>
  <circle cx="52" cy="128" r="11" fill="#6a1b9a"/>
  <text x="52" y="133" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="74" y="134" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="start">Add my wishlist</text>
  <text x="236" y="134" font-size="18" fill="#59636e" text-anchor="start">#1</text>
  <rect x="74" y="150" width="56" height="24" rx="12" fill="#1a7f37"/><text x="102" y="167" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Open</text>
  <circle cx="52" cy="200" r="11" fill="#6a1b9a"/>
  <text x="52" y="205" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="74" y="205" font-size="13" fill="#1f2328" text-anchor="start">ks wants to merge 1 commit into</text><rect x="276" y="188" width="48" height="22" rx="11" fill="#ddf4ff"/><text x="300" y="204" font-size="13" fill="#0969da" text-anchor="middle" font-family="Consolas,'Courier New',monospace">main</text>
  <text x="74" y="233" font-size="13" fill="#1f2328" text-anchor="start">from</text><rect x="110" y="216" width="88" height="22" rx="11" fill="#ddf4ff"/><text x="154" y="232" font-size="13" fill="#0969da" text-anchor="middle" font-family="Consolas,'Courier New',monospace">ks/banana</text>
  <line x1="38" y1="274" x2="422" y2="274" stroke="#d0d7de"/><text x="46" y="264" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">Conversation</text><rect x="42" y="272" width="92" height="3" rx="1.5" fill="#fd8c73"/><text x="152" y="264" font-size="13" fill="#1f2328" text-anchor="start">Commits</text><text x="222" y="264" font-size="13" fill="#1f2328" text-anchor="start">Files changed</text>
  <rect x="46" y="290" width="388" height="58" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M46 314 v-18 a6 6 0 0 1 6 -6 h376 a6 6 0 0 1 6 6 v18 z" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="308" font-size="13" fill="#59636e" text-anchor="start">ks commented now</text>
  <circle cx="418" cy="302" r="11" fill="#6a1b9a"/>
  <text x="418" y="307" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="58" y="336" font-size="13" fill="#1f2328" text-anchor="start">ほしいものリストを追加しました</text>
  <text x="670" y="78" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Files changed(変更されたファイル)タブ</text>
  <g filter="url(#shadow)"><rect x="470" y="90" width="400" height="270" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/></g>
  <line x1="478" y1="128" x2="862" y2="128" stroke="#d0d7de"/><text x="486" y="118" font-size="13" fill="#1f2328" text-anchor="start">Conversation</text><text x="592" y="118" font-size="13" fill="#1f2328" text-anchor="start">Commits</text><text x="662" y="118" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">Files changed</text><rect x="658" y="126" width="92" height="3" rx="1.5" fill="#fd8c73"/>
  <rect x="486" y="168" width="368" height="170" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M486 198 v-24 a6 6 0 0 1 6 -6 h356 a6 6 0 0 1 6 6 v24 z" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="510" cy="184" r="11" fill="#6a1b9a"/>
  <text x="510" y="189" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="530" y="189" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start" font-family="Consolas,'Courier New',monospace">memo.txt</text>
  <rect x="486" y="208" width="368" height="26" fill="#ffffff"/><text x="510" y="226" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas,'Courier New',monospace">1</text><text x="546" y="226" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas,'Courier New',monospace">1</text><text x="562" y="226" font-size="13" fill="#1f2328" text-anchor="start" font-family="Consolas,'Courier New',monospace">  りんご</text>
  <rect x="486" y="234" width="368" height="26" fill="#ffebe9"/><text x="510" y="252" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas,'Courier New',monospace">2</text><text x="546" y="252" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas,'Courier New',monospace"></text><text x="562" y="252" font-size="13" fill="#1f2328" text-anchor="start" font-family="Consolas,'Courier New',monospace">- みかん</text>
  <rect x="486" y="260" width="368" height="26" fill="#dafbe1"/><text x="510" y="278" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas,'Courier New',monospace"></text><text x="546" y="278" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas,'Courier New',monospace">2</text><text x="562" y="278" font-size="13" fill="#1f2328" text-anchor="start" font-family="Consolas,'Courier New',monospace">+ ぶどう</text>
  <rect x="486" y="286" width="368" height="26" fill="#ffffff"/><text x="510" y="304" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas,'Courier New',monospace">3</text><text x="546" y="304" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas,'Courier New',monospace">3</text><text x="562" y="304" font-size="13" fill="#1f2328" text-anchor="start" font-family="Consolas,'Courier New',monospace">  バナナ</text>
  <circle cx="50" cy="400" r="11" fill="#6a1b9a"/>
  <text x="50" y="405" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="72" y="405" font-size="15" fill="#1e293b" text-anchor="start">タイトルと説明: 何のための変更なのかが分かる</text>
  <circle cx="50" cy="434" r="11" fill="#6a1b9a"/>
  <text x="50" y="439" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="72" y="439" font-size="15" fill="#1e293b" text-anchor="start">向き: 取り込み先(main)と、取り込みたい内容のブランチ(ks/banana)</text>
  <circle cx="50" cy="468" r="11" fill="#6a1b9a"/>
  <text x="50" y="473" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="72" y="473" font-size="15" fill="#1e293b" text-anchor="start">変更内容: 緑の行が増えた行、赤の行が消えた行</text>

  <g transform="translate(11.2 262) scale(0.6)"><ellipse cx="110" cy="550" rx="48" ry="6" fill="#1E293B" opacity="0.15"/><g transform="translate(0 0)"><path d="M142 534 C190 536 196 502 176 490" fill="none" stroke="#E08A3C" stroke-width="15" stroke-linecap="round"/><circle cx="176" cy="490" r="8" fill="#FFF1DC"/><ellipse cx="110" cy="518" rx="36" ry="32" fill="#F2A04A"/><ellipse cx="110" cy="524" rx="20" ry="22" fill="#FFF1DC"/><ellipse cx="92" cy="545" rx="13" ry="7" fill="#FFF1DC"/><ellipse cx="128" cy="545" rx="13" ry="7" fill="#FFF1DC"/><path d="M82 512 L76 534" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="76" cy="534" r="9.5" fill="#FFF1DC"/><g transform="rotate(-9 110 490)"><path d="M60 432 L58 392 L98 410 z M160 432 L162 392 L122 410 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="10" stroke-linejoin="round"/><path d="M68 420 L67 402 L86 410 z M152 420 L153 402 L134 410 z" fill="#F9A8B8" stroke="#F9A8B8" stroke-width="4" stroke-linejoin="round"/><path d="M50 466 l-11 3 l10 7 z M170 466 l11 3 l-10 7 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="3" stroke-linejoin="round"/><ellipse cx="110" cy="452" rx="62" ry="52" fill="#F2A04A"/><ellipse cx="110" cy="468" rx="30" ry="22" fill="#FFF1DC"/><path d="M110 402 v13 M95 405 l3 11 M125 405 l-3 11" fill="none" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/><ellipse cx="68" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><ellipse cx="152" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><path d="M62 472 l4 6 M69 471 l4 6 M147 471 l4 6 M154 472 l4 6" stroke="#F0708A" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="82" cy="452" rx="12" ry="15" fill="#1E293B"/><ellipse cx="138" cy="452" rx="12" ry="15" fill="#1E293B"/><circle cx="88" cy="443" r="5.5" fill="#fff"/><circle cx="144" cy="443" r="5.5" fill="#fff"/><circle cx="80" cy="457" r="2.4" fill="#fff"/><circle cx="136" cy="457" r="2.4" fill="#fff"/><path d="M105 466 h10 l-5 5 z" fill="#F9768B" stroke="#F9768B" stroke-width="2" stroke-linejoin="round"/><path d="M110 471 q-6 8 -12 1 M110 471 q6 8 12 1" fill="none" stroke="#7C4A1E" stroke-width="2.2" stroke-linecap="round"/><g stroke="#7C4A1E" stroke-width="1.8" stroke-linecap="round" opacity="0.55"><path d="M60 464 l-12 -3 M60 470 l-12 3 M160 464 l12 -3 M160 470 l12 3"/></g></g><path d="M80 497 q30 16 60 0" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="507" r="6" fill="#FBBF24" stroke="#D99A06" stroke-width="1.5"/><path d="M110 510 v3" stroke="#D99A06" stroke-width="2" stroke-linecap="round"/><path d="M138 510 L132 484" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="132" cy="484" r="9.5" fill="#FFF1DC"/></g></g>
  <g filter="url(#shadow)"><rect x="176" y="486" width="684" height="92" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/></g>
  <path d="M178 516 L128 532 L178 546 z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <rect x="175" y="519" width="6" height="25" fill="#ffffff"/>
  <text x="518" y="512" font-size="16" fill="#1e293b" text-anchor="middle">PR の画面を見れば、何をどう変えたのかが</text>
  <text x="518" y="538" font-size="16" fill="#1e293b" text-anchor="middle">確認できるんだ。変更内容は、赤が消えた行、</text>
  <text x="518" y="564" font-size="16" fill="#1e293b" text-anchor="middle">緑が増えた行だよ。</text>
</svg>
