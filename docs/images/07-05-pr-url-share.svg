<svg xmlns="http://www.w3.org/2000/svg" width="900" height="453" viewBox="0 0 900 453" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif">
  <title>PR を作ると、PR のページの URL ができる。その URL を送れば、他の人がスマホなどで同じページを開いて変更内容を見られる図</title>
  <desc>1 あなたのパソコンで GitHub に PR を作る。2 PR の URL を LINE やメールなどで、他の人のスマホに送る。3 他の人がスマホで URL を開くと、GitHub の PR のページが見える。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="headBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e7ad6"/><stop offset="1" stop-color="#1257a8"/></linearGradient>
    <linearGradient id="headGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43a047"/><stop offset="1" stop-color="#2a7330"/></linearGradient>
    <linearGradient id="headOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef6c00"/><stop offset="1" stop-color="#b83c00"/></linearGradient>
    <linearGradient id="headGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b8794"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
    <linearGradient id="headYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#f9a825"/></linearGradient>
    <linearGradient id="headRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e53935"/><stop offset="1" stop-color="#a61c1c"/></linearGradient>
    <linearGradient id="headP1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e24aa"/><stop offset="1" stop-color="#5a1480"/></linearGradient>
    <linearGradient id="headP2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12998a"/><stop offset="1" stop-color="#00625a"/></linearGradient>
    <linearGradient id="headP3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2185b"/><stop offset="1" stop-color="#8e0f42"/></linearGradient>
    <linearGradient id="headP4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#607d8b"/><stop offset="1" stop-color="#37474f"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6dbf73"/><stop offset="1" stop-color="#3f9a47"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arB" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="arG" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="arO" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
    <marker id="arK" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
    <marker id="arR" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="arY" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9a825"/></marker>
  </defs>
  <rect width="900" height="453" fill="url(#bg)"/>

  <text x="450" y="38" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">PR を作ると、URL で他の人に見てもらえる</text>

  <g filter="url(#shadow)"><rect x="40" y="62" width="200" height="180" rx="16" fill="#ffffff" stroke="#1565c0" stroke-width="2"/></g>
  <path d="M40 108 v-30 a16 16 0 0 1 16 -16 h168 a16 16 0 0 1 16 16 v30 z" fill="url(#headBlue)"/>
  <text x="140" y="93" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">あなたのパソコン</text>
  <g filter="url(#shadow)"><rect x="60" y="122" width="160" height="100" rx="10" fill="url(#screen)" stroke="#1565c0" stroke-width="1.5"/></g>
  <path d="M60 138 v-6 a10 10 0 0 1 10 -10 h140 a10 10 0 0 1 10 10 v6 z" fill="#cfe3fb" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="74" cy="130" r="3.5" fill="#ef5350"/><circle cx="86" cy="130" r="3.5" fill="#ffb300"/><circle cx="98" cy="130" r="3.5" fill="#43a047"/>
  <text x="140" y="182" font-size="15" font-weight="bold" fill="#0d3c75" text-anchor="middle">PR を作った</text>

  <g filter="url(#shadow)"><rect x="350" y="62" width="200" height="180" rx="16" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/></g>
  <path d="M350 108 v-30 a16 16 0 0 1 16 -16 h168 a16 16 0 0 1 16 16 v30 z" fill="url(#headGreen)"/>
  <text x="450" y="93" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GitHub</text>
  <rect x="370" y="122" width="160" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="450" y="158" font-size="15" font-weight="bold" fill="#1b4d1f" text-anchor="middle">PR のページ</text>
  <text x="450" y="192" font-size="13" fill="#1b4d1f" text-anchor="middle" font-family="Consolas,'Courier New',monospace">github.com/…/pull/1</text>

  <g filter="url(#shadow)"><rect x="660" y="62" width="200" height="180" rx="16" fill="#ffffff" stroke="#1565c0" stroke-width="2"/></g>
  <path d="M660 108 v-30 a16 16 0 0 1 16 -16 h168 a16 16 0 0 1 16 16 v30 z" fill="url(#headBlue)"/>
  <text x="760" y="93" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">他の人のスマホ</text>
  <g filter="url(#shadow)"><rect x="718" y="116" width="84" height="118" rx="12" fill="url(#screen)" stroke="#1565c0" stroke-width="2"/></g>
  <rect x="726" y="128" width="68" height="84" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="760" y="164" font-size="13" fill="#0d3c75" text-anchor="middle">PR の</text><text x="760" y="184" font-size="13" fill="#0d3c75" text-anchor="middle">ページ</text>
  <circle cx="760" cy="224" r="4" fill="#1565c0"/>
  <line x1="244" y1="142" x2="346" y2="142" stroke="#1565c0" stroke-width="6" stroke-linecap="round" marker-end="url(#arB)"/>

  <rect x="243" y="160" width="104" height="30" rx="15" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <circle cx="260" cy="175" r="11" fill="#1565c0"/>
  <text x="260" y="180" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="305" y="180" font-size="15" font-weight="bold" fill="#0d3c75" text-anchor="middle">PR を作る</text>
  <line x1="656" y1="142" x2="554" y2="142" stroke="#1565c0" stroke-width="6" stroke-linecap="round" marker-end="url(#arB)"/>

  <rect x="551" y="160" width="108" height="30" rx="15" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <circle cx="568" cy="175" r="11" fill="#1565c0"/>
  <text x="568" y="180" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="615" y="180" font-size="15" font-weight="bold" fill="#0d3c75" text-anchor="middle">URL を開く</text>
  <path d="M140 244 V300 H760 V250" fill="none" stroke="#1565c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arB)"/>

  <rect x="300" y="285" width="300" height="30" rx="15" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <circle cx="317" cy="300" r="11" fill="#1565c0"/>
  <text x="317" y="305" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="460" y="305" font-size="15" font-weight="bold" fill="#0d3c75" text-anchor="middle">URL を送る(LINE・メールなど)</text>

  <g transform="translate(11.2 113) scale(0.6)"><ellipse cx="110" cy="550" rx="38" ry="6" fill="#1E293B" opacity="0.15"/><g transform="translate(0 -14)"><path d="M140 520 C182 520 194 478 172 456" fill="none" stroke="#E08A3C" stroke-width="15" stroke-linecap="round"/><circle cx="172" cy="456" r="8" fill="#FFF1DC"/><ellipse cx="110" cy="518" rx="36" ry="32" fill="#F2A04A"/><ellipse cx="110" cy="524" rx="20" ry="22" fill="#FFF1DC"/><ellipse cx="92" cy="548" rx="13" ry="7" fill="#FFF1DC"/><ellipse cx="128" cy="548" rx="13" ry="7" fill="#FFF1DC"/><path d="M82 504 L54 464" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="54" cy="464" r="9.5" fill="#FFF1DC"/><path d="M138 504 L166 464" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="166" cy="464" r="9.5" fill="#FFF1DC"/><g transform="rotate(5 110 490)"><path d="M60 432 L58 392 L98 410 z M160 432 L162 392 L122 410 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="10" stroke-linejoin="round"/><path d="M68 420 L67 402 L86 410 z M152 420 L153 402 L134 410 z" fill="#F9A8B8" stroke="#F9A8B8" stroke-width="4" stroke-linejoin="round"/><path d="M50 466 l-11 3 l10 7 z M170 466 l11 3 l-10 7 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="3" stroke-linejoin="round"/><ellipse cx="110" cy="452" rx="62" ry="52" fill="#F2A04A"/><ellipse cx="110" cy="468" rx="30" ry="22" fill="#FFF1DC"/><path d="M110 402 v13 M95 405 l3 11 M125 405 l-3 11" fill="none" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/><ellipse cx="68" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><ellipse cx="152" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><path d="M62 472 l4 6 M69 471 l4 6 M147 471 l4 6 M154 472 l4 6" stroke="#F0708A" stroke-width="1.6" stroke-linecap="round"/><path d="M69 456 q13 -18 26 0 M125 456 q13 -18 26 0" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/><path d="M105 466 h10 l-5 5 z" fill="#F9768B" stroke="#F9768B" stroke-width="2" stroke-linejoin="round"/><path d="M98 473 q12 20 24 0 z" fill="#C2334F" stroke="#C2334F" stroke-width="2" stroke-linejoin="round"/><path d="M104 482 q6 6 12 0 q-6 -5 -12 0 z" fill="#FB8FA3"/><g stroke="#7C4A1E" stroke-width="1.8" stroke-linecap="round" opacity="0.55"><path d="M60 464 l-12 -3 M60 470 l-12 3 M160 464 l12 -3 M160 470 l12 3"/></g></g><path d="M80 497 q30 16 60 0" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="507" r="6" fill="#FBBF24" stroke="#D99A06" stroke-width="1.5"/><path d="M110 510 v3" stroke="#D99A06" stroke-width="2" stroke-linecap="round"/></g></g>
  <g filter="url(#shadow)"><rect x="176" y="337" width="684" height="92" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/></g>
  <path d="M178 367 L128 383 L178 397 z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <rect x="175" y="370" width="6" height="25" fill="#ffffff"/>
  <text x="518" y="363" font-size="16" fill="#1e293b" text-anchor="middle">PR の URL を送れば、</text>
  <text x="518" y="389" font-size="16" fill="#1e293b" text-anchor="middle">他の人も同じ変更内容を見られるんだ。</text>
  <text x="518" y="415" font-size="16" fill="#1e293b" text-anchor="middle">スマホからでも開けるよ。</text>
</svg>
