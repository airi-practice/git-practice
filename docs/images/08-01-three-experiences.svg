<svg xmlns="http://www.w3.org/2000/svg" width="900" height="506" viewBox="0 0 900 506" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif">
  <title>体験①②③で作る PR と取り込み先を示す図。①は ks/banana から main へ、②は ks/banana-2 から main へ、どちらも PR だけ作ってマージしない。③は ②のブランチから伸ばした ks/banana-3 から ks/banana-2 へ PR を作り、マージする</title>
  <desc>体験①は、新しいファイルを作った ks/banana のブランチで、main を取り込み先にした PR を作る。体験②は、既存のファイルを書き換えた ks/banana-2 のブランチで、main を取り込み先にした PR を作る。どちらもマージしない。体験③は、②のブランチから枝を伸ばした ks/banana-3 で、取り込み先を ks/banana-2 にした PR を作り、マージする。main にはどの体験でも取り込まない。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="headBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e7ad6"/><stop offset="1" stop-color="#1257a8"/></linearGradient>
    <linearGradient id="headGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43a047"/><stop offset="1" stop-color="#2a7330"/></linearGradient>
    <linearGradient id="headOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef6c00"/><stop offset="1" stop-color="#b83c00"/></linearGradient>
    <linearGradient id="headGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b8794"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
    <linearGradient id="headYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#f9a825"/></linearGradient>
    <linearGradient id="headRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e53935"/><stop offset="1" stop-color="#a61c1c"/></linearGradient>
    <linearGradient id="headP1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e24aa"/><stop offset="1" stop-color="#5a1480"/></linearGradient>
    <linearGradient id="headP2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12998a"/><stop offset="1" stop-color="#00625a"/></linearGradient>
    <linearGradient id="headP3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2185b"/><stop offset="1" stop-color="#8e0f42"/></linearGradient>
    <linearGradient id="headP4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#607d8b"/><stop offset="1" stop-color="#37474f"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6dbf73"/><stop offset="1" stop-color="#3f9a47"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arB" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="arG" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="arO" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
    <marker id="arK" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
    <marker id="arR" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="arY" markerWidth="3.2" markerHeight="3.2" viewBox="0 0 10 10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9a825"/></marker>
  </defs>
  <rect width="900" height="506" fill="url(#bg)"/>

  <text x="450" y="38" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">体験①②③で作る PR と、取り込み先</text>

  <g filter="url(#shadow)"><rect x="40" y="62" width="300" height="90" rx="16" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/></g>
  <path d="M40 108 v-30 a16 16 0 0 1 16 -16 h268 a16 16 0 0 1 16 16 v30 z" fill="url(#headGreen)"/>
  <text x="190" y="93" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">ks/banana</text>
  <text x="190" y="136" font-size="15" fill="#475569" text-anchor="middle">新しいファイルを作る</text>
<circle cx="22" cy="85" r="11" fill="#555555"/>
  <text x="22" y="90" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="352" y1="114" x2="548" y2="114" stroke="#555555" stroke-width="6" stroke-linecap="round" marker-end="url(#arK)"/>

  <rect x="355" y="68" width="190" height="30" rx="15" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="450" y="88" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">PR だけ作る(マージしない)</text>

  <g filter="url(#shadow)"><rect x="560" y="62" width="300" height="90" rx="16" fill="#ffffff" stroke="#555555" stroke-width="2"/></g>
  <path d="M560 108 v-30 a16 16 0 0 1 16 -16 h268 a16 16 0 0 1 16 16 v30 z" fill="url(#headGray)"/>
  <text x="710" y="93" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">main</text>
  <text x="710" y="136" font-size="15" fill="#475569" text-anchor="middle">変わらない</text>

  <g filter="url(#shadow)"><rect x="40" y="170" width="300" height="90" rx="16" fill="#ffffff" stroke="#f9a825" stroke-width="2"/></g>
  <path d="M40 216 v-30 a16 16 0 0 1 16 -16 h268 a16 16 0 0 1 16 16 v30 z" fill="url(#headYellow)"/>
  <text x="190" y="201" font-size="18" font-weight="bold" fill="#5c3d00" text-anchor="middle">ks/banana-2</text>
  <text x="190" y="244" font-size="15" fill="#475569" text-anchor="middle">既存のファイルを書き換える</text>
<circle cx="22" cy="193" r="11" fill="#555555"/>
  <text x="22" y="198" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <line x1="352" y1="222" x2="548" y2="222" stroke="#555555" stroke-width="6" stroke-linecap="round" marker-end="url(#arK)"/>

  <rect x="355" y="176" width="190" height="30" rx="15" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="450" y="196" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">PR だけ作る(マージしない)</text>

  <g filter="url(#shadow)"><rect x="560" y="170" width="300" height="90" rx="16" fill="#ffffff" stroke="#555555" stroke-width="2"/></g>
  <path d="M560 216 v-30 a16 16 0 0 1 16 -16 h268 a16 16 0 0 1 16 16 v30 z" fill="url(#headGray)"/>
  <text x="710" y="201" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">main</text>
  <text x="710" y="244" font-size="15" fill="#475569" text-anchor="middle">変わらない</text>

  <g filter="url(#shadow)"><rect x="40" y="278" width="300" height="90" rx="16" fill="#ffffff" stroke="#f9a825" stroke-width="2"/></g>
  <path d="M40 324 v-30 a16 16 0 0 1 16 -16 h268 a16 16 0 0 1 16 16 v30 z" fill="url(#headYellow)"/>
  <text x="190" y="309" font-size="18" font-weight="bold" fill="#5c3d00" text-anchor="middle">ks/banana-3</text>
  <text x="190" y="352" font-size="15" fill="#475569" text-anchor="middle">②から枝を伸ばして、1行追加</text>
<circle cx="22" cy="301" r="11" fill="#555555"/>
  <text x="22" y="306" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="352" y1="330" x2="548" y2="330" stroke="#1565c0" stroke-width="6" stroke-linecap="round" marker-end="url(#arB)"/>

  <rect x="355" y="284" width="190" height="30" rx="15" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="450" y="304" font-size="15" font-weight="bold" fill="#0d3c75" text-anchor="middle">PR を作って、マージする</text>

  <g filter="url(#shadow)"><rect x="560" y="278" width="300" height="90" rx="16" fill="#ffffff" stroke="#f9a825" stroke-width="2"/></g>
  <path d="M560 324 v-30 a16 16 0 0 1 16 -16 h268 a16 16 0 0 1 16 16 v30 z" fill="url(#headYellow)"/>
  <text x="710" y="309" font-size="18" font-weight="bold" fill="#5c3d00" text-anchor="middle">ks/banana-2(②のブランチ)</text>
  <text x="710" y="352" font-size="15" fill="#475569" text-anchor="middle">③の変更が取り込まれる</text>
  <line x1="190" y1="262" x2="190" y2="276" stroke="#555555" stroke-width="4" stroke-linecap="round" marker-end="url(#arK)"/>

  <g transform="translate(11.2 166) scale(0.6)"><ellipse cx="110" cy="550" rx="48" ry="6" fill="#1E293B" opacity="0.15"/><g transform="translate(0 0)"><path d="M142 534 C190 540 200 490 180 468" fill="none" stroke="#E08A3C" stroke-width="15" stroke-linecap="round"/><circle cx="180" cy="468" r="8" fill="#FFF1DC"/><ellipse cx="110" cy="518" rx="36" ry="32" fill="#F2A04A"/><ellipse cx="110" cy="524" rx="20" ry="22" fill="#FFF1DC"/><ellipse cx="92" cy="545" rx="13" ry="7" fill="#FFF1DC"/><ellipse cx="128" cy="545" rx="13" ry="7" fill="#FFF1DC"/><path d="M82 512 L76 534" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="76" cy="534" r="9.5" fill="#FFF1DC"/><path d="M138 504 L170 470" stroke="#F2A04A" stroke-width="17" stroke-linecap="round"/><circle cx="170" cy="470" r="9.5" fill="#FFF1DC"/><g transform="rotate(-5 110 490)"><path d="M60 432 L58 392 L98 410 z M160 432 L162 392 L122 410 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="10" stroke-linejoin="round"/><path d="M68 420 L67 402 L86 410 z M152 420 L153 402 L134 410 z" fill="#F9A8B8" stroke="#F9A8B8" stroke-width="4" stroke-linejoin="round"/><path d="M50 466 l-11 3 l10 7 z M170 466 l11 3 l-10 7 z" fill="#F2A04A" stroke="#F2A04A" stroke-width="3" stroke-linejoin="round"/><ellipse cx="110" cy="452" rx="62" ry="52" fill="#F2A04A"/><ellipse cx="110" cy="468" rx="30" ry="22" fill="#FFF1DC"/><path d="M110 402 v13 M95 405 l3 11 M125 405 l-3 11" fill="none" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/><ellipse cx="68" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><ellipse cx="152" cy="474" rx="12" ry="7.5" fill="#FB8FA3" opacity="0.7"/><path d="M62 472 l4 6 M69 471 l4 6 M147 471 l4 6 M154 472 l4 6" stroke="#F0708A" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="82" cy="452" rx="12" ry="15" fill="#1E293B"/><ellipse cx="138" cy="452" rx="12" ry="15" fill="#1E293B"/><circle cx="86" cy="446" r="5" fill="#fff"/><circle cx="142" cy="446" r="5" fill="#fff"/><circle cx="78" cy="459" r="2.4" fill="#fff"/><circle cx="134" cy="459" r="2.4" fill="#fff"/><path d="M105 466 h10 l-5 5 z" fill="#F9768B" stroke="#F9768B" stroke-width="2" stroke-linejoin="round"/><path d="M110 471 q-6 8 -12 1 M110 471 q6 8 12 1" fill="none" stroke="#7C4A1E" stroke-width="2.2" stroke-linecap="round"/><g stroke="#7C4A1E" stroke-width="1.8" stroke-linecap="round" opacity="0.55"><path d="M60 464 l-12 -3 M60 470 l-12 3 M160 464 l12 -3 M160 470 l12 3"/></g></g><path d="M80 497 q30 16 60 0" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="507" r="6" fill="#FBBF24" stroke="#D99A06" stroke-width="1.5"/><path d="M110 510 v3" stroke="#D99A06" stroke-width="2" stroke-linecap="round"/></g></g>
  <g filter="url(#shadow)"><rect x="176" y="390" width="684" height="92" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/></g>
  <path d="M178 420 L128 436 L178 450 z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <rect x="175" y="423" width="6" height="25" fill="#ffffff"/>
  <text x="518" y="429" font-size="16" fill="#1e293b" text-anchor="middle">どの体験でも、main には取り込まないよ。</text>
  <text x="518" y="455" font-size="16" fill="#1e293b" text-anchor="middle">マージするのは、③で②のブランチに入れるときだけ。</text>
</svg>
