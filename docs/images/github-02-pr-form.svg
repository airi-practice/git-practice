<svg xmlns="http://www.w3.org/2000/svg" width="900" height="802" viewBox="0 0 900 802" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>GitHub の PR を作る画面（体験①）</title>
  <desc>GitHub の「Open a pull request」の画面。base が main、compare が ks/banana になっている。タイトルの欄と説明の欄に決められた文章を貼り、緑の「Create pull request」ボタンを押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="802" fill="#ffffff"/>
