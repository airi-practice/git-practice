  <circle cx="20" cy="22" r="6" fill="#ef5350"/><circle cx="40" cy="22" r="6" fill="#ffb300"/><circle cx="60" cy="22" r="6" fill="#43a047"/>
  <rect x="86" y="7" width="790" height="30" rx="15" fill="#ffffff" stroke="#c4c7cc"/><text x="106" y="27" font-size="14" fill="#333">https://github.com/your-org/git-practice-exercise/compare/main...ks/banana</text><rect x="1" y="45" width="898" height="56" fill="#f6f8fa"/><line x1="1" y1="101" x2="899" y2="101" stroke="#d0d7de"/><rect x="14" y="57" width="34" height="32" rx="6" fill="#fff" stroke="#d0d7de"/><path d="M22,67 h18 M22,73 h18 M22,79 h18" stroke="#444" stroke-width="2" stroke-linecap="round"/><circle cx="76" cy="73" r="16" fill="#1f2328"/><path d="M67.2,71.4 q0,-9.6 8.8,-9.6 q8.8,0 8.8,9.6 q0,8.8 -8.8,8.8 q-8.8,0 -8.8,-8.8 z M67.2,69.8 l1.6,-9.6 l6.4,4.8 z M84.8,69.8 l-1.6,-9.6 l-6.4,4.8 z" fill="#ffffff"/><text x="104" y="79" font-size="14" fill="#0969da">your-org</text><text x="172.48000000000002" y="79" font-size="14" fill="#59636e">/</text><text x="188.48000000000002" y="79" font-size="14" font-weight="bold" fill="#1f2328">git-practice-exercise</text><rect x="420" y="58" width="220" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><circle cx="436" cy="72" r="5.5" fill="none" stroke="#666" stroke-width="1.8"/><path d="M440.5,76.5 l4.5,4.5" stroke="#666" stroke-width="1.8" stroke-linecap="round"/><text x="456" y="78" font-size="13" fill="#59636e">Type / to search</text><rect x="656" y="58" width="54" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><path d="M664,73 h14 M671,66 v14" stroke="#444" stroke-width="2" stroke-linecap="round"/><path d="M688,71 l5,5 l5,-5" stroke="#555" stroke-width="1.6" fill="none"/><rect x="718" y="58" width="34" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><circle cx="735" cy="73" r="7" fill="none" stroke="#444" stroke-width="1.8"/><circle cx="735" cy="73" r="1.8" fill="#444"/><rect x="758" y="58" width="34" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><circle cx="770" cy="68" r="2.6" fill="none" stroke="#444" stroke-width="1.8"/><circle cx="770" cy="78" r="2.6" fill="none" stroke="#444" stroke-width="1.8"/><circle cx="780" cy="78" r="2.6" fill="none" stroke="#444" stroke-width="1.8"/><path d="M770,70.6 v4.8 M780,75.4 v-4 a3,3 0 0 0 -3,-3 h-3" fill="none" stroke="#444" stroke-width="1.8"/><rect x="798" y="58" width="34" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><path d="M806,74 l3,-7 h10 l3,7 v6 h-16 z M806,74 h5 a3,3 0 0 0 6,0 h5" fill="none" stroke="#444" stroke-width="1.8" stroke-linejoin="round"/><circle cx="862" cy="73" r="14" fill="#8250df"/><text x="862" y="78" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">ks</text>
  <text x="40" y="142" font-size="24" fill="#1f2328">Open a pull request</text><text x="40" y="168" font-size="13" fill="#59636e">Create a new pull request by comparing changes across two branches.</text>
  <rect x="40" y="186" width="127" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text x="52" y="208" font-size="14" font-weight="bold" fill="#1f2328">base: main</text><path d="M151,200 l5,5 l5,-5" stroke="#555" stroke-width="1.6" fill="none"/><path d="M201,203 H179 M185,197 l-6,6 l6,6" stroke="#59636e" stroke-width="2" fill="none"/><rect x="217" y="186" width="194" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text x="229" y="208" font-size="14" font-weight="bold" fill="#1f2328">compare: ks/banana</text><path d="M395,200 l5,5 l5,-5" stroke="#555" stroke-width="1.6" fill="none"/><text x="40" y="244" font-size="13" font-weight="bold" fill="#1a7f37">✔ Able to merge.</text><text x="160" y="244" font-size="13" fill="#59636e">These branches can be automatically merged.</text>
  <circle cx="58" cy="288" r="18" fill="#8250df"/><text x="58" y="293" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">ks</text><rect x="88" y="266" width="532" height="40" rx="6" fill="#fff" stroke="#d0d7de"/><text x="102" y="292" font-size="14" fill="#1f2328">演習①: wishlist-ks.txt を追加</text>
  <rect x="88" y="320" width="532" height="250" rx="6" fill="#fff" stroke="#d0d7de"/><path d="M89,356 v-30 a5,5 0 0 1 5,-5 h520 a5,5 0 0 1 5,5 v30 z" fill="#f6f8fa"/><line x1="89" y1="356" x2="619" y2="356" stroke="#d0d7de"/><text x="104" y="344" font-size="14" font-weight="bold" fill="#1f2328">Write</text><text x="160" y="344" font-size="14" fill="#59636e">Preview</text><text x="104" y="386" font-size="14" font-weight="bold" fill="#59636e">H</text><text x="134" y="386" font-size="14" font-weight="bold" fill="#59636e">B</text><text x="162" y="386" font-size="14" fill="#59636e">I</text><text x="190" y="386" font-size="14" font-weight="bold" fill="#59636e">“</text><text x="214" y="386" font-size="14" fill="#59636e" font-family="Consolas, 'Courier New', monospace">&lt;></text><text x="246" y="386" font-size="13" fill="#59636e">link</text><text x="290" y="386" font-size="13" fill="#59636e">• list</text><line x1="89" y1="398" x2="619" y2="398" stroke="#d0d7de"/><text x="104" y="416" font-size="13" fill="#1f2328">演習①のPRです。</text><text x="104" y="435" font-size="13" fill="#1f2328">practice/wishlist-ks.txt を新規作成しました。</text><text x="104" y="454" font-size="13" fill="#1f2328"></text><text x="104" y="473" font-size="13" fill="#1f2328">---</text><text x="104" y="492" font-size="13" fill="#1f2328">【講師向け】確認後の後片付け</text><text x="104" y="511" font-size="13" fill="#1f2328">1. PRのページ下部の「Close pull request」を押す</text><text x="104" y="530" font-size="13" fill="#1f2328">2. 「Delete branch」を押して、ブランチを削除する</text><line x1="89" y1="544" x2="619" y2="544" stroke="#d0d7de"/><text x="104" y="562" font-size="12" fill="#59636e">Markdown is supported</text><text x="610" y="562" font-size="12" fill="#59636e" text-anchor="end">Paste, drop, or click to add files</text>
  <rect x="436" y="586" width="150" height="32" rx="6" fill="#1f883d" stroke="#1b7f37"/><text x="511" y="607" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Create pull request</text><rect x="586" y="586" width="34" height="32" rx="6" fill="#1f883d" stroke="#1b7f37"/><path d="M597,600 l5,5 l5,-5" stroke="#fff" stroke-width="1.6" fill="none"/>
  <text x="650" y="276" font-size="13" font-weight="bold" fill="#59636e">Reviewers</text><circle cx="847" cy="271" r="3" fill="none" stroke="#59636e" stroke-width="1.6"/><path d="M847,264 v2.5 M847,275.5 v2.5 M840,271 h2.5 M851.5,271 h2.5 M842,266 l1.8,1.8 M850.2,274.2 l1.8,1.8 M852,266 l-1.8,1.8 M843.8,274.2 l-1.8,1.8" stroke="#59636e" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="300" font-size="13" fill="#59636e">No reviews</text><line x1="650" y1="316" x2="860" y2="316" stroke="#d0d7de"/><text x="650" y="340" font-size="13" font-weight="bold" fill="#59636e">Assignees</text><circle cx="847" cy="335" r="3" fill="none" stroke="#59636e" stroke-width="1.6"/><path d="M847,328 v2.5 M847,339.5 v2.5 M840,335 h2.5 M851.5,335 h2.5 M842,330 l1.8,1.8 M850.2,338.2 l1.8,1.8 M852,330 l-1.8,1.8 M843.8,338.2 l-1.8,1.8" stroke="#59636e" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="364" font-size="13" fill="#59636e">No one—assign yourself</text><line x1="650" y1="380" x2="860" y2="380" stroke="#d0d7de"/><text x="650" y="404" font-size="13" font-weight="bold" fill="#59636e">Labels</text><circle cx="847" cy="399" r="3" fill="none" stroke="#59636e" stroke-width="1.6"/><path d="M847,392 v2.5 M847,403.5 v2.5 M840,399 h2.5 M851.5,399 h2.5 M842,394 l1.8,1.8 M850.2,402.2 l1.8,1.8 M852,394 l-1.8,1.8 M843.8,402.2 l-1.8,1.8" stroke="#59636e" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="428" font-size="13" fill="#59636e">None yet</text><line x1="650" y1="444" x2="860" y2="444" stroke="#d0d7de"/><text x="650" y="468" font-size="13" font-weight="bold" fill="#59636e">Projects</text><circle cx="847" cy="463" r="3" fill="none" stroke="#59636e" stroke-width="1.6"/><path d="M847,456 v2.5 M847,467.5 v2.5 M840,463 h2.5 M851.5,463 h2.5 M842,458 l1.8,1.8 M850.2,466.2 l1.8,1.8 M852,458 l-1.8,1.8 M843.8,466.2 l-1.8,1.8" stroke="#59636e" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="492" font-size="13" fill="#59636e">None yet</text><line x1="650" y1="508" x2="860" y2="508" stroke="#d0d7de"/><text x="650" y="532" font-size="13" font-weight="bold" fill="#59636e">Milestone</text><circle cx="847" cy="527" r="3" fill="none" stroke="#59636e" stroke-width="1.6"/><path d="M847,520 v2.5 M847,531.5 v2.5 M840,527 h2.5 M851.5,527 h2.5 M842,522 l1.8,1.8 M850.2,530.2 l1.8,1.8 M852,522 l-1.8,1.8 M843.8,530.2 l-1.8,1.8" stroke="#59636e" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="556" font-size="13" fill="#59636e">No milestone</text><line x1="650" y1="572" x2="860" y2="572" stroke="#d0d7de"/>
