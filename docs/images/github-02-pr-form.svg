  <rect x="217" y="186" width="194" height="34" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="217" cy="186" r="11" fill="#e53e3e"/><text x="217" y="191" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="88" y="266" width="532" height="40" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="88" cy="266" r="11" fill="#e53e3e"/><text x="88" y="271" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <rect x="88" y="320" width="532" height="250" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="88" cy="320" r="11" fill="#e53e3e"/><text x="88" y="325" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <rect x="436" y="586" width="150" height="32" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="436" cy="586" r="11" fill="#e53e3e"/><text x="436" y="591" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <rect x="0.5" y="650" width="899" height="152" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="680" font-size="15" font-weight="bold" fill="#c53030">1. base が main(取り込み先)になっている</text>
  <text x="14" y="706" font-size="15" font-weight="bold" fill="#c53030">2. compare が自分のブランチ(取り込みたい内容)になっている</text>
  <text x="14" y="732" font-size="15" font-weight="bold" fill="#c53030">3. タイトルの欄に、決められたタイトルを入れる</text>
  <text x="14" y="758" font-size="15" font-weight="bold" fill="#c53030">4. 説明の欄に、決められた説明を貼る</text>
  <text x="14" y="784" font-size="15" font-weight="bold" fill="#c53030">5. 「Create pull request」を押す</text>
</svg>
