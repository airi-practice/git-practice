  <rect x="40" y="304" width="820" height="190" rx="6" fill="#fff" stroke="#d0d7de"/><path d="M41,342 v-32 a5,5 0 0 1 5,-5 h808 a5,5 0 0 1 5,5 v32 z" fill="#f6f8fa"/><line x1="41" y1="342" x2="859" y2="342" stroke="#d0d7de"/><text x="56" y="329" font-size="14" font-weight="bold" fill="#1f2328">practice/sample-menu.txt</text><text x="700" y="329" font-size="13" font-weight="bold" fill="#1a7f37" text-anchor="end">+1</text><text x="726" y="329" font-size="13" font-weight="bold" fill="#cf222e" text-anchor="end">−1</text><rect x="760" y="314" width="84" height="24" rx="6" fill="#fff" stroke="#d0d7de"/><text x="802" y="331" font-size="12" fill="#59636e" text-anchor="middle">Viewed</text><rect x="41" y="344" width="818" height="30" fill="#ffffff"/><text x="88" y="365" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas, 'Courier New', monospace">1</text><text x="128" y="365" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas, 'Courier New', monospace">1</text><text x="150" y="365" font-size="14" fill="#1f2328">  ランチのメニュー</text><rect x="41" y="374" width="818" height="30" fill="#ffebe9"/><text x="88" y="395" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas, 'Courier New', monospace">2</text><text x="128" y="395" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas, 'Courier New', monospace"></text><text x="150" y="395" font-size="14" fill="#1f2328">- カレーライス</text><rect x="41" y="404" width="818" height="30" fill="#dafbe1"/><text x="88" y="425" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas, 'Courier New', monospace"></text><text x="128" y="425" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas, 'Courier New', monospace">2</text><text x="150" y="425" font-size="14" fill="#1f2328">+ ラーメン</text><rect x="41" y="434" width="818" height="30" fill="#ffffff"/><text x="88" y="455" font-size="13" fill="#59636e" text-anchor="end" font-family="Consolas, 'Courier New', m