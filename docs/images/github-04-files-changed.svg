  <text x="40" y="146" font-size="24" fill="#1f2328">演習②: sample-menu.txt の2行目を書き換え</text><text x="564.24" y="146" font-size="24" fill="#59636e">#13</text><rect x="40" y="164" width="70" height="30" rx="15" fill="#1a7f37"/><text x="75" y="184" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Open</text><text x="124" y="184" font-size="14" fill="#1f2328">ks wants to merge 1 commit into</text><rect x="366" y="168" width="47" height="26" rx="13" fill="#ddf4ff"/><text x="389.5" y="186" font-size="13" fill="#0969da" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">main</text><text x="421" y="184" font-size="14" fill="#1f2328">from</text><rect x="469" y="168" width="93" height="26" rx="13" fill="#ddf4ff"/><text x="515.5" y="186" font-size="13" fill="#0969da" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">ks/banana-2</text><line x1="1" y1="248" x2="899" y2="248" stroke="#d0d7de"/><text x="40" y="236" font-size="14" fill="#1f2328">Conversation</text><text x="166" y="236" font-size="14" fill="#1f2328">Commits</text><text x="262" y="236" font-size="14" fill="#1f2328">Checks</text><text x="348" y="236" font-size="14" font-weight="bold" fill="#1f2328">Files changed</text><rect x="342" y="245" width="110" height="3" rx="1.5" fill="#fd8c73"/><rect x="470" y="221" width="24" height="20" rx="10" fill="#d1d9e0"/><text x="482" y="236" font-size="13" fill="#1f2328" text-anchor="middle">1</text>
