<svg xmlns="http://www.w3.org/2000/svg" width="900" height="574" viewBox="0 0 900 574" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>GitHub の PR を作る画面（体験③: 取り込み先を切り替える）</title>
  <desc>PR を作る画面で、base: main のボタンを押すと、ブランチの一覧が開く。この中から ks/banana-2(②のブランチ)を選ぶ。</desc>
