  <rect x="42" y="404" width="316" height="32" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="42" cy="404" r="11" fill="#e53e3e"/><text x="42" y="409" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="0.5" y="500" width="899" height="74" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="530" font-size="15" font-weight="bold" fill="#c53030">1. 「base: main」のボタンを押して、一覧を開く</text>
  <text x="14" y="556" font-size="15" font-weight="bold" fill="#c53030">2. 一覧から、②のブランチ(ks/banana-2)を選ぶ</text>
