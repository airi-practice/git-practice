  <text x="40" y="146" font-size="24" fill="#1f2328">演習③: sample-menu.txt に4行目を追加</text><text x="516.24" y="146" font-size="24" fill="#59636e">#14</text><rect x="40" y="164" width="70" height="30" rx="15" fill="#1a7f37"/><text x="75" y="184" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Open</text><text x="124" y="184" font-size="14" fill="#1f2328">ks wants to merge 1 commit into</text><rect x="366" y="168" width="93" height="26" rx="13" fill="#ddf4ff"/><text x="412.5" y="186" font-size="13" fill="#0969da" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">ks/banana-2</text><text x="467" y="184" font-size="14" fill="#1f2328">from</text><rect x="515" y="168" width="93" height="26" rx="13" fill="#ddf4ff"/><text x="561.5" y="186" font-size="13" fill="#0969da" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">ks/banana-3</text><line x1="1" y1="248" x2="899" y2="248" stroke="#d0d7de"/><text x="40" y="236" font-size="14" font-weight="bold" fill="#1f2328">Conversation</text><rect x="34" y="245" width="100" height="3" rx="1.5" fill="#fd8c73"/><text x="166" y="236" font-size="14" fill="#1f2328">Commits</text><text x="262" y="236" font-size="14" fill="#1f2328">Checks</text><text x="348" y="236" font-size="14" fill="#1f2328">Files changed</text><rect x="470" y="221" width="24" height="20" rx="10" fill="#d1d9e0"/><text x="482" y="236" font-size="13" fill="#1f2328" text-anchor="middle">1</text><circle cx="58" cy="282" r="18" fill="#8250df"/><text x="58" y="287" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">ks</text><rect x="88" y="262" width="532" height="118" rx="6" fill="#fff" stroke="#d0d7de"/><path d="M89,298 v-26 a5,5 0 0 1 5,-5 h520 a5,5 0 0 1 5,5 v26 z" fill="#f6f8fa" stroke="none"/><line x1="89" y1="298" x2="619" y2="298" stroke="#d0d7de"/><text x="102" y="286" font-size="14" fill="#59636e">ks commented now</text><rect x="520" y="270" width="56" height="22" rx="11" fill="#fff" stroke="#d0d7de"/><text x="548" y="286" font-size="12" fill="#59636e" text-anchor="middle">Author</text><text x="102" y="324" font-size="14" fill="#1f2328">演習③のPRです。</text><text x="102" y="348" font-size="14" fill="#1f2328">practice/sample-menu.txt に4行目を追加しました。</text><text x="102" y="372" font-size="14" fill="#1f2328">取り込み先は、②のブランチ(ks/banana-2)です。</text><text x="650" y="276" font-size="13" font-weight="bold" fill="#59636e">Reviewers</text><circle cx="847" cy="271" r="3" fill="none" stroke="#59636e" stroke-width="1.6"/><path d="M847,264 v2.5 M847,275.5 v2.5 M840,271 h2.5 M851.5,271 h2.5 M842,266 l1.8,1.8 M850.2,274.2 l1.8,1.8 M852,266 l-1.8,1.8 M843.8,274.2 l-1.8,1.8" stroke="#59636e" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="300" font-size="13" fill="#59636e">No reviews</text><line x1="650" y1="316" x2="860" y2="316" stroke="#d0d7de"/><text x="650" y="340" font-size="13" font-weight="bold" fill="#59636e">Assignees</text><circle cx="847" cy="335" r="3" fill="none" stroke="#59636e" stroke-width="1.6"/><path d="M847,328 v2.5 M847,339.5 v2.5 M840,335 h2.5 M851.5,335 h2.5 M842,330 l1.8,1.8 M850.2,338.2 l1.8,1.8 M852,330 l-1.8,1.8 M843.8,338.2 l-1.8,1.8" stroke="#59636e" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="364" font-size="13" fill="#59636e">No one—assign yourself</text><line x1="650" y1="380" x2="860" y2="380" stroke="#d0d7de"/><text x="650" y="404" font-size="13" font-weight="bold" fill="#59636e">Labels</text><circle cx="847" cy="399" r="3" fill="none" stroke="#59636e" stroke-width="1.6"/><path d="M847,392 v2.5 M847,403.5 v2.5 M840,399 h2.5 M851.5,399 h2.5 M842,394 l1.8,1.8 M850.2,402.2 l1.8,1.8 M852,394 l-1.8,1.8 M843.8,402.2 l-1.8,1.8" stroke="#59636e" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="428" font-size="13" fill="#59636e">None yet</text><line x1="650" y1="444" x2="860" y2="444" stroke="#d0d7de"/><text x="650" y="468" font-size="13" font-weight="bold" fill="#59636e">Projects</text><circle cx="847" cy="463" r="3" fill="