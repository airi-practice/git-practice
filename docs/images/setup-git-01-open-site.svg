<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>Git for Windows の公式サイトのトップページ</title>
  <desc>Git for Windows の公式サイトのトップページ。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="274" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="250" rx="8" fill="#f7fafc" stroke="#999" stroke-width="2"/>
  <path d="M10 18a8 8 0 0 1 8-8h864a8 8 0 0 1 8 8v32h-880z" fill="#e2e8f0" stroke="#999" stroke-width="2"/>
  <rect x="100" y="18" width="700" height="24" rx="12" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="118" y="35" font-size="13" fill="#333" font-family="Consolas, 'Courier New', monospace">https://gitforwindows.org/</text>
  <text x="870" y="37" font-size="18" fill="#666">×</text>
  <text x="40" y="92" font-size="20" font-weight="bold" fill="#222">Git for Windows</text>
  <text x="40" y="131" font-size="15" fill="#222">Windows で Git を使うための公式サイト</text>
  <rect x="40" y="146" width="128.64" height="40" rx="4" fill="#e2e8f0" stroke="#999" stroke-width="1"/><text x="104.32" y="171" font-size="14" fill="#333" text-anchor="middle">Download</text>
  <text x="40" y="218" font-size="15" font-weight="bold" fill="#c53030">公式サイトを開く</text>
  
</svg>
