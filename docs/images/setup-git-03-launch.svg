  <text x="76" y="93" font-size="15" font-weight="bold" fill="#222" font-family="Consolas, 'Courier New', monospace">Git-(バージョン)-64-bit.exe</text>
  <rect x="34" y="68" width="276" height="38" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <text x="40" y="132" font-size="13" fill="#555">ダウンロードフォルダーの中身</text>
  <path d="M630,87 L318,87" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="640" y="93" font-size="15" font-weight="bold" fill="#c53030">1. ダブルクリックする</text>
</svg>
