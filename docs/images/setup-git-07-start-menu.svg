  <rect x="11" y="11" width="618" height="31" fill="#fff"/>
  <rect x="21" y="20" width="14" height="14" rx="1.5" fill="#f05133" transform="rotate(45 28 27)"/><path d="M26 23.5V31M26 26L30.5 23" stroke="#fff" stroke-width="1.3" fill="none"/><circle cx="26" cy="23.5" r="1.5" fill="#fff"/><circle cx="26" cy="31" r="1.5" fill="#fff"/><circle cx="30.5" cy="23" r="1.5" fill="#fff"/>
  <text x="48" y="31" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Git 2.56.1 Setup</text>
