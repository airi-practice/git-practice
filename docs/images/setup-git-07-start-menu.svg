  <text x="34" y="68" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Select Start Menu Folder</text>
  <text x="52" y="90" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Where should Setup place the program’s shortcuts?</text>
