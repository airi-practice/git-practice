  <rect x="418" y="360" width="92" height="30" rx="3" fill="#fdfdfd" stroke="#0078d4" stroke-width="2"/><text x="464" y="380" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Next ></text>
