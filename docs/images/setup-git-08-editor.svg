  <rect x="11" y="42" width="618" height="272" fill="#f0f0f0"/>
  <rect x="11" y="42" width="618" height="62" fill="#fff"/>
  <path d="M11 104h618" stroke="#c8c8c8"/>
  <text x="34" y="68" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Choosing the default editor used by Git</text>
  <text x="52" y="90" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Which editor would you like Git to use?</text>
  <rect x="568.6" y="57.599999999999994" width="30.800000000000004" height="30.800000000000004" rx="3.3000000000000003" fill="#f05133" transform="rotate(45 584 73)"/><path d="M579.6 65.3V81.8M579.6 70.8L589.5 64.2" stroke="#fff" stroke-width="2.8600000000000003" fill="none"/><circle cx="579.6" cy="65.3" r="3.3000000000000003" fill="#fff"/><circle cx="579.6" cy="81.8" r="3.3000000000000003" fill="#fff"/><circle cx="589.5" cy="64.2" r="3.3000000000000003" fill="#fff"/>
  <path d="M11 314h618" stroke="#c8c8c8"/>
  <rect x="34" y="130" width="360" height="28" fill="#fff" stroke="#7a7a7a" stroke-width="1"/>
  <text x="42" y="149" font-size="14" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Use Notepad as Git’s default editor</text>
  <path d="M372 141l6 6l6-6" fill="none" stroke="#444" stroke-width="1.6"/>
  <rect x="30" y="126" width="368" height="36" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
