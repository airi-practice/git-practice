<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>エディターの選択画面で Notepad を選んだ状態</title>
  <desc>エディターの選択画面で Notepad を選んだ状態。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="620" height="396" rx="6" fill="#fff" stroke="#7a7a7a" stroke-width="1.5"/>
  <rect x="11" y="11" width="618" height="31" fill="#fff"/>
  <rect x="21" y="20" width="14" height="14" rx="1.5" fill="#f05133" transform="rotate(45 28 27)"/><path d="M26 23.5V31M26 26L30.5 23" stroke="#fff" stroke-width="1.3" fill="none"/><circle cx="26" cy="23.5" r="1.5" fill="#fff"/><circle cx="26" cy="31" r="1.5" fill="#fff"/><circle cx="30.5" cy="23" r="1.5" fill="#fff"/>
  <text x="48" y="31" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Git 2.56.1 Setup</text>
