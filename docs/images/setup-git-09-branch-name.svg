<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>最初のブランチ名を main にした画面</title>
  <desc>最初のブランチ名を main にした画面。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="352" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="328" rx="8" fill="#f7fafc" stroke="#999" stroke-width="2"/>
  <path d="M10 18a8 8 0 0 1 8-8h864a8 8 0 0 1 8 8v32h-880z" fill="#e2e8f0" stroke="#999" stroke-width="2"/>
  <text x="24" y="36" font-size="15" font-weight="bold" fill="#222">Git Setup</text>
  <text x="870" y="37" font-size="18" fill="#666">×</text>
  <text x="40" y="92" font-size="20" font-weight="bold" fill="#222">Adjusting the name of the initial branch</text>
  <circle cx="50" cy="126" r="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="68" y="132" font-size="15" fill="#222">Let Git decide</text>
  <circle cx="50" cy="160" r="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <circle cx="50" cy="160" r="4.5" fill="#333"/>
  <text x="68" y="166" font-size="15" fill="#222">Override the default branch name for new repositories</text>
  <rect x="36" y="147" width="485.1999999999996" height="28" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <rect x="40" y="182" width="380" height="30" rx="3" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="50" y="202" font-size="15" fill="#222" font-family="Consolas, 'Courier New', monospace">main</text>
  <rect x="36" y="178" width="388" height="38" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <line x1="11" y1="272" x2="889" y2="272" stroke="#999" stroke-opacity="0.5"/>
  <rect x="770" y="286" width="96" height="34" rx="4" fill="#e2e8f0" stroke="#999" stroke-width="1"/><text x="818" y="308" font-size="14" fill="#333" text-anchor="middle">Cancel</text>
  <rect x="662" y="286" width="96" height="34" rx="4" fill="#e2e8f0" stroke="#e53e3e" stroke-width="2"/><text x="710" y="308" font-size="14" fill="#333" text-anchor="middle">Next ></text>
  <rect x="659" y="283" width="102" height="40" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <g opacity="0.45"><rect x="554" y="286" width="96" height="34" rx="4" fill="#e2e8f0" stroke="#999" stroke-width="1"/><text x="602" y="308" font-size="14" fill="#333" text-anchor="middle">&lt; Back</text></g>
  <path d="M630,161 L529.1999999999996,161" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="640" y="167" font-size="15" font-weight="bold" fill="#c53030">1. 「Override…」を選ぶ</text>
  <path d="M630,197 L432,197" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="640" y="203" font-size="15" font-weight="bold" fill="#c53030">2. main と入力する</text>
  <path d="M710,260 L710,278" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="710" y="254" font-size="15" font-weight="bold" fill="#c53030" text-anchor="middle">3. 「Next」を押す</text>
</svg>
