<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>最初のブランチ名を main にした画面</title>
  <desc>最初のブランチ名を main にした画面。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="620" height="356" rx="6" fill="#fff" stroke="#7a7a7a" stroke-width="1.5"/>
  <rect x="11" y="11" width="618" height="31" fill="#fff"/>
  <rect x="21" y="20" width="14" height="14" rx="1.5" fill="#f05133" transform="rotate(45 28 27)"/><path d="M26 23.5V31M26 26L30.5 23" stroke="#fff" stroke-width="1.3" fill="none"/><circle cx="26" cy="23.5" r="1.5" fill="#fff"/><circle cx="26" cy="31" r="1.5" fill="#fff"/><circle cx="30.5" cy="23" r="1.5" fill="#fff"/>
  <text x="48" y="31" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Git 2.56.1 Setup</text>
  <path d="M546 27h10M578 22h10v10h-10zM610 22l10 10M620 22l-10 10" stroke="#222" stroke-width="1.2" fill="none"/>
  <rect x="11" y="42" width="618" height="232" fill="#f0f0f0"/>
  <rect x="11" y="42" width="618" height="62" fill="#fff"/>
  <path d="M11 104h618" stroke="#c8c8c8"/>
  <text x="34" y="68" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Adjusting the name of the initial branch in new repositories</text>
  <text x="52" y="90" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">What would you like Git to name the first branch?</text>
  <rect x="568.6" y="57.599999999999994" width="30.800000000000004" height="30.800000000000004" rx="3.3000000000000003" fill="#f05133" transform="rotate(45 584 73)"/><path d="M579.6 65.3V81.8M579.6 70.8L589.5 64.2" stroke="#fff" stroke-width="2.8600000000000003" fill="none"/><circle cx="579.6" cy="65.3" r="3.3000000000000003" fill="#fff"/><circle cx="579.6" cy="81.8" r="3.3000000000000003" fill="#fff"/><circle cx="589.5" cy="64.2" r="3.3000000000000003" fill="#fff"/>
  <path d="M11 274h618" stroke="#c8c8c8"/>
  <circle cx="41" cy="132" r="6.5" fill="#fff" stroke="#333"/>
  <text x="58" y="138" font-size="14" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Let Git decide</text>
  <text x="58" y="160" font-size="13" fill="#555" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Use Git’s default branch name for new repositories.</text>
  <circle cx="41" cy="181" r="6.5" fill="#fff" stroke="#333"/>
  <circle cx="41" cy="181" r="3.5" fill="#222"/>
  <text x="58" y="187" font-size="14" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Override the default branch name for new repositories</text>
  <rect x="30" y="170" width="449.5199999999996" height="24" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <text x="58" y="209" font-size="13" fill="#555" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Many teams use “main” for the first branch.</text>
  <rect x="34" y="220" width="220" height="28" fill="#fff" stroke="#7a7a7a" stroke-width="1"/>
  <text x="42" y="239" font-size="14" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">main</text>
  <rect x="30" y="216" width="228" height="36" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <text x="34" y="342" font-size="13" fill="#555" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">https://gitforwindows.org/</text>
  <rect x="520" y="320" width="92" height="30" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="566" y="340" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Cancel</text>
  <rect x="418" y="320" width="92" height="30" rx="3" fill="#fdfdfd" stroke="#0078d4" stroke-width="2"/><text x="464" y="340" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Next ></text>
  <rect x="415" y="317" width="98" height="36" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <rect x="316" y="320" width="92" height="30" rx="3" fill="#f4f4f4" stroke="#d0d0d0" stroke-width="1"/><text x="362" y="340" font-size="14" fill="#8a8a8a" text-anchor="middle" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">&lt; Back</text>
  <path d="M648,182 L487.5199999999996,182" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="656" y="188" font-size="15" font-weight="bold" fill="#c53030">1. 「Override…」を選ぶ</text>
  <path d="M648,234 L266,234" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="656" y="240" font-size="15" font-weight="bold" fill="#c53030">2. main と入力する</text>
  <path d="M464,298 L464,314" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="464" y="292" font-size="15" font-weight="bold" fill="#c53030" text-anchor="middle">3. 「Next」を押す</text>
</svg>
