  <text x="44" y="194" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">    C:\Program Files\Git</text>
  <text x="44" y="214" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Start Menu folder:</text>
  <text x="44" y="234" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">    Git</text>
  <text x="34" y="342" font-size="13" fill="#555" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">https://gitforwindows.org/</text>
  <rect x="520" y="320" width="92" height="30" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="566" y="340" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Cancel</text>
  <rect x="418" y="320" width="92" height="30" rx="3" fill="#fdfdfd" stroke="#0078d4" stroke-width="2"/><text x="464" y="340" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Install</text>
