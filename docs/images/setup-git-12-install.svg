<svg xmlns="http://www.w3.org/2000/svg" width="900" height="292" viewBox="0 0 900 292" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>「Install」ボタンの画面</title>
  <desc>「Install」ボタンの画面。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="292" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="268" rx="8" fill="#f7fafc" stroke="#999" stroke-width="2"/>
  <path d="M10 18a8 8 0 0 1 8-8h864a8 8 0 0 1 8 8v32h-880z" fill="#e2e8f0" stroke="#999" stroke-width="2"/>
  <text x="24" y="36" font-size="15" font-weight="bold" fill="#222">Git Setup</text>
  <text x="870" y="37" font-size="18" fill="#666">×</text>
  <text x="40" y="92" font-size="20" font-weight="bold" fill="#222">Ready to Install</text>
  <text x="40" y="131" font-size="15" fill="#222">Setup is now ready to begin installing Git.</text>
  <text x="40" y="160" font-size="13" fill="#555">これまでの選択内容が一覧で表示されている</text>
  <line x1="11" y1="212" x2="889" y2="212" stroke="#999" stroke-opacity="0.5"/>
  <rect x="770" y="226" width="96" height="34" rx="4" fill="#e2e8f0" stroke="#999" stroke-width="1"/><text x="818" y="248" font-size="14" fill="#333" text-anchor="middle">Cancel</text>
  <rect x="662" y="226" width="96" height="34" rx="4" fill="#e2e8f0" stroke="#e53e3e" stroke-width="2"/><text x="710" y="248" font-size="14" fill="#333" text-anchor="middle">Install</text>
  <rect x="659" y="223" width="102" height="40" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <g opacity="0.45"><rect x="554" y="226" width="96" height="34" rx="4" fill="#e2e8f0" stroke="#999" stroke-width="1"/><text x="602" y="248" font-size="14" fill="#333" text-anchor="middle">&lt; Back</text></g>
  <path d="M710,200 L710,218" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="710" y="194" font-size="15" font-weight="bold" fill="#c53030" text-anchor="middle">1. 「Install」を押す</text>
</svg>
