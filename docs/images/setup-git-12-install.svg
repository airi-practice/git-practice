<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>「Install」ボタンの画面</title>
  <desc>「Install」ボタンの画面。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="620" height="356" rx="6" fill="#fff" stroke="#7a7a7a" stroke-width="1.5"/>
  <rect x="11" y="11" width="618" height="31" fill="#fff"/>
  <rect x="21" y="20" width="14" height="14" rx="1.5" fill="#f05133" transform="rotate(45 28 27)"/><path d="M26 23.5V31M26 26L30.5 23" stroke="#fff" stroke-width="1.3" fill="none"/><circle cx="26" cy="23.5" r="1.5" fill="#fff"/><circle cx="26" cy="31" r="1.5" fill="#fff"/><circle cx="30.5" cy="23" r="1.5" fill="#fff"/>
  <text x="48" y="31" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Git 2.56.1 Setup</text>
  <path d="M546 27h10M578 22h10v10h-10zM610 22l10 10M620 22l-10 10" stroke="#222" stroke-width="1.2" fill="none"/>
  <rect x="11" y="42" width="618" height="232" fill="#f0f0f0"/>
  <rect x="11" y="42" width="618" height="62" fill="#fff"/>
  <path d="M11 104h618" stroke="#c8c8c8"/>
  <text x="34" y="68" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Ready to Install</text>
  <text x="52" y="90" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Setup is now ready to begin installing Git on your computer.</text>
  <rect x="568.6" y="57.599999999999994" width="30.800000000000004" height="30.800000000000004" rx="3.3000000000000003" fill="#f05133" transform="rotate(45 584 73)"/><path d="M579.6 65.3V81.8M579.6 70.8L589.5 64.2" stroke="#fff" stroke-width="2.8600000000000003" fill="none"/><circle cx="579.6" cy="65.3" r="3.3000000000000003" fill="#fff"/><circle cx="579.6" cy="81.8" r="3.3000000000000003" fill="#fff"/><circle cx="589.5" cy="64.2" r="3.3000000000000003" fill="#fff"/>
  <path d="M11 274h618" stroke="#c8c8c8"/>
  <text x="34" y="137" font-size="14" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Click Install to continue with the installation.</text>
  <rect x="34" y="152" width="572" height="100" fill="#fff" stroke="#7a7a7a" stroke-width="1"/>
  <rect x="590" y="153" width="15" height="98" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="592" y="156" width="11" height="38" fill="#c1c1c1"/>
