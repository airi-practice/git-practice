<svg xmlns="http://www.w3.org/2000/svg" width="900" height="294" viewBox="0 0 900 294" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>完了画面</title>
  <desc>完了画面。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="294" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="270" rx="8" fill="#f7fafc" stroke="#999" stroke-width="2"/>
  <path d="M10 18a8 8 0 0 1 8-8h864a8 8 0 0 1 8 8v32h-880z" fill="#e2e8f0" stroke="#999" stroke-width="2"/>
  <text x="24" y="36" font-size="15" font-weight="bold" fill="#222">Git Setup</text>
  <text x="870" y="37" font-size="18" fill="#666">×</text>
  <text x="40" y="92" font-size="20" font-weight="bold" fill="#222">Completing the Git Setup Wizard</text>
  <rect x="42" y="118" width="16" height="16" rx="2" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="68" y="132" font-size="15" fill="#222">View Release Notes</text>
  <text x="40" y="162" font-size="13" fill="#555">インストールが終わった</text>
  <line x1="11" y1="214" x2="889" y2="214" stroke="#999" stroke-opacity="0.5"/>
  <rect x="770" y="228" width="96" height="34" rx="4" fill="#e2e8f0" stroke="#e53e3e" stroke-width="2"/><text x="818" y="250" font-size="14" fill="#333" text-anchor="middle">Finish</text>
  <rect x="767" y="225" width="102" height="40" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <path d="M818,202 L818,220" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="858" y="196" font-size="15" font-weight="bold" fill="#c53030" text-anchor="end">1. 「Finish」を押す</text>
</svg>
