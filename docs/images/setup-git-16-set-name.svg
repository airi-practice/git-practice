<svg xmlns="http://www.w3.org/2000/svg" width="900" height="224" viewBox="0 0 900 224" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>名前を登録するコマンドを打った画面</title>
  <desc>名前を登録するコマンドを打った画面。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="224" fill="#ffffff"/>
  <rect x="10" y="10" width="620" height="200" rx="6" fill="#fff" stroke="#7a7a7a" stroke-width="1.5"/>
  <path d="M10 16a6 6 0 0 1 6-6h608a6 6 0 0 1 6 6v26h-620z" fill="#fff"/>
  <rect x="21" y="20" width="14" height="14" rx="1.5" fill="#f05133" transform="rotate(45 28 27)"/><path d="M26 23.5V31M26 26L30.5 23" stroke="#fff" stroke-width="1.3" fill="none"/><circle cx="26" cy="23.5" r="1.5" fill="#fff"/><circle cx="26" cy="31" r="1.5" fill="#fff"/><circle cx="30.5" cy="23" r="1.5" fill="#fff"/><text x="48" y="31" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">MINGW64:/c/Users/USER01</text><path d="M546 27h10M578 22h10v10h-10zM610 22l10 10M620 22l-10 10" stroke="#222" stroke-width="1.2" fill="none"/>
  <path d="M11 42h618v162a5 5 0 0 1-5 5h-608a5 5 0 0 1-5-5z" fill="#0c0c0c"/>
  <text x="24" y="70" font-size="15" fill="#3fd23f" font-family="Consolas, 'Courier New', monospace">USER01@PC</text><text x="105" y="70" font-size="15" fill="#d054d0" font-family="Consolas, 'Courier New', monospace"> MINGW64</text><text x="177" y="70" font-size="15" fill="#d6d63a" font-family="Consolas, 'Courier New', monospace"> ~</text>
  <text x="24" y="96" font-size="15" fill="#f2f2f2" font-family="Consolas, 'Courier New', monospace">$ git config --global user.name "あなたの名前"</text>
  <rect x="18" y="78" width="410" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <text x="24" y="122" font-size="15" fill="#3fd23f" font-family="Consolas, 'Courier New', monospace">USER01@PC</text><text x="105" y="122" font-size="15" fill="#d054d0" font-family="Consolas, 'Courier New', monospace"> MINGW64</text><text x="177" y="122" font-size="15" fill="#d6d63a" font-family="Consolas, 'Courier New', monospace"> ~</text>
  <text x="24" y="148" font-size="15" fill="#f2f2f2" font-family="Consolas, 'Courier New', monospace">$ </text>
  <rect x="44" y="134" width="9" height="17" fill="#e6e6e6"/>
  <path d="M648,91 L436,91" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="656" y="97" font-size="15" font-weight="bold" fill="#c53030">1. Enter キーを押す</text>
</svg>
