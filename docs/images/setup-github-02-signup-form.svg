<svg xmlns="http://www.w3.org/2000/svg" width="900" height="766" viewBox="0 0 900 766" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>GitHub の登録の画面</title>
  <desc>GitHub の「Sign up for GitHub」の画面。メールアドレス(Email)、パスワード(Password)、ユーザー名(Username)を入れて、「Continue」を押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="766" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="639" fill="#ffffff" stroke="#999"/>
  <rect x="0.5" y="0.5" width="899" height="44" fill="#dfe3e8" stroke="#999"/>
  <circle cx="20" cy="22" r="6" fill="#ef5350"/><circle cx="40" cy="22" r="6" fill="#ffb300"/><circle cx="60" cy="22" r="6" fill="#43a047"/>
  <rect x="86" y="7" width="790" height="30" rx="15" fill="#ffffff" stroke="#c4c7cc"/><text x="106" y="27" font-size="14" fill="#333">https://github.com/signup</text>
  <text x="450" y="100" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">Sign up for GitHub</text>
  <rect x="210" y="124" width="232" height="38" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text x="326" y="148" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">Continue with Google</text><rect x="458" y="124" width="232" height="38" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text x="574" y="148" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">Continue with Apple</text>
  <text x="450" y="190" font-size="14" fill="#59636e" text-anchor="middle">or</text><line x1="210" y1="185" x2="420" y2="185" stroke="#d0d7de"/><line x1="480" y1="185" x2="690" y2="185" stroke="#d0d7de"/>
  <text x="210" y="220" font-size="14" font-weight="bold" fill="#1f2328">Email*</text><rect x="210" y="230" width="480" height="38" rx="6" fill="#fff" stroke="#d0d7de"/><text x="224" y="255" font-size="14" fill="#1f2328">you@example.com</text><text x="210" y="296" font-size="14" font-weight="bold" fill="#1f2328">Password*</text><rect x="210" y="306" width="480" height="38" rx="6" fill="#fff" stroke="#d0d7de"/><text x="224" y="331" font-size="14" fill="#1f2328">••••••••••••</text><text x="210" y="362" font-size="12" fill="#59636e">Password should be at least 15 characters OR at least 8 characters including a number and a lowercase letter.</text><text x="210" y="398" font-size="14" font-weight="bold" fill="#1f2328">Username*</text><rect x="210" y="408" width="480" height="38" rx="6" fill="#fff" stroke="#d0d7de"/><text x="224" y="433" font-size="14" fill="#1f2328">your-username</text><text x="210" y="464" font-size="12" fill="#59636e">Username may only contain alphanumeric characters or single hyphens.</text>
  <rect x="210" y="530" width="480" height="42" rx="6" fill="#1f883d" stroke="#1b7f37"/><text x="450" y="556" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Continue</text>
  <rect x="210" y="230" width="480" height="38" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="210" cy="230" r="11" fill="#e53e3e"/><text x="210" y="235" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="210" y="306" width="480" height="38" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="210" cy="306" r="11" fill="#e53e3e"/><text x="210" y="311" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="210" y="408" width="480" height="38" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="210" cy="408" r="11" fill="#e53e3e"/><text x="210" y="413" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <rect x="210" y="530" width="480" height="42" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="210" cy="530" r="11" fill="#e53e3e"/><text x="210" y="535" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <rect x="0.5" y="640" width="899" height="126" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="670" font-size="15" font-weight="bold" fill="#c53030">1. メールアドレスを入れる</text>
  <text x="14" y="696" font-size="15" font-weight="bold" fill="#c53030">2. パスワードを決めて入れる(下に、使える形の説明が出る)</text>
  <text x="14" y="722" font-size="15" font-weight="bold" fill="#c53030">3. ユーザー名を決めて入れる。あとで使うので、メモしておく</text>
  <text x="14" y="748" font-size="15" font-weight="bold" fill="#c53030">4. 「Continue」を押して、画面の案内に従って進む</text>
</svg>
