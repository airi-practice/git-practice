<svg xmlns="http://www.w3.org/2000/svg" width="900" height="428" viewBox="0 0 900 428" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>GitHub の確認コードの画面</title>
  <desc>GitHub の「Verify your account」の画面。登録したメールアドレスに届いたコードを、8つの枠に入れる。メールが届かないときは「Resend the code」を押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="428" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="379" fill="#ffffff" stroke="#999"/>
  <rect x="0.5" y="0.5" width="899" height="44" fill="#dfe3e8" stroke="#999"/>
  <circle cx="20" cy="22" r="6" fill="#ef5350"/><circle cx="40" cy="22" r="6" fill="#ffb300"/><circle cx="60" cy="22" r="6" fill="#43a047"/>
  <rect x="86" y="7" width="790" height="30" rx="15" fill="#ffffff" stroke="#c4c7cc"/><text x="106" y="27" font-size="14" fill="#333">https://github.com/signup</text>
  <text x="450" y="120" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">Verify your account</text>
  <text x="450" y="156" font-size="15" fill="#59636e" text-anchor="middle">We sent a launch code to you@example.com</text><rect x="166" y="190" width="56" height="64" rx="8" fill="#fff" stroke="#d0d7de"/><text x="194" y="232" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">3</text><rect x="236" y="190" width="56" height="64" rx="8" fill="#fff" stroke="#d0d7de"/><text x="264" y="232" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">0</text><rect x="306" y="190" width="56" height="64" rx="8" fill="#fff" stroke="#d0d7de"/><text x="334" y="232" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">7</text><rect x="376" y="190" width="56" height="64" rx="8" fill="#fff" stroke="#d0d7de"/><text x="404" y="232" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">4</text><rect x="446" y="190" width="56" height="64" rx="8" fill="#fff" stroke="#d0d7de"/><text x="474" y="232" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">1</text><rect x="516" y="190" width="56" height="64" rx="8" fill="#fff" stroke="#d0d7de"/><text x="544" y="232" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">8</text><rect x="586" y="190" width="56" height="64" rx="8" fill="#fff" stroke="#d0d7de"/><text x="614" y="232" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">5</text><rect x="656" y="190" width="56" height="64" rx="8" fill="#fff" stroke="#d0d7de"/><text x="684" y="232" font-size="26" font-weight="bold" fill="#1f2328" text-anchor="middle">2</text>
  <text x="450" y="296" font-size="14" fill="#59636e" text-anchor="middle">Didn’t get your email?</text><text x="450" y="320" font-size="14" fill="#0969da" text-anchor="middle">Resend the code</text>
  <rect x="160" y="184" width="568" height="76" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="160" cy="184" r="11" fill="#e53e3e"/><text x="160" y="189" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="0.5" y="380" width="899" height="48" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="410" font-size="15" font-weight="bold" fill="#c53030">1. 登録したメールアドレスに届いたコードを入れる</text>
</svg>
