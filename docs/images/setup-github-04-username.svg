<svg xmlns="http://www.w3.org/2000/svg" width="900" height="544" viewBox="0 0 900 544" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>GitHub のユーザー名を確認する画面</title>
  <desc>GitHub にサインインした画面。右上の丸いアイコンを押すと、メニューが開き、「Signed in as」の下にユーザー名が出る。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="544" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="469" fill="#ffffff" stroke="#999"/>
  <rect x="0.5" y="0.5" width="899" height="44" fill="#dfe3e8" stroke="#999"/>
  <circle cx="20" cy="22" r="6" fill="#ef5350"/><circle cx="40" cy="22" r="6" fill="#ffb300"/><circle cx="60" cy="22" r="6" fill="#43a047"/>
  <rect x="86" y="7" width="790" height="30" rx="15" fill="#ffffff" stroke="#c4c7cc"/><text x="106" y="27" font-size="14" fill="#333">https://github.com/</text><rect x="1" y="45" width="898" height="56" fill="#f6f8fa"/><line x1="1" y1="101" x2="899" y2="101" stroke="#d0d7de"/><rect x="14" y="57" width="34" height="32" rx="6" fill="#fff" stroke="#d0d7de"/><path d="M22,67 h18 M22,73 h18 M22,79 h18" stroke="#444" stroke-width="2" stroke-linecap="round"/><circle cx="76" cy="73" r="16" fill="#1f2328"/><path d="M67.2,71.4 q0,-9.6 8.8,-9.6 q8.8,0 8.8,9.6 q0,8.8 -8.8,8.8 q-8.8,0 -8.8,-8.8 z M67.2,69.8 l1.6,-9.6 l6.4,4.8 z M84.8,69.8 l-1.6,-9.6 l-6.4,4.8 z" fill="#ffffff"/><text x="104" y="79" font-size="14" font-weight="bold" fill="#1f2328">Home</text><rect x="420" y="58" width="220" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><circle cx="436" cy="72" r="5.5" fill="none" stroke="#666" stroke-width="1.8"/><path d="M440.5,76.5 l4.5,4.5" stroke="#666" stroke-width="1.8" stroke-linecap="round"/><text x="456" y="78" font-size="13" fill="#59636e">Type / to search</text><rect x="656" y="58" width="54" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><path d="M664,73 h14 M671,66 v14" stroke="#444" stroke-width="2" stroke-linecap="round"/><path d="M688,71 l5,5 l5,-5" stroke="#555" stroke-width="1.6" fill="none"/><rect x="718" y="58" width="34" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><circle cx="735" cy="73" r="7" fill="none" stroke="#444" stroke-width="1.8"/><circle cx="735" cy="73" r="1.8" fill="#444"/><rect x="758" y="58" width="34" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><circle cx="770" cy="68" r="2.6" fill="none" stroke="#444" stroke-width="1.8"/><circle cx="770" cy="78" r="2.6" fill="none" stroke="#444" stroke-width="1.8"/><circle cx="780" cy="78" r="2.6" fill="none" stroke="#444" stroke-width="1.8"/><path d="M770,70.6 v4.8 M780,75.4 v-4 a3,3 0 0 0 -3,-3 h-3" fill="none" stroke="#444" stroke-width="1.8"/><rect x="798" y="58" width="34" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><path d="M806,74 l3,-7 h10 l3,7 v6 h-16 z M806,74 h5 a3,3 0 0 0 6,0 h5" fill="none" stroke="#444" stroke-width="1.8" stroke-linejoin="round"/><circle cx="862" cy="73" r="14" fill="#8250df"/><text x="862" y="78" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">ks</text>
  <text x="40" y="150" font-size="24" font-weight="bold" fill="#1f2328">Home</text>
  <text x="40" y="200" font-size="14" font-weight="bold" fill="#1f2328">Top repositories</text><rect x="176" y="182" width="52" height="28" rx="6" fill="#1f883d" stroke="#1b7f37"/><text x="202" y="201" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">New</text><rect x="40" y="218" width="260" height="30" rx="6" fill="#fff" stroke="#d0d7de"/><text x="54" y="238" font-size="13" fill="#59636e">Find a repository…</text><text x="40" y="280" font-size="13" fill="#0969da">your-org/git-practice-exercise</text>
  <rect x="608" y="104" width="262" height="340" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="624" y="130" font-size="13" fill="#59636e">Signed in as</text><text x="624" y="154" font-size="16" font-weight="bold" fill="#1f2328">your-username</text><line x1="609" y1="170" x2="869" y2="170" stroke="#d0d7de"/><text x="624" y="196" font-size="14" fill="#1f2328">Set status</text><line x1="609" y1="210" x2="869" y2="210" stroke="#d0d7de"/><text x="624" y="236" font-size="14" fill="#1f2328">Your profile</text><text x="624" y="268" font-size="14" fill="#1f2328">Your repositories</text><text x="624" y="300" font-size="14" fill="#1f2328">Your projects</text><text x="624" y="332" font-size="14" fill="#1f2328">Your stars</text><line x1="609" y1="366" x2="869" y2="366" stroke="#d0d7de"/><text x="624" y="392" font-size="14" fill="#1f2328">Settings</text><text x="624" y="424" font-size="14" fill="#1f2328">Sign out</text>
  <rect x="846" y="57" width="32" height="32" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="846" cy="57" r="11" fill="#e53e3e"/><text x="846" y="62" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="618" y="140" width="170" height="22" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="618" cy="140" r="11" fill="#e53e3e"/><text x="618" y="145" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="0.5" y="470" width="899" height="74" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="500" font-size="15" font-weight="bold" fill="#c53030">1. 右上の丸いアイコンを押して、メニューを開く</text>
  <text x="14" y="526" font-size="15" font-weight="bold" fill="#c53030">2. 「Signed in as」の下が、自分のユーザー名。メモしておく</text>
</svg>
