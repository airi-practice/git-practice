<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>64bit 版のダウンロードリンクの位置</title>
  <desc>64bit 版のダウンロードリンクの位置。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="274" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="250" rx="8" fill="#f7fafc" stroke="#999" stroke-width="2"/>
  <path d="M10 18a8 8 0 0 1 8-8h864a8 8 0 0 1 8 8v32h-880z" fill="#e2e8f0" stroke="#999" stroke-width="2"/>
  <rect x="100" y="18" width="700" height="24" rx="12" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="118" y="35" font-size="13" fill="#333" font-family="Consolas, 'Courier New', monospace">https://tortoisegit.org/download/</text>
  <text x="870" y="37" font-size="18" fill="#666">×</text>
  <text x="40" y="92" font-size="20" font-weight="bold" fill="#222">Download TortoiseGit</text>
  <text x="40" y="131" font-size="15" fill="#222">Windows 用の Git 操作ソフト</text>
  <text x="40" y="163" font-size="15" fill="#222">TortoiseGit-(バージョン)-64bit.msi</text>
  <rect x="34" y="144" width="288.6" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <path d="M630,157 L330.6,157" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="640" y="163" font-size="15" font-weight="bold" fill="#c53030">1. 64bit 版を押す</text>
</svg>
