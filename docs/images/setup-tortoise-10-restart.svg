<svg xmlns="http://www.w3.org/2000/svg" width="900" height="256" viewBox="0 0 900 256" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>再起動を求める画面</title>
  <desc>再起動を求める画面。実際の画面を再現した図で、赤い枠と番号の説明が、この手順で操作する場所を示す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="900" height="256" fill="#ffffff"/>
  <rect x="10" y="10" width="620" height="232" rx="6" fill="#fff" stroke="#7a7a7a" stroke-width="1.5"/>
  <rect x="11" y="11" width="618" height="31" fill="#fff"/><ellipse cx="28" cy="27" rx="9.350000000000001" ry="6.6000000000000005" fill="#7fb0cf" stroke="#2f5f7d" stroke-width="0.8250000000000001"/><circle cx="37.9" cy="25.9" r="2.75" fill="#a9cfe4" stroke="#2f5f7d" stroke-width="0.8250000000000001"/><text x="27.45" y="29.75" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Git</text><text x="48" y="31" font-size="13" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">TortoiseGit 2.19.1.0 (64 bit) Setup</text><path d="M610 22l10 10M620 22l-10 10" stroke="#222" stroke-width="1.2" fill="none"/>
  <rect x="11" y="42" width="618" height="199" fill="#f0f0f0"/>
  <text x="40" y="74" font-size="14" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">You must restart your system for the configuration</text>
  <text x="40" y="96" font-size="14" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">changes made to TortoiseGit to take effect.</text>
  <text x="40" y="118" font-size="14" fill="#1a1a1a" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Click Yes to restart now or No if you plan to restart later.</text>
  <rect x="410" y="190" width="90" height="30" rx="3" fill="#fdfdfd" stroke="#0078d4" stroke-width="2"/><text x="455" y="210" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">Yes</text><rect x="510" y="190" width="90" height="30" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="555" y="210" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="'Segoe UI', Tahoma, Meiryo, sans-serif">No</text>
  <rect x="407" y="187" width="96" height="36" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <path d="M455,168 L455,184" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="455" y="162" font-size="15" font-weight="bold" fill="#c53030" text-anchor="middle">1. 「Yes」を押す</text>
</svg>
