  <path d="M464,278 L464,294" stroke="#e53e3e" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="464" y="272" font-size="15" font-weight="bold" fill="#c53030" text-anchor="middle">3. 「Next」を押す</text>
