<svg xmlns="http://www.w3.org/2000/svg" width="560" height="540" viewBox="0 0 560 540" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>TortoiseGit のプル画面</title>
  <desc>TortoiseGit の「プル」ダイアログ。取り込み元は、リモートが origin、リモートブランチが main。確かめて OK を押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="560" height="540" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="559" height="439" fill="#f0f0f0" stroke="#707070"/>
  <rect x="1" y="1" width="558" height="30" fill="#ffffff"/>
  <circle cx="14" cy="16" r="6" fill="#7a8ca5"/>
  <text x="280" y="21" font-size="13" fill="#1a1a1a" text-anchor="middle">プル - TortoiseGit</text>
  <path d="M533,11 L543,21 M543,11 L533,21" stroke="#222" stroke-width="1.2"/>
  <rect x="8" y="46" width="544" height="148" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="38" width="58" height="16" fill="#f0f0f0"/>
  <text x="17" y="51" font-size="13" fill="#1a1a1a">リモート</text><circle cx="27" cy="78" r="7" fill="#fff" stroke="#0067c0"/><circle cx="27" cy="78" r="4.5" fill="#0067c0"/><text x="42" y="83" font-size="13" fill="#1a1a1a">リモート(R):</text><rect x="204" y="66" width="316" height="26" rx="3" fill="#fff" stroke="#8a8a8a"/><text x="212" y="84" font-size="13" fill="#1a1a1a">origin</text><path d="M502,76 l5,5 l5,-5" stroke="#555" stroke-width="1.4" fill="none"/>
  <circle cx="27" cy="120" r="7" fill="#fff" stroke="#444"/><text x="42" y="125" font-size="13" fill="#1a1a1a">任意のURL:</text><rect x="204" y="108" width="316" height="26" rx="3" fill="#f4f4f4" stroke="#d0d0d0"/><path d="M502,118 l5,5 l5,-5" stroke="#bbb" stroke-width="1.4" fill="none"/><text x="20" y="168" font-size="13" fill="#1a1a1a">リモートブランチ(B):</text><rect x="204" y="151" width="316" height="26" rx="3" fill="#fff" stroke="#8a8a8a"/><path d="M204,177 h316" stroke="#0067c0" stroke-width="2"/><text x="212" y="169" font-size="13" fill="#1a1a1a">main</text><path d="M502,161 l5,5 l5,-5" stroke="#555" stroke-width="1.4" fill="none"/><rect x="531" y="152" width="24" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="543" y="170" font-size="13" fill="#1a1a1a" text-anchor="middle">...</text>
  <rect x="8" y="212" width="544" height="160" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="204" width="71" height="16" fill="#f0f0f0"/>
  <text x="17" y="217" font-size="13" fill="#1a1a1a">オプション</text><rect x="20" y="232" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="244" font-size="13" fill="#1a1a1a">融合(S)</text><rect x="228" y="232" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="250" y="244" font-size="13" fill="#1a1a1a">コミットしない(M)</text>
  <rect x="20" y="261" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="273" font-size="13" fill="#1a1a1a">ファストフォワードしない(F)</text><rect x="228" y="261" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="250" y="273" font-size="13" fill="#1a1a1a">ファストフォワードのみ(N)</text>
  <rect x="20" y="291" width="14" height="14" rx="2" fill="#0067c0" stroke="#0067c0"/><path d="M23,298 h8" stroke="#fff" stroke-width="2"/><text x="42" y="303" font-size="13" fill="#1a1a1a">タグ</text><text x="228" y="303" font-size="13" fill="#1a1a1a">デフォルト: 到達可能</text><rect x="20" y="320" width="14" height="14" rx="2" fill="#0067c0" stroke="#0067c0"/><path d="M23,327 h8" stroke="#fff" stroke-width="2"/><text x="42" y="332" font-size="13" fill="#1a1a1a">リモートに無いブランチを削除</text>
  <rect x="20" y="354" width="14" height="14" rx="2" fill="#fff" stroke="#bbb"/><text x="42" y="366" font-size="13" fill="#8a8a8a">Putty 鍵の自動ロード(K)</text><text x="300" y="362" font-size="13" fill="#0b57d0">リモートを管理</text><rect x="20" y="380" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="392" font-size="13" fill="#1a1a1a">フェッチ後にリベース(L)</text>
  <rect x="277" y="404" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#0067c0" stroke-width="2"/><text x="321" y="422" font-size="13" fill="#1a1a1a" text-anchor="middle">OK</text><rect x="372" y="404" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="416" y="422" font-size="13" fill="#1a1a1a" text-anchor="middle">キャンセル</text><rect x="468" y="404" width="82" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="509" y="422" font-size="13" fill="#1a1a1a" text-anchor="middle">ヘルプ</text>
  <rect x="204" y="66" width="316" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="204" cy="66" r="11" fill="#e53e3e"/><text x="204" y="71" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="204" y="151" width="316" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="204" cy="151" r="11" fill="#e53e3e"/><text x="204" y="156" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="277" y="404" width="88" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="277" cy="404" r="11" fill="#e53e3e"/><text x="277" y="409" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <rect x="0.5" y="440" width="559" height="100" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="470" font-size="15" font-weight="bold" fill="#c53030">1. 取り込み元のリモート(Remote)が origin</text>
  <text x="14" y="496" font-size="15" font-weight="bold" fill="#c53030">2. リモートブランチが main</text>
  <text x="14" y="522" font-size="15" font-weight="bold" fill="#c53030">3. 確かめたら OK を押す</text>
</svg>
