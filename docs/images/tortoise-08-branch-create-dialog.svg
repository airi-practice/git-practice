<svg xmlns="http://www.w3.org/2000/svg" width="510" height="520" viewBox="0 0 510 520" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>TortoiseGit のブランチを作成する画面</title>
  <desc>TortoiseGit の「ブランチを作成」ダイアログ。名前の欄(Branch)に add-line と入力し、「新しいブランチに切り替える」(Switch to new branch)にチェックを入れて OK を押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="510" height="520" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="509" height="419" fill="#f0f0f0" stroke="#707070"/>
  <rect x="1" y="1" width="508" height="30" fill="#ffffff"/>
  <circle cx="14" cy="16" r="6" fill="#7a8ca5"/>
  <text x="255" y="21" font-size="13" fill="#1a1a1a" text-anchor="middle">ブランチを作成 - TortoiseGit</text>
  <path d="M483,11 L493,21 M493,11 L483,21" stroke="#222" stroke-width="1.2"/>
  <rect x="8" y="46" width="494" height="66" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="38" width="71" height="16" fill="#f0f0f0"/>
  <text x="17" y="51" font-size="13" fill="#1a1a1a">名前(N)</text><text x="30" y="77" font-size="13" fill="#1a1a1a">ブランチ</text><rect x="143" y="58" width="300" height="26" rx="3" fill="#fff" stroke="#8a8a8a"/><path d="M143,84 h300" stroke="#0067c0" stroke-width="2"/><text x="151" y="76" font-size="14" fill="#1a1a1a">add-line</text><path d="M213,63 v14" stroke="#000"/>
  <rect x="8" y="126" width="494" height="148" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="118" width="32" height="16" fill="#f0f0f0"/>
  <text x="17" y="131" font-size="13" fill="#1a1a1a">基点</text><circle cx="27" cy="155" r="7" fill="#fff" stroke="#0067c0"/><circle cx="27" cy="155" r="4.5" fill="#0067c0"/><text x="42" y="160" font-size="13" fill="#1a1a1a">HEAD (main)</text>
  <circle cx="27" cy="185" r="7" fill="#fff" stroke="#444"/><text x="42" y="190" font-size="13" fill="#1a1a1a">ブランチ(B)</text><rect x="143" y="174" width="300" height="26" rx="3" fill="#f4f4f4" stroke="#d0d0d0"/><text x="151" y="192" font-size="13" fill="#8a8a8a">main</text><path d="M425,184 l5,5 l5,-5" stroke="#bbb" stroke-width="1.4" fill="none"/><rect x="460" y="174" width="30" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="475" y="192" font-size="13" fill="#1a1a1a" text-anchor="middle">...</text>
  <circle cx="27" cy="215" r="7" fill="#fff" stroke="#444"/><text x="42" y="220" font-size="13" fill="#1a1a1a">タグ(T)</text><rect x="143" y="205" width="300" height="26" rx="3" fill="#f4f4f4" stroke="#d0d0d0"/><path d="M425,215 l5,5 l5,-5" stroke="#bbb" stroke-width="1.4" fill="none"/>
  <circle cx="27" cy="245" r="7" fill="#fff" stroke="#444"/><text x="42" y="250" font-size="13" fill="#1a1a1a">コミット(C)</text><rect x="143" y="235" width="300" height="26" rx="3" fill="#f4f4f4" stroke="#d0d0d0"/><path d="M425,245 l5,5 l5,-5" stroke="#bbb" stroke-width="1.4" fill="none"/><rect x="460" y="235" width="30" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="475" y="253" font-size="13" fill="#1a1a1a" text-anchor="middle">...</text>
  <rect x="8" y="290" width="494" height="50" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="282" width="71" height="16" fill="#f0f0f0"/>
  <text x="17" y="295" font-size="13" fill="#1a1a1a">オプション</text><rect x="20" y="310" width="14" height="14" rx="2" fill="#0067c0" stroke="#0067c0"/><path d="M23,317 h8" stroke="#fff" stroke-width="2"/><text x="42" y="322" font-size="13" fill="#8a8a8a">追跡(K)</text><rect x="155" y="310" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="177" y="322" font-size="13" fill="#1a1a1a">強制(F)</text><rect x="275" y="310" width="14" height="14" rx="2" fill="#0067c0" stroke="#0067c0"/><path d="M278,317 l3,3 l5,-6" stroke="#fff" stroke-width="2" fill="none"/><text x="297" y="322" font-size="13" fill="#1a1a1a">新しいブランチに切り替える(S)</text>
  <rect x="8" y="346" width="494" height="66" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="338" width="32" height="16" fill="#f0f0f0"/>
  <text x="17" y="351" font-size="13" fill="#1a1a1a">説明</text><rect x="18" y="354" width="456" height="44" fill="#fff" stroke="#8a8a8a"/><rect x="474" y="354" width="18" height="44" fill="#f0f0f0" stroke="#ddd"/>
  <rect x="212" y="378" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#0067c0" stroke-width="2"/><text x="256" y="396" font-size="13" fill="#1a1a1a" text-anchor="middle">OK</text><rect x="314" y="378" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="358" y="396" font-size="13" fill="#1a1a1a" text-anchor="middle">キャンセル</text><rect x="416" y="378" width="82" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="457" y="396" font-size="13" fill="#1a1a1a" text-anchor="middle">ヘルプ</text>
  <rect x="143" y="58" width="300" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="143" cy="58" r="11" fill="#e53e3e"/><text x="143" y="63" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="273" y="306" width="224" height="22" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="273" cy="306" r="11" fill="#e53e3e"/><text x="273" y="311" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="212" y="378" width="88" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="212" cy="378" r="11" fill="#e53e3e"/><text x="212" y="383" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <rect x="0.5" y="420" width="509" height="100" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="450" font-size="15" font-weight="bold" fill="#c53030">1. 名前の欄(Branch)に add-line と入力</text>
  <text x="14" y="476" font-size="15" font-weight="bold" fill="#c53030">2. 「新しいブランチに切り替える」にチェック</text>
  <text x="14" y="502" font-size="15" font-weight="bold" fill="#c53030">3. OK を押す</text>
</svg>
