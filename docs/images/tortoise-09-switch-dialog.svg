<svg xmlns="http://www.w3.org/2000/svg" width="507" height="443" viewBox="0 0 507 443" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>TortoiseGit のブランチ切り替え画面</title>
  <desc>TortoiseGit の「切り替え/チェックアウト」ダイアログ。ブランチ(Branch)の欄で main を選んで OK を押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="507" height="443" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="506" height="368" fill="#f0f0f0" stroke="#707070"/>
  <rect x="1" y="1" width="505" height="30" fill="#ffffff"/>
  <circle cx="14" cy="16" r="6" fill="#7a8ca5"/>
  <text x="253.5" y="21" font-size="13" fill="#1a1a1a" text-anchor="middle">切り替え/チェックアウト - TortoiseGit</text>
  <path d="M480,11 L490,21 M490,11 L480,21" stroke="#222" stroke-width="1.2"/>
  <rect x="8" y="46" width="490" height="112" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="38" width="71" height="16" fill="#f0f0f0"/>
  <text x="17" y="51" font-size="13" fill="#1a1a1a">切り替え先</text><circle cx="27" cy="78" r="7" fill="#fff" stroke="#0067c0"/><circle cx="27" cy="78" r="4.5" fill="#0067c0"/><text x="42" y="83" font-size="13" fill="#1a1a1a">ブランチ(B)</text><rect x="147" y="63" width="295" height="26" rx="3" fill="#fff" stroke="#8a8a8a"/><text x="155" y="81" font-size="13" fill="#1a1a1a">main</text><path d="M424,73 l5,5 l5,-5" stroke="#555" stroke-width="1.4" fill="none"/><rect x="459" y="64" width="30" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="474" y="82" font-size="13" fill="#1a1a1a" text-anchor="middle">...</text>
  <circle cx="27" cy="106" r="7" fill="#fff" stroke="#444"/><text x="42" y="111" font-size="13" fill="#1a1a1a">タグ(T)</text><rect x="147" y="94" width="295" height="26" rx="3" fill="#f4f4f4" stroke="#d0d0d0"/><path d="M424,104 l5,5 l5,-5" stroke="#bbb" stroke-width="1.4" fill="none"/><circle cx="27" cy="136" r="7" fill="#fff" stroke="#444"/><text x="42" y="141" font-size="13" fill="#1a1a1a">コミット(C)</text><rect x="147" y="124" width="295" height="26" rx="3" fill="#f4f4f4" stroke="#d0d0d0"/><path d="M424,134 l5,5 l5,-5" stroke="#bbb" stroke-width="1.4" fill="none"/><rect x="459" y="124" width="30" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="474" y="142" font-size="13" fill="#1a1a1a" text-anchor="middle">...</text>
  <rect x="8" y="176" width="490" height="142" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="168" width="71" height="16" fill="#f0f0f0"/>
  <text x="17" y="181" font-size="13" fill="#1a1a1a">オプション</text><rect x="20" y="199" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="211" font-size="13" fill="#1a1a1a">新しいブランチを作成(N)</text><rect x="190" y="193" width="255" height="24" rx="3" fill="#fff" stroke="#8a8a8a"/><text x="198" y="210" font-size="12" fill="#8a8a8a">Branch_main</text>
  <rect x="20" y="229" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="241" font-size="13" fill="#1a1a1a">作業ツリーの変更を上書きする (force)</text><rect x="342" y="229" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="364" y="241" font-size="13" fill="#1a1a1a">マージ(M)</text>
  <rect x="20" y="260" width="14" height="14" rx="2" fill="#fff" stroke="#bbb"/><text x="42" y="272" font-size="13" fill="#8a8a8a">追跡(R)</text><rect x="20" y="290" width="14" height="14" rx="2" fill="#fff" stroke="#bbb"/><text x="42" y="302" font-size="13" fill="#8a8a8a">既存のブランチがあれば上書きする(O)</text>
  <rect x="214" y="335" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#0067c0" stroke-width="2"/><text x="258" y="353" font-size="13" fill="#1a1a1a" text-anchor="middle">OK</text><rect x="314" y="335" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="358" y="353" font-size="13" fill="#1a1a1a" text-anchor="middle">キャンセル</text><rect x="414" y="335" width="82" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="455" y="353" font-size="13" fill="#1a1a1a" text-anchor="middle">ヘルプ</text>
  <rect x="147" y="63" width="295" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="147" cy="63" r="11" fill="#e53e3e"/><text x="147" y="68" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="214" y="335" width="88" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="214" cy="335" r="11" fill="#e53e3e"/><text x="214" y="340" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="0.5" y="369" width="506" height="74" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="399" font-size="15" font-weight="bold" fill="#c53030">1. ブランチ(Branch)の欄で main を選ぶ</text>
  <text x="14" y="425" font-size="15" font-weight="bold" fill="#c53030">2. OK を押す</text>
</svg>
