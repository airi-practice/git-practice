<svg xmlns="http://www.w3.org/2000/svg" width="480" height="526" viewBox="0 0 480 526" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>TortoiseGit の変更の取り消し画面</title>
  <desc>TortoiseGit の「変更の取り消し」ダイアログ。変更したファイルの一覧で memo.txt にチェックが付いているのを確かめて OK を押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="480" height="526" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="477" height="451" fill="#f0f0f0" stroke="#707070"/>
  <rect x="1" y="1" width="476" height="30" fill="#ffffff"/>
  <circle cx="14" cy="16" r="6" fill="#7a8ca5"/>
  <text x="239" y="21" font-size="13" fill="#1a1a1a" text-anchor="middle">変更の取り消し - TortoiseGit</text>
  <path d="M451,11 L461,21 M461,11 L451,21" stroke="#222" stroke-width="1.2"/>
  <rect x="414" y="11" width="10" height="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <path d="M372,16 h10" stroke="#222" stroke-width="1.2"/>
  <rect x="10" y="38" width="458" height="346" fill="#fff" stroke="#999"/><path d="M120,39 V383 M179,39 V383 M225,39 V383 M303,39 V383 M381,39 V383" stroke="#e8f0f8"/>
  <text x="16" y="56" font-size="14" fill="#1a1a1a">パス</text><text x="127" y="56" font-size="13" fill="#1a1a1a">拡張子</text><text x="186" y="56" font-size="13" fill="#1a1a1a">状態</text><text x="236" y="56" font-size="13" fill="#1a1a1a">追加した行</text><text x="314" y="56" font-size="13" fill="#1a1a1a">削除した行</text>
  <rect x="11" y="64" width="368" height="20" fill="#e5f3ff"/><rect x="14" y="67" width="14" height="14" rx="2" fill="#0067c0" stroke="#0067c0"/><path d="M17,74 l3,3 l5,-6" stroke="#fff" stroke-width="2" fill="none"/><rect x="33" y="65" width="14" height="17" fill="#fff" stroke="#888"/><path d="M36,71 h8 M36,75 h8" stroke="#c0c" stroke-width="1.5"/><text x="50" y="79" font-size="13" fill="#0b57d0">memo.txt</text><text x="127" y="79" font-size="13" fill="#0b57d0">.txt</text><text x="186" y="79" font-size="13" fill="#0b57d0">変更</text><text x="293" y="79" font-size="13" fill="#0b57d0" text-anchor="end">1</text><text x="375" y="79" font-size="13" fill="#0b57d0" text-anchor="end">0</text>
  <path d="M376,285 q60,-30 70,10 q-10,30 -70,40 q-30,0 -10,-20 q30,5 50,-10 q-20,-20 -40,-5 z" fill="#c9c6e6" opacity="0.7"/>
  <rect x="12" y="390" width="14" height="14" rx="2" fill="#0067c0" stroke="#0067c0"/><path d="M15,397 l3,3 l5,-6" stroke="#fff" stroke-width="2" fill="none"/><text x="34" y="402" font-size="13" fill="#1a1a1a">すべてを選択/解除(A)</text>
  <rect x="177" y="421" width="85" height="26" rx="3" fill="#fdfdfd" stroke="#0067c0" stroke-width="2"/><text x="219.5" y="439" font-size="13" fill="#1a1a1a" text-anchor="middle">OK</text><rect x="282" y="421" width="85" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="324.5" y="439" font-size="13" fill="#1a1a1a" text-anchor="middle">キャンセル</text><rect x="382" y="421" width="85" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="424.5" y="439" font-size="13" fill="#1a1a1a" text-anchor="middle">ヘルプ</text>
  <rect x="11" y="64" width="368" height="20" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="11" cy="64" r="11" fill="#e53e3e"/><text x="11" y="69" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
