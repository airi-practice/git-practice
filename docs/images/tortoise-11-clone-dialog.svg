<svg xmlns="http://www.w3.org/2000/svg" width="560" height="524" viewBox="0 0 560 524" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>TortoiseGit のクローン画面</title>
  <desc>TortoiseGit の「クローン」ダイアログ。URL の欄に演習用リポジトリの URL を入れ、ディレクトリの欄に複製先のフォルダーの場所を入れて OK を押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="560" height="524" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="559" height="423" fill="#f0f0f0" stroke="#707070"/>
  <rect x="1" y="1" width="558" height="30" fill="#ffffff"/>
  <circle cx="14" cy="16" r="6" fill="#7a8ca5"/>
  <text x="280" y="21" font-size="13" fill="#1a1a1a" text-anchor="middle">クローン - TortoiseGit</text>
  <path d="M533,11 L543,21 M543,11 L533,21" stroke="#222" stroke-width="1.2"/>
  <rect x="8" y="46" width="544" height="142" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="38" width="97" height="16" fill="#f0f0f0"/>
  <text x="17" y="51" font-size="13" fill="#1a1a1a">複製元と複製先</text>
  <text x="20" y="86" font-size="13" fill="#1a1a1a">URL:</text><rect x="120" y="68" width="366" height="26" rx="3" fill="#fff" stroke="#8a8a8a"/><text x="128" y="86" font-size="13" fill="#1a1a1a">https://github.com/…/git-practice-exercise.git</text><path d="M468,78 l5,5 l5,-5" stroke="#555" stroke-width="1.4" fill="none"/><rect x="498" y="68" width="44" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="520" y="86" font-size="13" fill="#1a1a1a" text-anchor="middle">...</text>
  <text x="20" y="142" font-size="13" fill="#1a1a1a">ディレクトリ:</text><rect x="120" y="124" width="366" height="26" rx="3" fill="#fff" stroke="#8a8a8a"/><text x="128" y="142" font-size="13" fill="#1a1a1a">C:\Users\…\git-practice-exercise</text><path d="M468,134 l5,5 l5,-5" stroke="#555" stroke-width="1.4" fill="none"/><rect x="498" y="124" width="44" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="520" y="142" font-size="13" fill="#1a1a1a" text-anchor="middle">...</text>
  <rect x="8" y="204" width="544" height="118" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="196" width="71" height="16" fill="#f0f0f0"/>
  <text x="17" y="209" font-size="13" fill="#1a1a1a">オプション</text>
  <rect x="20" y="226" width="14" height="14" rx="2" fill="#fff" stroke="#bbb"/><text x="42" y="238" font-size="13" fill="#8a8a8a">Putty 鍵のロード(K)</text><rect x="290" y="226" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="312" y="238" font-size="13" fill="#1a1a1a">再帰的(サブモジュール)(R)</text>
  <rect x="20" y="256" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="268" font-size="13" fill="#1a1a1a">ベアリポジトリにクローン(B)</text><rect x="290" y="256" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="312" y="268" font-size="13" fill="#1a1a1a">チェックアウトしない(N)</text>
  <rect x="20" y="286" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="298" font-size="13" fill="#1a1a1a">ブランチ指定(R)</text><rect x="290" y="286" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="312" y="298" font-size="13" fill="#1a1a1a">深さ(D)</text>
  <rect x="277" y="380" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#0067c0" stroke-width="2"/><text x="321" y="398" font-size="13" fill="#1a1a1a" text-anchor="middle">OK</text><rect x="372" y="380" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="416" y="398" font-size="13" fill="#1a1a1a" text-anchor="middle">キャンセル</text><rect x="468" y="380" width="82" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="509" y="398" font-size="13" fill="#1a1a1a" text-anchor="middle">ヘルプ</text>
  <rect x="120" y="68" width="366" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="120" cy="68" r="11" fill="#e53e3e"/><text x="120" y="73" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="120" y="124" width="366" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="120" cy="124" r="11" fill="#e53e3e"/><text x="120" y="129" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="277" y="380" width="88" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="277" cy="380" r="11" fill="#e53e3e"/><text x="277" y="385" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <rect x="0.5" y="424" width="559" height="100" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="454" font-size="15" font-weight="bold" fill="#c53030">1. URL の欄に、演習用リポジトリの URL を入れる</text>
  <text x="14" y="480" font-size="15" font-weight="bold" fill="#c53030">2. ディレクトリの欄に、複製先のフォルダーを入れる</text>
  <text x="14" y="506" font-size="15" font-weight="bold" fill="#c53030">3. OK を押す</text>
</svg>
