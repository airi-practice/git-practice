<svg xmlns="http://www.w3.org/2000/svg" width="831" height="915" viewBox="0 0 831 915" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>TortoiseGit のコミット画面（新しいファイルを記録する）</title>
  <desc>TortoiseGit の「コミット」ダイアログ。コミット先が ks/banana になっている。メッセージ欄に「ほしいものリストを追加」と書き、バージョン管理外の欄に出た practice/wishlist-ks.txt にチェックが付いているのを確かめて、コミットを押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="831" height="915" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="830" height="788" fill="#f0f0f0" stroke="#707070"/>
  <rect x="1" y="1" width="829" height="30" fill="#ffffff"/>
  <circle cx="14" cy="16" r="6" fill="#7a8ca5"/>
  <text x="415.5" y="21" font-size="13" fill="#1a1a1a" text-anchor="middle">コミット - TortoiseGit</text>
  <path d="M804,11 L814,21 M814,11 L804,21" stroke="#222" stroke-width="1.2"/>
  <rect x="767" y="11" width="10" height="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <path d="M725,16 h10" stroke="#222" stroke-width="1.2"/>
  <text x="6" y="52" font-size="13" fill="#1a1a1a">コミット先:</text><text x="95" y="52" font-size="13" fill="#1a1a1a">ks/banana</text><rect x="415" y="41" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="437" y="53" font-size="13" fill="#1a1a1a">新しいブランチ</text>
  <rect x="8" y="72" width="814" height="248" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="64" width="123" height="16" fill="#f0f0f0"/>
  <text x="17" y="77" font-size="13" fill="#1a1a1a">メッセージ(M):</text>
  <rect x="18" y="90" width="794" height="137" rx="3" fill="#fff" stroke="#8a8a8a"/><text x="26" y="112" font-size="14" fill="#1a1a1a">ほしいものリストを追加</text><text x="796" y="240" font-size="12" fill="#1a1a1a" text-anchor="end">1/1</text>
  <rect x="20" y="241" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="253" font-size="13" fill="#1a1a1a">最後のコミットをやり直し(L)</text><rect x="20" y="267" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="279" font-size="13" fill="#1a1a1a">著述日時を設定する(D)</text><rect x="20" y="293" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="305" font-size="13" fill="#1a1a1a">作者を設定(T)</text>
  <rect x="212" y="289" width="420" height="24" fill="#f4f4f4" stroke="#ddd"/><rect x="663" y="289" width="150" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="738" y="307" font-size="13" fill="#1a1a1a" text-anchor="middle">Signed-off-by を追加 (S)</text>
  <rect x="8" y="342" width="814" height="396" fill="none" stroke="#d5d5d5"/>
  <rect x="14" y="334" width="760" height="16" fill="#f0f0f0"/>
  <text x="17" y="347" font-size="13" fill="#1a1a1a">Changes made (F5: refresh, double-click on file for diff):</text>
  <text x="20" y="365" font-size="12" fill="#1a1a1a">チェック:</text><text x="75" y="365" font-size="13" font-weight="bold" fill="#1a1a1a">すべて(A)</text><text x="134" y="365" font-size="13" font-weight="bold" fill="#1a1a1a">無し(N)</text><text x="184" y="365" font-size="13" font-weight="bold" fill="#1a1a1a">バージョン管理外</text><text x="290" y="365" font-size="13" fill="#aaa">バージョン管理下</text><text x="396" y="365" font-size="13" fill="#aaa">追加</text><text x="433" y="365" font-size="13" fill="#aaa">削除</text><text x="470" y="365" font-size="13" fill="#aaa">変更</text><text x="507" y="365" font-size="13" font-weight="bold" fill="#1a1a1a">ファイル</text><text x="556" y="365" font-size="13" fill="#aaa">サブモジュール</text>
  <rect x="22" y="376" width="790" height="284" fill="#fff" stroke="#999"/>
  <text x="28" y="394" font-size="14" fill="#1a1a1a">パス</text><path d="M24,404 H810" stroke="#e5e5e5"/>
  <text x="34" y="420" font-size="12" fill="#0b57d0">バージョン管理下のファイルではありません</text><path d="M250,416 H800" stroke="#c9d6f0"/>
  <rect x="24" y="424" width="778" height="20" fill="#d9d9d9"/><rect x="26" y="426" width="14" height="14" rx="2" fill="#0067c0" stroke="#0067c0"/><path d="M29,433 l3,3 l5,-6" stroke="#fff" stroke-width="2" fill="none"/><rect x="43" y="426" width="14" height="16" fill="#fff" stroke="#888"/><path d="M46,432 h8 M46,436 h8" stroke="#c0c" stroke-width="1.5"/><text x="60" y="438" font-size="13" fill="#1a1a1a">practice/wishlist-ks.txt</text>
  <path d="M44,650 H606" stroke="#999" stroke-width="3"/>
  <rect x="20" y="676" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="688" font-size="13" fill="#1a1a1a">ステージングを使用（実験的)(O)</text><rect x="20" y="698" width="14" height="14" rx="2" fill="#0067c0" stroke="#0067c0"/><path d="M23,705 l3,3 l5,-6" stroke="#fff" stroke-width="2" fill="none"/><text x="42" y="710" font-size="13" fill="#1a1a1a">バージョン管理外のファイルを表示(U)</text><rect x="20" y="718" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="730" font-size="13" fill="#1a1a1a">サブモジュールを自動的に選択しない</text>
  <text x="630" y="676" font-size="12" fill="#1a1a1a">選択ファイル数 1、全体ファイル数 1</text>
  <rect x="20" y="746" width="14" height="14" rx="2" fill="#fff" stroke="#bbb"/><text x="42" y="758" font-size="13" fill="#8a8a8a">プロジェクト全体を表示(W)</text><rect x="20" y="766" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="42" y="778" font-size="13" fill="#1a1a1a">メッセージのみ (Y)</text>
  <rect x="511" y="758" width="98" height="26" rx="3" fill="#fdfdfd" stroke="#0067c0" stroke-width="2"/><text x="560" y="776" font-size="13" fill="#1a1a1a" text-anchor="middle">コミット(O)</text><rect x="609" y="758" width="20" height="26" fill="#fdfdfd" stroke="#adadad"/><path d="M614,769 l5,5 l5,-5" stroke="#555" fill="none"/><rect x="644" y="758" width="84" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="686" y="776" font-size="13" fill="#1a1a1a" text-anchor="middle">キャンセル</text><rect x="741" y="758" width="82" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="782" y="776" font-size="13" fill="#1a1a1a" text-anchor="middle">ヘルプ</text>
  <rect x="6" y="38" width="190" height="22" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="6" cy="38" r="11" fill="#e53e3e"/><text x="6" y="43" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="18" y="90" width="794" height="137" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="18" cy="90" r="11" fill="#e53e3e"/><text x="18" y="95" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="24" y="424" width="778" height="20" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="24" cy="424" r="11" fill="#e53e3e"/><text x="24" y="429" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <rect x="511" y="758" width="98" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="511" cy="758" r="11" fill="#e53e3e"/><text x="511" y="763" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <rect x="0.5" y="789" width="830" height="126" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="819" font-size="15" font-weight="bold" fill="#c53030">1. コミット先が、自分のブランチ(ks/banana)になっている</text>
  <text x="14" y="845" font-size="15" font-weight="bold" fill="#c53030">2. メッセージ欄に、何を変えたかを書く</text>
  <text x="14" y="871" font-size="15" font-weight="bold" fill="#c53030">3. 作ったファイルが、「バージョン管理外」の欄に出ている。チェックを入れる</text>
  <text x="14" y="897" font-size="15" font-weight="bold" fill="#c53030">4. コミットを押す</text>
</svg>
