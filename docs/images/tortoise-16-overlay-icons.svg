oke="#8a8a8a" stroke-width="1.5"/><path d="M666,52 v12 h12" fill="#eee" stroke="#8a8a8a" stroke-width="1.5"/><path d="M648,78 h22 M648,86 h22 M648,94 h16" stroke="#aaa" stroke-width="2"/><circle cx="670" cy="104" r="10" fill="#2fa84f" stroke="#fff" stroke-width="2"/><path d="M665,104 l3.5,4 l6,-8" stroke="#fff" stroke-width="2.4" fill="none"/><text x="660" y="130" font-size="14" fill="#222" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">wishlist-ks.txt</text>
