<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>TortoiseGit のログ画面（新しいファイルの記録）</title>
  <desc>TortoiseGit の「ログメッセージ」ダイアログ。一番上の記録「ほしいものリストを追加」を選ぶと、下の一覧に practice/wishlist-ks.txt が状態「追加」、追加した行が5、削除した行が0で出る。ファイルをダブルクリックすると、差分の画面が開く。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="760" height="500" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="399" fill="#f0f0f0" stroke="#707070"/>
  <rect x="1" y="1" width="758" height="30" fill="#ffffff"/>
  <circle cx="14" cy="16" r="6" fill="#7a8ca5"/>
  <text x="380" y="21" font-size="13" fill="#1a1a1a" text-anchor="middle">ログメッセージ - TortoiseGit</text>
  <path d="M733,11 L743,21 M743,11 L733,21" stroke="#222" stroke-width="1.2"/>
  <rect x="696" y="11" width="10" height="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <path d="M654,16 h10" stroke="#222" stroke-width="1.2"/>
  <text x="8" y="57" font-size="13" fill="#c00">ks/banana</text><path d="M8,60 h60" stroke="#c00"/>
  <rect x="170" y="41" width="400" height="26" rx="3" fill="#fff" stroke="#8a8a8a"/><text x="180" y="59" font-size="12" fill="#777">...み条件: 件名, メッセージ, パス, 作者, メール, SHA-1, Ref</text><rect x="580" y="41" width="170" height="26" rx="3" fill="#fff" stroke="#8a8a8a"/><text x="588" y="59" font-size="13" fill="#1a1a1a">作者メールアドレス</text><path d="M732,51 l5,5 l5,-5" stroke="#555" stroke-width="1.4" fill="none"/>
  <rect x="9" y="76" width="742" height="86" fill="#fff" stroke="#999"/>
  <path d="M78,78 V160 M168,78 V160 M600,78 V160" stroke="#e8f0f8"/>
  <text x="15" y="94" font-size="13" fill="#1a1a1a">グラフ</text><text x="85" y="94" font-size="13" fill="#1a1a1a">アクション</text><text x="175" y="94" font-size="13" fill="#1a1a1a">メッセージ</text><text x="607" y="94" font-size="13" fill="#1a1a1a">作者</text>
  <rect x="10" y="102" width="740" height="24" fill="#cce4f7" stroke="#3399ff" stroke-dasharray="2 2"/>
  <path d="M23,114 V138" stroke="#000" stroke-width="2"/><circle cx="23" cy="114" r="4" fill="#000"/><circle cx="23" cy="138" r="4" fill="#000"/>
  <rect x="171" y="104" width="80" height="18" rx="2" fill="#c00"/><text x="176" y="118" font-size="12" font-weight="bold" fill="#fff">ks/banana</text><text x="262" y="118" font-size="13" fill="#1a1a1a">ほしいものリストを追加</text><text x="175" y="142" font-size="13" fill="#1a1a1a">（これまでの記録）</text><text x="607" y="118" font-size="13" fill="#1a1a1a">your-name</text><text x="607" y="142" font-size="13" fill="#1a1a1a">someone</text>
  <rect x="9" y="172" width="742" height="22" fill="#fff" stroke="#999"/><text x="12" y="188" font-size="12" fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace">SHA-1:</text>
  <rect x="9" y="204" width="742" height="94" fill="#fff" stroke="#999"/><path d="M400,205 V297 M460,205 V297 M510,205 V297 M590,205 V297 M670,205 V297" stroke="#e8f0f8"/>
  <text x="15" y="222" font-size="13" fill="#1a1a1a">パス</text><text x="407" y="222" font-size="13" fill="#1a1a1a">拡張子</text><text x="467" y="222" font-size="13" fill="#1a1a1a">状態</text><text x="517" y="222" font-size="13" fill="#1a1a1a">追加した行</text><text x="597" y="222" font-size="13" fill="#1a1a1a">削除した行</text>
  <rect x="10" y="231" width="740" height="22" fill="#cce4f7"/><text x="15" y="246" font-size="13" fill="#0b57d0">practice/wishlist-ks.txt</text><text x="407" y="246" font-size="13" fill="#0b57d0">.txt</text><text x="467" y="246" font-size="13" fill="#0b57d0">追加</text><text x="580" y="246" font-size="13" fill="#0b57d0" text-anchor="end">5</text><text x="660" y="246" font-size="13" fill="#0b57d0" text-anchor="end">0</text>
  <text x="10" y="316" font-size="12" fill="#1a1a1a">件のリビジョンを表示中</text><text x="220" y="316" font-size="12" fill="#1a1a1a">1 件のリビジョンを選択、1 件のファイルを選択しています。</text>
  <rect x="10" y="330" width="14" height="14" rx="2" fill="#fff" stroke="#444"/><text x="32" y="342" font-size="13" fill="#1a1a1a">すべてのブランチ(A)</text><rect x="9" y="360" width="110" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="64" y="378" font-size="13" fill="#1a1a1a" text-anchor="middle">更新</text><rect x="665" y="360" width="86" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="708" y="378" font-size="13" fill="#1a1a1a" text-anchor="middle">OK</text>
  <rect x="10" y="102" width="740" height="24" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="10" cy="102" r="11" fill="#e53e3e"/><text x="10" y="107" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="10" y="231" width="740" height="22" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="10" cy="231" r="11" fill="#e53e3e"/><text x="10" y="236" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="517" y="233" width="70" height="20" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="600" cy="262" r="11" fill="#e53e3e"/><text x="600" y="267" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <rect x="0.5" y="400" width="759" height="100" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="430" font-size="15" font-weight="bold" fill="#c53030">1. 一番上の記録を選ぶ(いまコミットした記録)</text>
  <text x="14" y="456" font-size="15" font-weight="bold" fill="#c53030">2. 下の一覧に、作ったファイルが「追加」で出る。ダブルクリックで差分を開く</text>
  <text x="14" y="482" font-size="15" font-weight="bold" fill="#c53030">3. 追加した行が5(5つ書いた分)、削除した行は0</text>
</svg>
