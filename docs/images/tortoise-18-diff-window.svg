<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>TortoiseGit の差分の画面（新しいファイル）</title>
  <desc>TortoiseGitMerge の差分の画面。左の「変更前」には何もなく、右の「変更後」に書いた5行が緑色で並ぶ。新しいファイルなので、全部の行が追加された行として緑で示される。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="760" height="404" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="329" fill="#f0f0f0" stroke="#707070"/>
  <rect x="1" y="1" width="758" height="30" fill="#ffffff"/>
  <circle cx="14" cy="16" r="6" fill="#7a8ca5"/>
  <text x="380" y="21" font-size="13" fill="#1a1a1a" text-anchor="middle">practice/wishlist-ks.txt - TortoiseGitMerge</text>
  <path d="M733,11 L743,21 M743,11 L733,21" stroke="#222" stroke-width="1.2"/>
  <rect x="696" y="11" width="10" height="10" fill="none" stroke="#222" stroke-width="1.2"/>
  <path d="M654,16 h10" stroke="#222" stroke-width="1.2"/>
  <rect x="10" y="44" width="360" height="26" fill="#e8ecf2" stroke="#999"/><text x="20" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">変更前(前の記録)</text>
  <rect x="380" y="44" width="370" height="26" fill="#e8ecf2" stroke="#999"/><text x="390" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">変更後(いまコミットした記録)</text>
  <rect x="10" y="70" width="360" height="240" fill="#f2f2f2" stroke="#999"/><text x="190" y="190" font-size="14" fill="#777" text-anchor="middle">(何もない = 新しいファイル)</text>
  <rect x="380" y="70" width="370" height="240" fill="#fff" stroke="#999"/>
  <rect x="381" y="74" width="368" height="28" fill="#c9f0c9"/><text x="404" y="93" font-size="13" fill="#555" text-anchor="end" font-family="Consolas, 'Courier New', monospace">1</text><text x="420" y="93" font-size="15" fill="#1a1a1a">ゲーミングPC</text>
  <rect x="381" y="104" width="368" height="28" fill="#c9f0c9"/><text x="404" y="123" font-size="13" fill="#555" text-anchor="end" font-family="Consolas, 'Courier New', monospace">2</text><text x="420" y="123" font-size="15" fill="#1a1a1a">世界一周の旅行</text>
  <rect x="381" y="134" width="368" height="28" fill="#c9f0c9"/><text x="404" y="153" font-size="13" fill="#555" text-anchor="end" font-family="Consolas, 'Courier New', monospace">3</text><text x="420" y="153" font-size="15" fill="#1a1a1a">大きなテレビ</text>
  <rect x="381" y="164" width="368" height="28" fill="#c9f0c9"/><text x="404" y="183" font-size="13" fill="#555" text-anchor="end" font-family="Consolas, 'Courier New', monospace">4</text><text x="420" y="183" font-size="15" fill="#1a1a1a">おいしいお肉</text>
  <rect x="381" y="194" width="368" height="28" fill="#c9f0c9"/><text x="404" y="213" font-size="13" fill="#555" text-anchor="end" font-family="Consolas, 'Courier New', monospace">5</text><text x="420" y="213" font-size="15" fill="#1a1a1a">新しい自転車</text>
  <rect x="10" y="70" width="360" height="240" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="10" cy="70" r="11" fill="#e53e3e"/><text x="10" y="75" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="380" y="70" width="370" height="150" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="380" cy="70" r="11" fill="#e53e3e"/><text x="380" y="75" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="0.5" y="330" width="759" height="74" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="360" font-size="15" font-weight="bold" fill="#c53030">1. 左は変更前。新しいファイルなので、何もない</text>
  <text x="14" y="386" font-size="15" font-weight="bold" fill="#c53030">2. 右は変更後。追加した行が、緑色で示される</text>
</svg>
