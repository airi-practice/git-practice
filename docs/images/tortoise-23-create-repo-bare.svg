<svg xmlns="http://www.w3.org/2000/svg" width="480" height="264" viewBox="0 0 480 264" font-family="Meiryo, 'Yu Gothic', sans-serif">
  <title>TortoiseGit のリポジトリ作成画面（共有の置き場所）</title>
  <desc>TortoiseGit の「Create repository here...」で出る画面。Make it Bare（記録だけの置き場所にする）にチェックを入れて、OK を押す。</desc>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker>
  </defs>
  <rect width="480" height="264" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="419" height="189" fill="#f0f0f0" stroke="#707070"/>
  <rect x="1" y="1" width="418" height="30" fill="#ffffff"/>
  <circle cx="14" cy="16" r="6" fill="#7a8ca5"/>
  <text x="210" y="21" font-size="13" fill="#1a1a1a" text-anchor="middle">Create Repository - TortoiseGit</text>
  <path d="M393,11 L403,21 M403,11 L393,21" stroke="#222" stroke-width="1.2"/>
  <rect x="24" y="70" width="14" height="14" rx="2" fill="#0067c0" stroke="#0067c0"/><path d="M27,77 l3,3 l5,-6" stroke="#fff" stroke-width="2" fill="none"/><text x="46" y="82" font-size="13" fill="#1a1a1a">Make it Bare</text><text x="150" y="82" font-size="13" fill="#1a1a1a">(記録だけの置き場所にする)</text>
  <rect x="138" y="140" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#0067c0" stroke-width="2"/><text x="182" y="158" font-size="13" fill="#1a1a1a" text-anchor="middle">OK</text><rect x="236" y="140" width="88" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="280" y="158" font-size="13" fill="#1a1a1a" text-anchor="middle">Cancel</text><rect x="334" y="140" width="78" height="26" rx="3" fill="#fdfdfd" stroke="#adadad" stroke-width="1"/><text x="373" y="158" font-size="13" fill="#1a1a1a" text-anchor="middle">Help</text>
  <rect x="18" y="64" width="126" height="24" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="18" cy="64" r="11" fill="#e53e3e"/><text x="18" y="69" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <rect x="138" y="140" width="88" height="26" rx="4" fill="none" stroke="#e53e3e" stroke-width="2"/><circle cx="138" cy="140" r="11" fill="#e53e3e"/><text x="138" y="145" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="0.5" y="190" width="479" height="74" fill="#fff5f5" stroke="#e5b5b5"/>
  <text x="14" y="220" font-size="15" font-weight="bold" fill="#c53030">1. Make it Bare(記録だけの置き場所にする)にチェックを入れる</text>
  <text x="14" y="246" font-size="15" font-weight="bold" fill="#c53030">2. OK を押す</text>
</svg>
